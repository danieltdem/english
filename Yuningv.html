<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寧寧的暗夜單字冒險樂園 🚀</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #161f30;
      --card-border: #22324d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-pink: #f43f5e;
      --accent-green: #10b981;
      --accent-yellow: #fbbf24;
      --accent-purple: #a855f7;
      --input-bg: #0f172a;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    body {
      background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, var(--bg) 60%, #030712 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px 16px;
      background: rgba(22, 31, 48, 0.7);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    header h1 {
      font-size: 1.85rem;
      color: var(--accent-cyan);
      margin-bottom: 8px;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    ruby {
      ruby-align: center;
    }

    rt {
      font-size: 0.56em;
      color: #7dd3fc;
      font-weight: 600;
      user-select: none;
      letter-spacing: -0.5px;
    }

    .nav-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 12px;
      border: 2px solid var(--card-border);
      background: #111827;
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      border-color: #818cf8;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
    }

    .tab-btn.active rt {
      color: #e0e7ff;
    }

    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    button.btn {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    button.btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: white;
    }
    .btn-primary rt { color: #dbeafe; }

    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover { background: #334155; }
    .btn-secondary rt { color: #94a3b8; }

    .btn-success {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
    }
    .btn-success rt { color: #d1fae5; }

    .btn-warning {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
    }
    .btn-warning rt { color: #fef3c7; }

    .btn-glow {
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      color: white;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.35);
    }
    .btn-glow rt { color: #fce7f3; }

    .tts-btn {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .tts-btn:hover {
      background: #0284c7;
      color: white;
    }
    .tts-btn rt { color: inherit; }

    input[type="text"] {
      background: var(--input-bg);
      border: 2px solid var(--card-border);
      color: #f8fafc;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .mnemonic-box {
      margin-top: 10px;
      background: rgba(15, 23, 42, 0.7);
      border-left: 4px solid var(--accent-yellow);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      color: #e2e8f0;
      line-height: 1.8;
    }

    .mnemonic-box strong {
      color: var(--accent-yellow);
    }

    /* 模式一：開始考試 */
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .exam-word-prompt {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f1f5f9;
      text-align: center;
      margin: 18px 0 24px 0;
      line-height: 2;
    }

    .exam-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .exam-input-group input {
      flex: 1;
    }

    .feedback-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      line-height: 1.7;
      display: none;
    }

    .feedback-box.correct {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-green);
      color: #a7f3d0;
      display: block;
    }

    .feedback-box.incorrect {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid var(--accent-pink);
      color: #fecdd3;
      display: block;
    }

    .feedback-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .result-card {
      text-align: center;
      padding: 32px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
    }

    .result-score {
      font-size: 3.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 12px 0;
    }

    .wrong-list {
      text-align: left;
      margin-top: 20px;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      background: #0f172a;
    }

    .wrong-item {
      padding: 10px 8px;
      border-bottom: 1px dashed #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .wrong-item:last-child { border-bottom: none; }

    /* 模式二：我要練習 */
    .practice-sticky-bar {
      position: sticky;
      top: 12px;
      z-index: 20;
      background: rgba(22, 31, 48, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .practice-stat {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .practice-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .practice-item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .practice-item-card:hover {
      border-color: #3b82f6;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.15);
    }

    .practice-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .practice-badge {
      background: #1e1b4b;
      color: #c084fc;
      border: 1px solid #4338ca;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .practice-prompt-zh {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 14px;
      line-height: 1.9;
    }

    .practice-action-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .practice-action-row input {
      flex: 1;
      min-width: 150px;
      padding: 11px 13px;
      font-size: 1.05rem;
    }

    .practice-result-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.6;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>✨ <ruby>寧<rt>ㄋㄧㄥˊ</rt>寧<rt>ㄋㄧㄥˊ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>暗<rt>ㄢˋ</rt>夜<rt>ㄧㄝˋ</rt></ruby><ruby>單<rt>ㄉㄢ</rt>字<rt>ㄗˋ</rt></ruby><ruby>冒<rt>ㄇㄠˋ</rt>險<rt>ㄒㄧㄢˇ</rt></ruby><ruby>樂<rt>ㄌㄜˋ</rt>園<rt>ㄩㄢˊ</rt></ruby> 🚀</h1>
      <p>🎮 33 <ruby>個<rt>˙ㄍㄜ</rt></ruby><ruby>核<rt>ㄏㄜˊ</rt>心<rt>ㄒㄧㄣ</rt></ruby><ruby>單<rt>ㄉㄢ</rt>字<rt>ㄗˋ</rt></ruby> ‧ <ruby>注<rt>ㄓㄨˋ</rt>音<rt>ㄧㄣ</rt></ruby><ruby>陪<rt>ㄆㄟˊ</rt>讀<rt>ㄉㄨˊ</rt></ruby> ‧ <ruby>看<rt>ㄎㄢˋ</rt></ruby><ruby>中<rt>ㄓㄨㄥ</rt>文<rt>ㄨㄣˊ</rt></ruby><ruby>拼<rt>ㄆㄧㄣ</rt>寫<rt>ㄒㄧㄝˇ</rt></ruby><ruby>挑<rt>ㄊㄧㄠˇ</rt>戰<rt>ㄓㄢˋ</rt></ruby></p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tabExam" onclick="switchMode('exam')">
        🎯 <ruby>開<rt>ㄎㄞ</rt>始<rt>ㄕˇ</rt></ruby><ruby>考<rt>ㄎㄠˇ</rt>試<rt>ㄕˋ</rt></ruby> (33<ruby>題<rt>ㄊㄧˊ</rt></ruby><ruby>逐<rt>ㄓㄨˊ</rt>題<rt>ㄊㄧˊ</rt></ruby><ruby>闖<rt>ㄔㄨㄤˇ</rt>關<rt>ㄍㄨㄢ</rt></ruby>)
      </button>
      <button class="tab-btn" id="tabPractice" onclick="switchMode('practice')">
        📖 <ruby>我<rt>ㄨㄛˇ</rt>要<rt>ㄧㄠˋ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt>習<rt>ㄒㄧˊ</rt></ruby> (33<ruby>字<rt>ㄗˋ</rt></ruby><ruby>全<rt>ㄑㄩㄢˊ</rt>覽<rt>ㄌㄢˇ</rt></ruby><ruby>速<rt>ㄙㄨˋ</rt>練<rt>ㄌㄧㄢˋ</rt></ruby>)
      </button>
    </div>

    <!-- 模式一：開始考試 (Exam Mode) -->
    <div id="examSection" class="view-section active">
      <div id="quizContainer">
        <div class="progress-bar-container">
          <div id="examProgressBar" class="progress-bar-fill"></div>
        </div>

        <div class="quiz-meta">
          <span id="examCounter"><ruby>第<rt>ㄉㄧˋ</rt></ruby> 1 / 33 <ruby>題<rt>ㄊㄧˊ</rt></ruby></span>
          <span id="examScoreTracker"><ruby>目<rt>ㄇㄨˋ</rt>前<rt>ㄑㄧㄢˊ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt>對<rt>ㄉㄨㄟˋ</rt></ruby>: 0 <ruby>題<rt>ㄊㄧˊ</rt></ruby></span>
        </div>

        <div class="quiz-card">
          <div class="exam-word-prompt" id="examPromptZh"><ruby>載<rt>ㄗㄞˋ</rt>入<rt>ㄖㄨˋ</rt>中<rt>ㄓㄨㄥ</rt></ruby>...</div>

          <div class="exam-input-group">
            <input type="text" id="examInput" placeholder="請拼寫出對應的英文單字..." autocomplete="off" spellcheck="false" />
            <button class="btn btn-primary" id="examSubmitBtn" onclick="submitExamAnswer()">
              🚀 <ruby>送<rt>ㄙㄨㄥˋ</rt>出<rt>ㄔㄨ</rt></ruby>
            </button>
          </div>

          <div id="examFeedback" class="feedback-box">
            <div class="feedback-title">
              <span id="examFeedbackStatus"></span>
              <button type="button" class="tts-btn" id="examTtsBtn" onclick="speakCurrentExamWord()">
                🔊 <ruby>聽<rt>ㄊㄧㄥ</rt>發<rt>ㄈㄚ</rt>音<rt>ㄧㄣ</rt></ruby>
              </button>
            </div>
            <div id="examFeedbackDetail"></div>
            <div class="mnemonic-box" id="examMnemonicBox"></div>
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 16px;">
          <button class="btn btn-success" id="examNextBtn" style="width: 100%; display: none;" onclick="nextExamQuestion()">
            <ruby>下<rt>ㄒㄧㄚˋ</rt>一<rt>ㄧ</rt>題<rt>ㄊㄧˊ</rt></ruby> ➔
          </button>
        </div>
      </div>

      <!-- 考試結束結算畫面 -->
      <div id="resultContainer" class="result-card" style="display: none;">
        <h2>🏆 <ruby>測<rt>ㄘㄜˋ</rt>驗<rt>ㄧㄢˋ</rt></ruby><ruby>完<rt>ㄨㄢˊ</rt>成<rt>ㄔㄥˊ</rt></ruby>！<ruby>太<rt>ㄊㄞˋ</rt>棒<rt>ㄅㄤˋ</rt>了<rt>˙ㄌㄜ</rt></ruby>！</h2>
        <div class="result-score" id="finalScore">100</div>
        <div class="result-summary" id="resultSummary" style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 20px;"></div>

        <div id="wrongWordsContainer" style="display: none;">
          <h3 style="text-align: left; font-size: 1.05rem; color: var(--accent-pink); margin-bottom: 10px;">
            📝 <ruby>需<rt>ㄒㄩ</rt>要<rt>ㄧㄠˋ</rt></ruby><ruby>加<rt>ㄐㄧㄚ</rt>強<rt>ㄑㄧㄤˊ</rt></ruby><ruby>複<rt>ㄈㄨˋ</rt>習<rt>ㄒㄧˊ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt>題<rt>ㄊㄧˊ</rt></ruby>：
          </h3>
          <div class="wrong-list" id="wrongList"></div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button class="btn btn-primary" style="flex: 1;" onclick="startExam(false)">
            🔄 <ruby>全<rt>ㄑㄩㄢˊ</rt>部<rt>ㄅㄨˋ</rt></ruby><ruby>重<rt>ㄔㄨㄥˊ</rt>新<rt>ㄒㄧㄣ</rt></ruby><ruby>挑<rt>ㄊㄧㄠˇ</rt>戰<rt>ㄓㄢˋ</rt></ruby>
          </button>
          <button class="btn btn-warning" id="retryWrongBtn" style="flex: 1; display: none;" onclick="startExam(true)">
            ⚡ <ruby>專<rt>ㄓㄨㄢ</rt>攻<rt>ㄍㄨㄥ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt>題<rt>ㄊㄧˊ</rt></ruby>
          </button>
        </div>
      </div>
    </div>

    <!-- 模式二：我要練習 (Practice Mode - 單一三合一按鈕 + 頂部全公布按鈕) -->
    <div id="practiceSection" class="view-section">
      <!-- 練習控制頂部快捷列 -->
      <div class="practice-sticky-bar">
        <div class="practice-stat" id="practiceSummaryScore">
          ⭐ <ruby>已<rt>ㄧˇ</rt></ruby><ruby>核<rt>ㄏㄜˊ</rt>對<rt>ㄉㄨㄟˋ</rt></ruby>：<span id="practiceDoneCount">0</span> / 33 <ruby>題<rt>ㄊㄧˊ</rt></ruby>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-glow" style="padding: 6px 14px; font-size: 0.88rem;" onclick="revealAllPractice()">
            🚀 <ruby>一<rt>ㄧ</rt>鍵<rt>ㄐㄧㄢˋ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt>布<rt>ㄅㄨˋ</rt></ruby><ruby>全<rt>ㄑㄩㄢˊ</rt>部<rt>ㄅㄨˋ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt>案<rt>ㄢˋ</rt></ruby>、<ruby>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby><ruby>與<rt>ㄩˇ</rt></ruby><ruby>發<rt>ㄈㄚ</rt>音<rt>ㄧㄣ</rt></ruby>
          </button>
          <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.88rem;" onclick="resetAllPractice()">
            🧹 <ruby>清<rt>ㄑㄧㄥ</rt>空<rt>ㄎㄨㄥ</rt></ruby><ruby>重<rt>ㄔㄨㄥˊ</rt>練<rt>ㄌㄧㄢˋ</rt></ruby>
          </button>
        </div>
      </div>

      <!-- 33 個單字完整清單容器 -->
      <div class="practice-list" id="practiceFullList"></div>
    </div>
  </div>

  <script>
    // 33 個核心單字完整資料庫 (字義、口訣皆標註標準繁體中文注音)
    const VOCAB_DATA = [
      {
        word: "awesome",
        zh: "<ruby>極<rt>ㄐㄧˊ</rt>好<rt>ㄏㄠˇ</rt>的<rt>˙ㄉㄜ</rt></ruby>、<ruby>令<rt>ㄌㄧㄥˋ</rt>人<rt>ㄖㄣˊ</rt>敬<rt>ㄐㄧㄥˋ</rt>畏<rt>ㄨㄟˋ</rt>的<rt>˙ㄉㄜ</rt></ruby>、<ruby>棒<rt>ㄅㄤˋ</rt>極<rt>ㄐㄧˊ</rt>了<rt>˙ㄌㄜ</rt></ruby>",
        mnemonic: "awe (<ruby>敬<rt>ㄐㄧㄥˋ</rt>畏<rt>ㄨㄟˋ</rt></ruby>) + some (<ruby>充<rt>ㄔㄨㄥ</rt>滿<rt>ㄇㄢˇ</rt></ruby>) ➔ <ruby>讓<rt>ㄖㄤˋ</rt>人<rt>ㄖㄣˊ</rt>發<rt>ㄈㄚ</rt>出<rt>ㄔㄨ</rt>驚<rt>ㄐㄧㄥ</rt>嘆<rt>ㄊㄢˋ</rt>「哇<rt>ㄨㄚ</rt>～」，真<rt>ㄓㄣ</rt>是<rt>ㄕˋ</rt>太<rt>ㄊㄞˋ</rt>棒<rt>ㄅㄤˋ</rt>了<rt>˙ㄌㄜ</rt>！</ruby>"
      },
      {

    // Fisher-Yates 洗牌演算法
    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    // Web Speech API 發音函式
    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("瀏覽器不支援 Web Speech API 語音朗讀功能。");
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(s) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s];
      });
    }

    // ========================================================
    // 模式一：開始考試 (Exam Mode)
    // ========================================================
    let examList = [];
    let currentExamIndex = 0;
    let examScore = 0;
    let wrongWords = [];
    let isExamSubmitted = false;

    function startExam(onlyWrong = false) {
      if (onlyWrong && wrongWords.length > 0) {
        examList = shuffleArray(wrongWords);
      } else {
        examList = shuffleArray(VOCAB_DATA);
      }

      currentExamIndex = 0;
      examScore = 0;
      wrongWords = [];
      isExamSubmitted = false;

      document.getElementById('quizContainer').style.display = 'block';
      document.getElementById('resultContainer').style.display = 'none';

      showCurrentExamQuestion();
    }

    function showCurrentExamQuestion() {
      isExamSubmitted = false;
      const currentItem = examList[currentExamIndex];
      const total = examList.length;

      const percent = Math.round((currentExamIndex / total) * 100);
      document.getElementById('examProgressBar').style.width = percent + '%';
      document.getElementById('examCounter').innerHTML = `<ruby>第<rt>ㄉㄧˋ</rt></ruby> ${currentExamIndex + 1} / ${total} <ruby>題<rt>ㄊㄧˊ</rt></ruby>`;
      document.getElementById('examScoreTracker').innerHTML = `<ruby>目<rt>ㄇㄨˋ</rt>前<rt>ㄑㄧㄢˊ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt>對<rt>ㄉㄨㄟˋ</rt></ruby>: ${examScore} <ruby>題<rt>ㄊㄧˊ</rt></ruby>`;

      document.getElementById('examPromptZh').innerHTML = currentItem.zh;

      const input = document.getElementById('examInput');
      input.value = '';
      input.disabled = false;

      const feedback = document.getElementById('examFeedback');
      feedback.className = 'feedback-box';
      feedback.style.display = 'none';

      document.getElementById('examSubmitBtn').style.display = 'inline-flex';
      document.getElementById('examNextBtn').style.display = 'none';

      setTimeout(() => { input.focus(); }, 120);
    }

    function submitExamAnswer() {
      if (isExamSubmitted) return;

      const input = document.getElementById('examInput');
      const userInput = input.value.trim().toLowerCase();
      const currentItem = examList[currentExamIndex];
      const correctWord = currentItem.word.toLowerCase();

      if (!userInput) {
        alert("請先輸入英文單字唷！");
        input.focus();
        return;
      }

      isExamSubmitted = true;
      input.disabled = true;
      document.getElementById('examSubmitBtn').style.display = 'none';

      const feedback = document.getElementById('examFeedback');
      const feedbackStatus = document.getElementById('examFeedbackStatus');
      const feedbackDetail = document.getElementById('examFeedbackDetail');
      const mnemonicBox = document.getElementById('examMnemonicBox');

      mnemonicBox.innerHTML = `💡 <strong><ruby>記<rt>ㄐㄧˋ</rt>憶<rt>ㄧˋ</rt></ruby><ruby>小<rt>ㄒㄧㄠˇ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>：</strong> ${currentItem.mnemonic}`;

      if (userInput === correctWord) {
        examScore++;
        feedback.className = 'feedback-box correct';
        feedbackStatus.innerHTML = `🎉 太棒了，完全答對！ (<strong>${currentItem.word}</strong>)`;
        feedbackDetail.innerHTML = `拼字正確無誤，繼續勇往直前！`;
      } else {
        wrongWords.push(currentItem);
        feedback.className = 'feedback-box incorrect';
        feedbackStatus.innerHTML = `❌ 哎呀，不小心拼錯囉！`;
        feedbackDetail.innerHTML = `你的輸入：<span style="text-decoration: line-through; color: #f87171;">${escapeHtml(input.value.trim())}</span><br>
                                    正確拼寫：<strong style="font-size: 1.25rem; color: #38bdf8; letter-spacing: 0.5px;">${currentItem.word}</strong>`;
      }

      feedback.style.display = 'block';
      document.getElementById('examNextBtn').style.display = 'inline-flex';

      speakWord(currentItem.word);
    }

    function speakCurrentExamWord() {
      if (examList[currentExamIndex]) {
        speakWord(examList[currentExamIndex].word);
      }
    }

    function nextExamQuestion() {
      currentExamIndex++;
      if (currentExamIndex < examList.length) {
        showCurrentExamQuestion();
      } else {
        finishExam();
      }
    }

    function finishExam() {
      document.getElementById('quizContainer').style.display = 'none';
      document.getElementById('resultContainer').style.display = 'block';

      const total = examList.length;
      const scoreCalc = Math.round((examScore / total) * 100);
      document.getElementById('finalScore').innerText = `${scoreCalc} 分`;
      document.getElementById('resultSummary').innerHTML = `總共 ${total} 題，答對 ${examScore} 題，答錯 ${wrongWords.length} 題。`;

      const wrongContainer = document.getElementById('wrongWordsContainer');
      const wrongListEl = document.getElementById('wrongList');
      const retryWrongBtn = document.getElementById('retryWrongBtn');

      if (wrongWords.length > 0) {
        wrongContainer.style.display = 'block';
        retryWrongBtn.style.display = 'inline-flex';
        wrongListEl.innerHTML = '';

        for (let i = 0; i < wrongWords.length; i++) {
          const item = wrongWords[i];
          const div = document.createElement('div');
          div.className = 'wrong-item';
          div.innerHTML = `
            <div>
              <strong style="color: #38bdf8; font-size: 1.1rem;">${item.word}</strong>
              <span style="color: #94a3b8; font-size: 0.95rem; margin-left: 10px;">${item.zh}</span>
            </div>
            <button class="tts-btn" onclick="speakWord('${item.word}')">🔊 發音</button>
          `;
          wrongListEl.appendChild(div);
        }
      } else {
        wrongContainer.style.display = 'none';
        retryWrongBtn.style.display = 'none';
      }
    }

    // ========================================================
    // 模式二：我要練習 (Practice Mode - 單一三合一按鈕規範)
    // ========================================================
    function buildPracticeList() {
      const listContainer = document.getElementById('practiceFullList');
      listContainer.innerHTML = '';

      for (let i = 0; i < VOCAB_DATA.length; i++) {
        const item = VOCAB_DATA[i];
        const card = document.createElement('div');
        card.className = 'practice-item-card';
        card.id = `practice-card-${i}`;

        card.innerHTML = `
          <div class="practice-card-header">
            <span class="practice-badge">#${i + 1}</span>
          </div>
          <div class="practice-prompt-zh">${item.zh}</div>
          <div class="practice-action-row">
            <input type="text" id="practice-input-${i}" placeholder="輸入英文拼法..." autocomplete="off" spellcheck="false" onkeydown="handlePracticeKey(event, ${i})" />
            <button class="btn btn-primary" onclick="checkOrRevealPractice(${i})">
              🔍 <ruby>解<rt>ㄐㄧㄝˇ</rt>答<rt>ㄉㄚˊ</rt></ruby>・<ruby>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>・<ruby>發<rt>ㄈㄚ</rt>音<rt>ㄧㄣ</rt></ruby>
            </button>
          </div>
          <div class="practice-result-box" id="practice-result-${i}"></div>
        `;

        listContainer.appendChild(card);
      }
      updatePracticeSummary();
    }

    function handlePracticeKey(e, index) {
      if (e.key === 'Enter') {
        checkOrRevealPractice(index);
      }
    }

    // 單一核心功能：核對/揭曉解答 + 顯示記憶訣竅 + 同步發音
    function checkOrRevealPractice(i, shouldSpeak = true) {
      const input = document.getElementById(`practice-input-${i}`);
      const val = input.value.trim().toLowerCase();
      const item = VOCAB_DATA[i];
      const correct = item.word.toLowerCase();
      const resultBox = document.getElementById(`practice-result-${i}`);

      resultBox.style.display = 'block';

      // 情況 A：若留白，自動填入正確拼寫並展示小訣竅
      if (!val) {
        input.value = item.word;
        input.dataset.correct = "true";
        resultBox.style.background = 'rgba(56, 189, 248, 0.15)';
        resultBox.style.border = '1px solid #38bdf8';
        resultBox.style.color = '#bae6fd';
        resultBox.innerHTML = `
          👀 <strong><ruby>正<rt>ㄓㄥˋ</rt>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>單<rt>ㄉㄢ</rt>字<rt>ㄗˋ</rt></ruby>：</strong> <strong style="color: #38bdf8; font-size: 1.25rem;">${item.word}</strong>
          <div class="mnemonic-box">💡 <strong><ruby>記<rt>ㄐㄧˋ</rt>憶<rt>ㄧˋ</rt></ruby><ruby>小<rt>ㄒㄧㄠˇ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>：</strong> ${item.mnemonic}</div>
        `;
      } 
      // 情況 B：拼寫正確
      else if (val === correct) {
        input.dataset.correct = "true";
        resultBox.style.background = 'rgba(16, 185, 129, 0.15)';
        resultBox.style.border = '1px solid #10b981';
        resultBox.style.color = '#6ee7b7';
        resultBox.innerHTML = `
          🌟 <strong>太棒了，完全答對！</strong> 拼寫為 <strong>${item.word}</strong>
          <div class="mnemonic-box">💡 <strong><ruby>記<rt>ㄐㄧˋ</rt>憶<rt>ㄧˋ</rt></ruby><ruby>小<rt>ㄒㄧㄠˇ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>：</strong> ${item.mnemonic}</div>
        `;
      } 
      // 情況 C：拼寫錯誤
      else {
        input.dataset.correct = "false";
        resultBox.style.background = 'rgba(244, 63, 94, 0.15)';
        resultBox.style.border = '1px solid #f43f5e';
        resultBox.style.color = '#fca5a5';
        resultBox.innerHTML = `
          💪 <strong>差一點點！</strong> 你的輸入：<span style="text-decoration:line-through;">${escapeHtml(input.value.trim())}</span><br>
          正確答案是：<strong style="color: #38bdf8; font-size: 1.25rem;">${item.word}</strong>
          <div class="mnemonic-box">💡 <strong><ruby>記<rt>ㄐㄧˋ</rt>憶<rt>ㄧˋ</rt></ruby><ruby>小<rt>ㄒㄧㄠˇ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>：</strong> ${item.mnemonic}</div>
        `;
      }

      if (shouldSpeak) {
        speakWord(item.word);
      }
      updatePracticeSummary();
    }

    // 頂部全域功能：一鍵公布全部答案、訣竅與發音
    function revealAllPractice() {
      for (let i = 0; i < VOCAB_DATA.length; i++) {
        checkOrRevealPractice(i, false);
      }
      speakWord("All answers revealed");
    }

    function resetAllPractice() {
      if (confirm("確定要清空所有練習輸入與結果嗎？")) {
        for (let i = 0; i < VOCAB_DATA.length; i++) {
          const input = document.getElementById(`practice-input-${i}`);
          input.value = '';
          input.dataset.correct = "false";
          const res = document.getElementById(`practice-result-${i}`);
          res.style.display = 'none';
        }
        updatePracticeSummary();
      }
    }

    function updatePracticeSummary() {
      let doneCount = 0;
      for (let i = 0; i < VOCAB_DATA.length; i++) {
        const input = document.getElementById(`practice-input-${i}`);
        if (input && input.dataset.correct === "true") {
          doneCount++;
        }
      }
      document.getElementById('practiceDoneCount').innerText = doneCount;
    }

    // ========================================================
    // 分頁切換與全域快捷鍵
    // ========================================================
    function switchMode(mode) {
      const tabExam = document.getElementById('tabExam');
      const tabPractice = document.getElementById('tabPractice');
      const examSection = document.getElementById('examSection');
      const practiceSection = document.getElementById('practiceSection');

      if (mode === 'exam') {
        tabExam.classList.add('active');
        tabPractice.classList.remove('active');
        examSection.classList.add('active');
        practiceSection.classList.remove('active');
        setTimeout(() => { document.getElementById('examInput').focus(); }, 120);
      } else {
        tabExam.classList.remove('active');
        tabPractice.classList.add('active');
        examSection.classList.remove('active');
        practiceSection.classList.add('active');
      }
    }

    document.getElementById('examInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        if (!isExamSubmitted) {
          submitExamAnswer();
        } else {
          nextExamQuestion();
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      startExam(false);
      buildPracticeList();
    });
  </script>
</body>
</html>
