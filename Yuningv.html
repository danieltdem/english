<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寧寧的頂級單字挑戰</title>
    <style>
        /* 電影級色調與現代質感變數 */
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1e2f, #252542);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
            --accent: #ff9800;
            --accent-hover: #ffb74d;
            --success: #4CAF50;
            --danger: #f44336;
            --shadow-soft: 0 20px 50px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px rgba(255, 152, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            color: var(--text-main);
            backdrop-filter: brightness(0.9) contrast(1.1); /* 電影級色調映射模擬 */
        }

        /* 玻璃透視感容器 */
        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        /* 隱藏捲軸但保持可滾動 */
        .container::-webkit-scrollbar { width: 6px; }
        .container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        h1, h2 { font-weight: 300; letter-spacing: 2px; margin-top: 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            background-color: var(--accent);
            color: #fff;
            box-shadow: var(--shadow-glow);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        button:hover { background-color: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4); }
        button:active { transform: scale(0.96); }

        .tts-btn {
            background-color: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 6px 12px;
            font-size: 14px;
            border-radius: 50px;
            margin-left: 10px;
            box-shadow: none;
        }
        .tts-btn:hover { background-color: rgba(255,255,255,0.2); box-shadow: none;}

        .ruby-text { font-size: 0.7em; opacity: 0.7; display: block; margin-bottom: 4px; font-weight: 400; }

        /* 輸入框質感 */
        input[type="text"] {
            padding: 15px;
            font-size: 18px;
            width: 75%;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 10px;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: var(--shadow-glow); }

        /* 提示區域 */
        #mnemonic, .practice-mnemonic {
            font-size: 15px;
            margin-top: 15px;
            color: #a6b1e1;
            text-align: left;
            padding: 15px;
            border-left: 4px solid var(--accent);
            border-radius: 0 8px 8px 0;
            background: rgba(255, 255, 255, 0.03);
            line-height: 1.6;
        }

        #wrong-words { text-align: left; margin-top: 20px; color: #ff8a80; line-height: 1.6; }

        /* 練習模式專屬 */
        .practice-row-container { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 20px 0; }
        .practice-row { display: flex; justify-content: space-between; align-items: center; }
        .col-zh { width: 35%; text-align: left; color: #ffd54f; font-weight: 500;}
        .col-input { width: 35%; }
        .col-ans { width: 30%; text-align: right; color: var(--success); font-weight: bold; }
        
        .practice-input { width: 90% !important; padding: 10px !important; margin: 0 !important; font-size: 16px !important; }
        .practice-input.correct { border-color: var(--success); background: rgba(76, 175, 80, 0.1); }
        .practice-input.wrong { border-color: var(--danger); background: rgba(244, 67, 54, 0.1); }

        .list-header { display: flex; justify-content: space-between; color: rgba(255,255,255,0.5); font-size: 14px; margin-top: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }

        /* 畫面切換 */
        #menu-screen { display: block; }
        #exam-screen, #practice-screen { display: none; }
    </style>
</head>
<body>

    <!-- 1. 首頁選單 -->
    <div id="menu-screen" class="container">
        <h1>寧寧的頂級單字挑戰</h1>
        <p style="color: rgba(255,255,255,0.7); margin-bottom: 40px;">32 題全新單字庫準備就緒</p>
        
        <button onclick="goToExam()" style="width: 80%;">
            <span class="ruby-text">ㄎㄞ ㄕˇ ㄎㄠˇ ㄕˋ</span>開始考試
        </button>

        <button onclick="goToPractice()" style="width: 80%; background-color: #673ab7;">
            <span class="ruby-text">ㄨㄛˇ ㄧㄠˋ ㄌㄧㄢˋ ㄒㄧˊ</span>我要練習
        </button>
    </div>

    <!-- 2. 考試模式 -->
    <div id="exam-screen" class="container">
        <h2>單字拼寫測驗</h2>
        <div id="question" style="font-size: 24px; margin: 30px 0; color: #ffd54f;">載入題目中...</div>
        <input type="text" id="exam-answer" placeholder="輸入英文拼寫 (大小寫不拘)">
        <br>
        <button id="exam-submit">提交</button>
        <div id="exam-result" style="font-size: 20px; margin-top: 20px; font-weight: bold;"></div>
        <div id="mnemonic" style="display: none;"></div>
        <div id="score" style="font-size: 16px; margin-top: 20px; color: rgba(255,255,255,0.5);">分數: 0 / 0</div>
        <div id="wrong-words"></div>
        <button id="exam-restart" style="display: none;">重新開始</button>
        <button id="exam-retest" style="display: none; background-color: #f44336;">重測錯題</button>
        <button style="background-color: rgba(255,255,255,0.1); box-shadow: none; width: 60%; margin-top: 30px;" onclick="goHome()">回首頁</button>
    </div>

    <!-- 3. 練習模式 -->
    <div id="practice-screen" class="container" style="max-width: 800px; padding: 20px;">
        <h2 style="margin-top: 10px;">單字練習室</h2>
        <div style="display: flex; gap: 10px;">
            <button onclick="goHome()" style="background-color: rgba(255,255,255,0.1); width: 30%; box-shadow: none;">回首頁</button>
            <button id="toggle-all-btn" onclick="toggleAllAnswers()" style="width: 70%; background-color: var(--danger);">
                顯示答案 / 批改<br><span class="ruby-text">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>
            </button>
        </div>
        <div class="list-header">
            <span style="width:35%; text-align:left;">中文意思</span>
            <span style="width:35%">拼寫練習</span>
            <span style="width:30%; text-align:right;">正確答案</span>
        </div>
        <div id="practice-list"></div>
    </div>

    <script>
        // Web Audio API 音效引擎 (電影級高質感 UI 必備)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // 全新 32 題單字庫 (結合 Mnemonic Dictionary 記憶法)
        const words = [
            { en: 'alter', zh: '改變 (ㄍㄞˇ ㄅㄧㄢˋ)', mnemonic: '聽起來像 `all tar` (全是柏油)。當你在泥土路上鋪滿了柏油，你就「改變」(`alter`) 了這條路。' },
            { en: 'occur', zh: '發生 (ㄈㄚ ㄕㄥ)', mnemonic: '`oc` + `cur` (car，車子)。想像有人喊 "Oh, car!"，因為有車禍「發生」(`occur`) 了。' },
            { en: 'state', zh: '狀態 / 聲明 (ㄓㄨㄤˋ ㄊㄞˋ)', mnemonic: '和 `estate` (房地產) 很像。當你買了房地產，你的財富「狀態」(`state`) 就會改變，且你需要公開「聲明」(`state`) 產權。' },
            { en: 'substance', zh: '物質 (ㄨˋ ㄓˊ)', mnemonic: '`sub` (在下方) + `stance` (站立)。支撐萬物、站在所有事物最底下的基礎，就是「物質」(`substance`)。' },
            { en: 'trap', zh: '陷阱 (ㄒㄧㄢˋ ㄐㄧㄥˇ)', mnemonic: '把 `part` (部分) 反過來拼。如果你只看到事物的一「部分」，很容易就會掉進「陷阱」(`trap`) 裡。' },
            { en: 'possible', zh: '可能的 (ㄎㄜˇ ㄋㄥˊ ㄉㄜ˙)', mnemonic: '`boss` (老闆) + `able` (能夠)。只要老闆說能夠做到的事，一切都是「可能的」(`possible`)。' },
            { en: 'because', zh: '因為 (ㄧㄣ ㄨㄟˋ)', mnemonic: '字首縮寫記憶：Big Elephants Can Always Understand Small Elephants（大象總能理解小象，「因為」他們都是大象）。' },
            { en: 'straw', zh: '吸管 / 稻草 (ㄒㄧ ㄍㄨㄢˇ)', mnemonic: '聽起來像 `draw` (吸 / 畫)。你用「吸管」(`straw`) 把杯子裡的飲料吸 (`draw`) 上來。' },
            { en: 'broad', zh: '寬廣的 (ㄎㄨㄢ ㄍㄨㄤˇ ㄉㄜ˙)', mnemonic: '`b` + `road` (道路)。一條字母 B 開頭的道路，是一條非常「寬廣的」(`broad`) 大馬路。' },
            { en: 'bought', zh: '買 (ㄇㄞˇ)', mnemonic: '`buy` 的過去式。和 `brought` (帶來) 只差一個 r。你「買」(`bought`) 了東西，才能把它帶 (`brought`) 回家。' },
            { en: 'swung', zh: '搖擺 (ㄧㄠˊ ㄅㄞˇ)', mnemonic: '`swing` 的過去式。秋千 (swing) 在空中已經「搖擺」(`swung`) 過了。' },
            { en: 'problem', zh: '問題 (ㄨㄣˋ ㄊㄧˊ)', mnemonic: '`pro` + `blem` (blame，責怪)。當「問題」(`problem`) 發生時，專家 (pro) 總是在互相責怪 (blame)。' },
            { en: 'taught', zh: '教導 (ㄐㄧㄠ ㄉㄠˇ)', mnemonic: '`teach` 的過去式。聽起來像 `thought` (思想)。老師「教導」(`taught`) 給我們豐富的思想 (`thought`)。' },
            { en: 'paw', zh: '爪子 (ㄓㄠˇ ㄗ˙)', mnemonic: '聽起來像 `pa` (爸爸)。動物界裡的爸爸 (pa) 在打架時，都會用牠們的「爪子」(`paw`)。' },
            { en: 'sought', zh: '尋找 (ㄒㄩㄣˊ ㄓㄠˇ)', mnemonic: '`seek` 的過去式。聽起來像 `fought` (戰鬥)。我們經過一番戰鬥 (fought) 後，終於「尋找」(`sought`) 到寶藏。' },
            { en: 'jungle', zh: '叢林 (ㄘㄨㄥˊ ㄌㄧㄥˊ)', mnemonic: '聽起來像 `juggle` (拋接雜耍)。猴子們最喜歡在「叢林」(`jungle`) 裡玩拋接雜耍 (`juggle`) 了。' },
            { en: 'brought', zh: '帶來 (ㄉㄞˋ ㄌㄞˊ)', mnemonic: '`bring` 的過去式。就是 `bought` (買) 中間加個 `r`。買完就要「帶來」(`brought`) 給我。' },
            { en: 'shuttle', zh: '接駁車 (ㄐㄧㄝ ㄅㄛˊ ㄔㄜ)', mnemonic: '`shut` (關閉) + `tle`。搭上「接駁車」(`shuttle`)，車門關閉 (`shut`) 後快速帶你到目的地。' },
            { en: 'lobster', zh: '龍蝦 (ㄌㄨㄥˊ ㄒㄧㄚ)', mnemonic: '`lob` (拋擲) + `ster` (star，星星)。想像一隻像星星一樣珍貴的「龍蝦」(`lobster`)，被大廚拋進鍋裡。' },
            { en: 'umbrella', zh: '雨傘 (ㄩˇ ㄙㄢˇ)', mnemonic: '`umbra` (陰影/遮蔽) + `ella`。能為你遮擋風雨，提供遮蔽空間的工具就是「雨傘」(`umbrella`)。' },
            { en: 'flour', zh: '麵粉 (ㄇㄧㄢˋ ㄈㄣˇ)', mnemonic: '發音和 `flower` (花朵) 完全一模一樣。用純白的「麵粉」(`flour`) 捏出一朵美麗的花 (`flower`)。' },
            { en: 'importance', zh: '重要性 (ㄓㄨㄥˋ ㄧㄠˋ ㄒㄧㄥˋ)', mnemonic: '`import` (進口) + `ance`。國家必須進口 (`import`) 資源，這顯示了國際貿易的「重要性」(`importance`)。' },
            { en: 'influence', zh: '影響 (ㄧㄥˇ ㄒㄧㄤˇ)', mnemonic: '`in` + `flu` (流感) + `ence`。如果得了流感 (`flu`)，會對你的健康產生很大的「影響」(`influence`)。' },
            { en: 'flow', zh: '流動 (ㄌㄧㄡˊ ㄉㄨㄥˋ)', mnemonic: '和 `fly` (飛) 跟 `low` (低) 有關。水滴在低處輕輕飛舞，就像在「流動」(`flow`) 一樣。' },
            { en: 'gasoline', zh: '汽油 (ㄑㄧˋ ㄧㄡˊ)', mnemonic: '`gas` (氣體/汽油) + `o` + `line` (排隊)。汽車為了加「汽油」(`gasoline`) 都在大排長龍 (`line`)。' },
            { en: 'leadership', zh: '領導力 (ㄌㄧㄥˇ ㄉㄠˇ ㄌㄧˋ)', mnemonic: '`leader` (領導者) + `ship` (船)。能引導整艘大船 (`ship`) 航向正確方向的人，具備絕佳的「領導力」(`leadership`)。' },
            { en: 'half', zh: '一半 (ㄧ ㄅㄢˋ)', mnemonic: '聽起來像 `have`。把一顆蘋果切成兩「半」(`half`)，我們就能各擁有一半 (`have`)。' },
            { en: 'understand', zh: '理解 (ㄌㄧˇ ㄐㄧㄝˇ)', mnemonic: '`under` (在下方) + `stand` (站)。設身處地站在別人的立場底下，你就能「理解」(`understand`) 他們。' },
            { en: 'haircut', zh: '理髮 (ㄌㄧˇ ㄈㄚˇ)', mnemonic: '`hair` (頭髮) + `cut` (剪)。把頭髮剪掉，非常直觀的「理髮」(`haircut`)。' },
            { en: 'legal', zh: '合法的 (ㄏㄜˊ ㄈㄚˇ ㄉㄜ˙)', mnemonic: '`leg` (腿) + `al`。在「合法」(`legal`) 的範圍內，你才能自由地邁開雙腿 (`leg`) 走動。' },
            { en: 'generation', zh: '世代 (ㄕˋ ㄉㄞˋ)', mnemonic: '`generate` (產生) + `ion`。人類不斷繁衍、產生 (`generate`) 新的後代，形成一個個「世代」(`generation`)。' },
            { en: 'return', zh: '返回 (ㄈㄢˇ ㄏㄨㄟˊ)', mnemonic: '`re` (再次) + `turn` (轉向)。再次轉向走回原本的地方，就是「返回」(`return`)。' }
        ];

        /* --- 語音朗讀 API --- */
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        /* --- 安全洗牌演算法 --- */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /* --- 頁面切換邏輯 --- */
        function goHome() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'none'; 
        }

        function goToExam() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'block';
            document.getElementById('practice-screen').style.display = 'none';
            startGame(words);
        }

        function goToPractice() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'block'; 
            renderPracticeList();
            resetPracticeState();
        }

        /* --- 練習模式邏輯 --- */
        let areAnswersVisible = false;

        function resetPracticeState() {
            areAnswersVisible = false;
            const btn = document.getElementById('toggle-all-btn');
            btn.innerHTML = '顯示答案 / 批改<br><span class="ruby-text">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>';
            btn.style.backgroundColor = 'var(--danger)';
        }

        function renderPracticeList() {
            const listContainer = document.getElementById('practice-list');
            listContainer.innerHTML = '';

            words.forEach((word, index) => {
                const rowContainer = document.createElement('div');
                rowContainer.className = 'practice-row-container';
                rowContainer.innerHTML = `
                    <div class="practice-row">
                        <div class="col-zh">${word.zh}</div>
                        <div class="col-input">
                            <input type="text" class="practice-input" id="p-input-${index}" placeholder="拼寫..." autocomplete="off">
                        </div>
                        <div class="col-ans">
                            <div id="ans-${index}" style="display:none;">
                                ${word.en}
                                <button class="tts-btn" onclick="speakWord('${word.en}')">🔊</button>
                            </div>
                        </div>
                    </div>
                    <div id="p-mnemonic-${index}" class="practice-mnemonic" style="display:none;">
                        💡 <b>記憶提示：</b>${word.mnemonic}
                    </div>
                `;
                listContainer.appendChild(rowContainer);
            });
        }

        function toggleAllAnswers() {
            const btn = document.getElementById('toggle-all-btn');
            areAnswersVisible = !areAnswersVisible;

            if (areAnswersVisible) {
                btn.innerHTML = '隱藏答案<br><span class="ruby-text">ㄧㄣˇ ㄘㄤˊ ㄉㄚˊ ㄢˋ</span>';
                btn.style.backgroundColor = 'var(--success)';
                
                words.forEach((word, index) => {
                    document.getElementById(`ans-${index}`).style.display = 'block';
                    const input = document.getElementById(`p-input-${index}`);
                    const userWord = input.value.trim().toLowerCase();
                    const correctWord = word.en.toLowerCase();
                    const mnemonicDiv = document.getElementById(`p-mnemonic-${index}`);
                    
                    if (userWord === correctWord) {
                        input.classList.add('correct');
                        input.classList.remove('wrong');
                        mnemonicDiv.style.display = 'none';
                        if(userWord !== '') playSound('correct'); // 給點音效回饋
                    } else {
                        input.classList.add('wrong');
                        input.classList.remove('correct');
                        mnemonicDiv.style.display = 'block';
                    }
                });
            } else {
                btn.innerHTML = '顯示答案 / 批改<br><span class="ruby-text">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>';
                btn.style.backgroundColor = 'var(--danger)';
                
                words.forEach((_, index) => {
                    document.getElementById(`ans-${index}`).style.display = 'none';
                    document.getElementById(`p-mnemonic-${index}`).style.display = 'none';
                });
            }
        }

        /* --- 考試模式邏輯 --- */
        let currentQuestion = 0;
        let score = 0;
        let totalQuestions = words.length;
        let questions = [];
        let wrongWords = [];
        let isWaitingToContinue = false;

        function startGame(wordList) {
            questions = [...(wordList || words)];
            totalQuestions = questions.length;
            shuffle(questions);
            currentQuestion = 0;
            score = 0;
            wrongWords = [];
            isWaitingToContinue = false;
            
            document.getElementById('exam-restart').style.display = 'none';
            document.getElementById('exam-retest').style.display = 'none';
            document.getElementById('wrong-words').textContent = '';
            document.getElementById('exam-answer').style.display = 'inline-block';
            document.getElementById('exam-submit').style.display = 'inline-block';
            document.getElementById('exam-submit').textContent = '提交';
            document.getElementById('mnemonic').style.display = 'none';
            
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }
            
            const q = questions[currentQuestion];
            document.getElementById('mnemonic').style.display = 'none';
            isWaitingToContinue = false;
            
            const submitBtn = document.getElementById('exam-submit');
            submitBtn.textContent = '提交';
            submitBtn.style.backgroundColor = 'var(--accent)';
            
            document.getElementById('question').innerHTML = `輸入 <b>"${q.zh}"</b> 的英文拼寫：`;
            document.getElementById('exam-answer').value = '';
            document.getElementById('exam-result').textContent = '';
            document.getElementById('score').textContent = `分數: ${score} / ${totalQuestions}`;
            
            setTimeout(() => document.getElementById('exam-answer').focus(), 50);
        }

        function checkExamAnswer() {
            if (isWaitingToContinue) {
                currentQuestion++;
                nextQuestion();
                return;
            }

            const userAnswer = document.getElementById('exam-answer').value.trim().toLowerCase();
            const q = questions[currentQuestion];
            const correctAnswer = q.en.toLowerCase();

            if (userAnswer === correctAnswer) {
                score++;
                playSound('correct');
                document.getElementById('exam-result').textContent = '✨ 正確！';
                document.getElementById('exam-result').style.color = 'var(--success)';
                setTimeout(() => {
                    currentQuestion++;
                    nextQuestion();
                }, 1000);
            } else {
                playSound('wrong');
                document.getElementById('exam-result').textContent = `❌ 錯誤。正確答案是：${q.en}`;
                document.getElementById('exam-result').style.color = 'var(--danger)';
                
                const mnemonicEl = document.getElementById('mnemonic');
                mnemonicEl.innerHTML = `
                    💡 <b>記憶提示：</b>${q.mnemonic}
                    <button class="tts-btn" onclick="speakWord('${q.en}')" style="margin-top:10px;">🔊 唸出正確單字</button>
                `;
                mnemonicEl.style.display = 'block';
                
                const submitBtn = document.getElementById('exam-submit');
                submitBtn.textContent = '繼續';
                submitBtn.style.backgroundColor = '#607d8b';
                
                wrongWords.push({ zh: q.zh, en: q.en, user: userAnswer });
                isWaitingToContinue = true;
            }
            document.getElementById('score').textContent = `分數: ${score} / ${totalQuestions}`;
        }

        function endGame() {
            document.getElementById('mnemonic').style.display = 'none';
            document.getElementById('question').textContent = '測驗結束！';
            document.getElementById('exam-answer').style.display = 'none';
            document.getElementById('exam-submit').style.display = 'none';
            document.getElementById('exam-result').textContent = `最終分數：${score} / ${totalQuestions}`;
            document.getElementById('exam-result').style.color = '#fff';
            
            if (score === totalQuestions) {
                document.getElementById('wrong-words').innerHTML = '<span style="color:var(--success); font-size:20px;">🏆 太厲害了！你全部答對！</span>';
            } else {
                let wrongText = '<b>你答錯的單字：</b><br><br>';
                wrongWords.forEach(w => {
                    wrongText += `• ${w.zh}<br>&nbsp;&nbsp;正解: <span style="color:var(--success)">${w.en}</span> / 你的輸入: <span style="color:var(--danger)">${w.user || '(空白)'}</span><br><br>`;
                });
                document.getElementById('wrong-words').innerHTML = wrongText;
                document.getElementById('exam-retest').style.display = 'inline-block';
            }
            document.getElementById('exam-restart').style.display = 'inline-block';
        }

        document.getElementById('exam-submit').addEventListener('click', checkExamAnswer);
        document.getElementById('exam-answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkExamAnswer();
        });
        document.getElementById('exam-restart').addEventListener('click', () => startGame(words));
        document.getElementById('exam-retest').addEventListener('click', () => {
            if (wrongWords.length > 0) {
                const retestWords = wrongWords.map(w => words.find(orig => orig.en === w.en));
                startGame(retestWords);
            }
        });

    </script>
</body>
</html>
