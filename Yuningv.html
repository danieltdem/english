<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寧寧的高質感單字挑戰</title>
    <style>
        /* --- 現代高質感視覺標準 (Modern UI / Soft Shadows) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-size: 200% 200%;
            animation: gradientBG 15s ease infinite;
            transition: background 0.5s;
            color: #333;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 650px;
            max-height: 90vh;
            position: relative;
            overflow-y: auto; 
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1, h2 {
            margin-top: 0;
            color: #2c3e50;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .game-image {
            width: 100%;
            max-width: 250px;
            height: auto;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        /* 按鈕高質感樣式 */
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        button:active {
            transform: translateY(1px) scale(0.98);
        }

        .tts-btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            font-size: 14px;
            padding: 8px 16px;
            margin: 5px 0 0 10px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 首頁選單樣式 --- */
        #menu-screen { display: block; }
        .menu-btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .ruby-text { font-size: 0.8em; display: block; margin-bottom: 4px; opacity: 0.9; }

        /* --- 考試模式樣式 --- */
        #exam-screen { display: none; }
        .exam-input {
            padding: 15px;
            font-size: 20px;
            width: 75%;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background-color: #f8fafc;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
            text-align: center;
        }
        .exam-input:focus {
            border-color: #8ec5fc;
            box-shadow: 0 0 0 4px rgba(142, 197, 252, 0.3);
        }
        
        .exam-btn { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #004d40; }
        
        #mnemonic {
            font-size: 16px;
            margin-top: 15px;
            color: #1e3a8a;
            text-align: left;
            padding: 20px;
            border-left: 5px solid #3b82f6;
            border-radius: 8px;
            background-color: #eff6ff;
            line-height: 1.6;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        #wrong-words { text-align: left; white-space: pre-wrap; margin-top: 20px; color: #475569;}

        /* --- 練習模式樣式 --- */
        #practice-screen { 
            display: none; 
            background: #1e293b; 
            color: #f8fafc;
            border: none;
            flex-direction: column; 
            padding: 0; 
            overflow: hidden; 
        }
        
        body.practice-mode { background: #0f172a; }

        .practice-fixed-top {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 25px 10px 25px;
            border-bottom: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            flex-shrink: 0; 
            z-index: 10;
        }

        .top-btn-group { display: flex; gap: 10px; margin-bottom: 15px; }

        #practice-list-container {
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 10px 25px 25px 25px;
            scrollbar-width: thin;
            scrollbar-color: #64748b #1e293b;
        }

        .practice-row-container {
            border-bottom: 1px solid #334155;
            padding: 20px 0;
            transition: background-color 0.2s;
        }
        .practice-row-container:hover { background-color: rgba(255,255,255,0.02); }

        .practice-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .col-zh { width: 35%; text-align: left; font-size: 16px; color: #cbd5e1; }
        .col-input { width: 35%; }
        .col-ans { width: 30%; text-align: right; color: #4ade80; font-weight: bold; font-size: 18px; display: flex; flex-direction: column; align-items: flex-end;}

        .practice-input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
            background-color: #0f172a;
            color: white;
            border: 2px solid #475569;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s;
        }
        .practice-input:focus { border-color: #38bdf8; }
        .practice-input.correct { border-color: #4ade80; background-color: rgba(74, 222, 128, 0.1); }
        .practice-input.wrong { border-color: #f87171; background-color: rgba(248, 113, 113, 0.1); }

        .practice-mnemonic {
            display: none;
            margin-top: 12px;
            font-size: 15px;
            color: #93c5fd;
            text-align: left;
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            border-left: 4px solid #3b82f6;
        }

        .global-toggle-btn {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            width: 100%;
            margin: 0;
        }
        
        .header-back-btn {
            background: #475569;
            color: white;
            width: 30%;
            margin: 0;
        }

        .answer-text { display: none; margin-bottom: 5px; }
        
        .list-header {
            display: flex; 
            justify-content: space-between; 
            color: #94a3b8; 
            font-size: 14px; 
            margin-top: 10px;
            padding-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. 首頁選單 -->
    <div id="menu-screen" class="container">
        <h1>✨ 寧寧的進階單字挑戰 ✨</h1>
        <p style="color: #64748b; margin-bottom: 30px;">準備好學習這 32 個新單字了嗎？</p>
        
        <button class="menu-btn" onclick="goToExam()">
            <span class="ruby-text">ㄎㄞ ㄕˇ ㄎㄠˇ ㄕˋ</span>
            開始考試
        </button>

        <button class="menu-btn" onclick="goToPractice()" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); color: #fff;">
            <span class="ruby-text">ㄨㄛˇ ㄧㄠˋ ㄌㄧㄢˋ ㄒㄧˊ</span>
            我要練習
        </button>
    </div>

    <!-- 2. 考試模式 -->
    <div id="exam-screen" class="container">
        <h1 style="color: #1e293b;">單字拼寫測驗</h1>
        <p style="color: #64748b;">請根據給出的中文意思，輸入正確的英文拼寫。<br>大小寫皆可，答錯會提供記憶法喔！</p>
        <div id="question" style="font-size: 24px; margin: 30px 0; color: #0f172a; font-weight: bold;">載入題目中...</div>
        <input type="text" id="exam-answer" class="exam-input" placeholder="請輸入單字..." autocomplete="off">
        <br>
        <button id="exam-submit" class="exam-btn">提交答案</button>
        <div id="exam-result" style="font-size: 22px; margin-top: 20px; font-weight: bold;"></div>
        <div id="mnemonic" style="display: none;"></div>
        <div id="score" style="font-size: 18px; margin-top: 15px; color: #64748b; font-weight: bold;">進度: 0 / 0</div>
        <div id="wrong-words"></div>
        <button id="exam-restart" class="exam-btn" style="display: none;">重新開始</button>
        <button id="exam-retest" class="exam-btn" style="display: none; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);">重測錯題</button>
        <button class="menu-btn" style="background: #94a3b8; width: 50%; margin-top: 30px; padding: 10px;" onclick="goHome()">回首頁</button>
    </div>

    <!-- 3. 練習模式 -->
    <div id="practice-screen" class="container">
        <div class="practice-fixed-top">
            <h2 style="color: #38bdf8; margin: 0 0 15px 0;">單字練習室</h2>
            <div class="top-btn-group">
                <button class="header-back-btn" onclick="goHome()">
                    回首頁<br><span style="font-size:0.8em">ㄏㄨㄟˊ ㄕㄡˇ ㄧㄝˋ</span>
                </button>
                <button id="toggle-all-btn" class="global-toggle-btn" style="width: 70%;" onclick="toggleAllAnswers()">
                    顯示所有答案 / 批改
                    <br><span style="font-size:0.8em">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>
                </button>
            </div>
            <div class="list-header">
                <span style="width:35%">中文意思</span>
                <span style="width:35%">拼寫練習</span>
                <span style="width:30%; text-align:right;">正確答案</span>
            </div>
        </div>
        <div id="practice-list-container">
            <div id="practice-list"></div>
        </div>
    </div>

    <script>
        // 32個全新單字庫，包含中文、注音與 Mnemonic Dictionary 風格記憶法
        const words = [
            { en: 'peer', zh: '凝視/同儕 (ㄆㄧㄦ)', mnemonic: '聽起來像 `beer` (啤酒)。和同儕 (peer) 聚在一起喝啤酒。' },
            { en: 'appear', zh: '出現 (ㄔㄨ ㄒㄧㄢˋ)', mnemonic: '`ap` + `pear` (梨子)。一顆梨子 (pear) 突然出現在桌上。' },
            { en: 'bundle up', zh: '穿暖和 (ㄔㄨㄢ ㄋㄨㄢˇ ㄏㄨㄛ˙)', mnemonic: '`bundle` (捆)。把自己像包裹一樣捆起來，穿得暖暖的。' },
            { en: 'drift', zh: '漂流 (ㄆㄧㄠ ㄌㄧㄡˊ)', mnemonic: '`drive` (駕駛) + `raft` (木筏)。駕駛木筏在河上漂流 (drift)。' },
            { en: 'shiver', zh: '發抖 (ㄈㄚ ㄉㄡˇ)', mnemonic: '聽起來像 `river` (河)。沒穿外套掉進冰冷的河裡，冷得發抖 (shiver)。' },
            { en: 'thick', zh: '厚的 (ㄏㄡˋ ㄉㄜ˙)', mnemonic: '聽起來像 `sick` (生病的)。生病時覺得冷，需要蓋很厚 (thick) 的被子。' },
            { en: 'spell', zh: '拼寫/咒語 (ㄆㄧㄣ ㄒㄧㄝˇ)', mnemonic: '聽起來像 `smell` (聞)。這個魔法咒語 (spell) 聞起來有奇怪的味道。' },
            { en: 'empty', zh: '空的 (ㄎㄨㄥ ㄉㄜ˙)', mnemonic: '發音聽起來就像英文字母 `M` 和 `T`。把 M 和 T 裡面的東西都清空 (empty) 了。' },
            { en: 'sweater', zh: '毛衣 (ㄇㄠˊ ㄧ)', mnemonic: '`sweat` (流汗) + `er`。穿了會讓人熱到流汗 (sweat) 的衣服就是厚毛衣。' },
            { en: 'necklace', zh: '項鍊 (ㄒㄧㄤˋ ㄌㄧㄢˋ)', mnemonic: '`neck` (脖子) + `lace` (蕾絲)。戴在脖子上的精緻蕾絲裝飾，像是一條項鍊。' },
            { en: 'because', zh: '因為 (ㄧㄣ ㄨㄟˋ)', mnemonic: '`be` (成為) + `cause` (原因)。成為那個原因，也就是「因為」。' },
            { en: 'paw', zh: '爪子 (ㄓㄨㄚˇ ㄗ˙)', mnemonic: '發音聽起來像「怕」。動物露出尖銳的爪子 (paw)，讓人看了很怕。' },
            { en: 'problem', zh: '問題 (ㄨㄣˋ ㄊㄧˊ)', mnemonic: '`pro` (專業) + `blem`。需要專業人士 (pro) 才能解決的這個問題。' },
            { en: 'taught', zh: '教導(過去式) (ㄐㄧㄠ ㄉㄠˇ)', mnemonic: 'catch 的過去式是 caught，teach (教) 的過去式就是 taught。' },
            { en: 'brought', zh: '帶來(過去式) (ㄉㄞˋ ㄌㄞˊ)', mnemonic: 'buy 的過去式 bought 加上 r。買了並且帶來 (brought) 給你。' },
            { en: 'possible', zh: '可能的 (ㄎㄜˇ ㄋㄥˊ ㄉㄜ˙)', mnemonic: '`boss` (老闆) + `able` (有能力的)。老闆有能力讓一切變為可能 (possible)。' },
            { en: 'sought', zh: '尋找(過去式) (ㄒㄩㄣˊ ㄓㄠˇ)', mnemonic: 'seek 的過去式。發音聽起來像中文的「搜」，到處搜索尋找。' },
            { en: 'jungle', zh: '叢林 (ㄘㄨㄥˊ ㄌㄧㄣˊ)', mnemonic: '`jump` (跳) + `angle` (角度)。在叢林 (jungle) 裡跳躍要抓好角度。' },
            { en: 'shuttle', zh: '太空梭/接駁車 (ㄊㄞˋ ㄎㄨㄥ ㄙㄨㄛ)', mnemonic: '`shut` (關閉) + door。門關上了，接駁車 (shuttle) 準備出發。' },
            { en: 'swung', zh: '搖擺(過去式) (ㄧㄠˊ ㄅㄞˇ)', mnemonic: 'swing 的過去式。天鵝 (swan) 在水面上輕輕搖擺 (swung)。' },
            { en: 'ancient', zh: '古代的 (ㄍㄨˇ ㄉㄞˋ ㄉㄜ˙)', mnemonic: '`ant` (螞蟻) + `cent` (一分錢)。螞蟻在土裡找到了一枚古代的硬幣。' },
            { en: 'determine', zh: '決定 (ㄐㄩㄝˊ ㄉㄧㄥˋ)', mnemonic: '`de` + `term` (學期) + `ine`。在學期結束前決定 (determine) 你的志向。' },
            { en: 'director', zh: '導演/主管 (ㄉㄠˇ ㄧㄢˇ)', mnemonic: '`direct` (指導) + `or` (的人)。負責在現場指導的人就是導演。' },
            { en: 'anything', zh: '任何事物 (ㄖㄣˋ ㄏㄜˊ ㄕˋ ㄨˋ)', mnemonic: '`any` (任何) + `thing` (事物)。組合起來就是任何事物。' },
            { en: 'butter', zh: '奶油 (ㄋㄞˇ ㄧㄡˊ)', mnemonic: '`but` (但是) + `ter`。這麵包很好吃，但是 (but) 加了奶油 (butter) 會更好吃。' },
            { en: 'education', zh: '教育 (ㄐㄧㄠˋ ㄩˋ)', mnemonic: '`educate` (教育) 的名詞形態。' },
            { en: 'change', zh: '改變 (ㄍㄞˇ ㄅㄧㄢˋ)', mnemonic: '和 `chance` (機會) 很像。抓住機會 (chance) 就能改變 (change) 人生。' },
            { en: 'sample', zh: '樣本 (ㄧㄤˋ ㄅㄣˇ)', mnemonic: '`same` (相同) + `apple` (蘋果)。拿一顆相同的蘋果當作樣本。' },
            { en: 'chance', zh: '機會 (ㄐㄧ ㄏㄨㄟˋ)', mnemonic: '和 `dance` (跳舞) 押韻。給他一個機會 (chance) 展現跳舞技巧。' },
            { en: 'employ', zh: '雇用 (ㄍㄨˋ ㄩㄥˋ)', mnemonic: 'employee 是員工，老闆的動作就是 employ (雇用)。' },
            { en: 'butterfly', zh: '蝴蝶 (ㄏㄨˊ ㄉㄧㄝˊ)', mnemonic: '`butter` (奶油) + `fly` (飛)。像奶油一樣滑順飛舞的昆蟲就是蝴蝶。' },
            { en: 'text', zh: '文本/文字 (ㄨㄣˊ ㄗˋ)', mnemonic: '和 `test` (考試) 很像。考試 (test) 時需要閱讀大量的文字 (text)。' }
        ];

        /* --- Web Audio API 高質感音效引擎 --- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playFeedbackSound(isCorrect) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (isCorrect) {
                // 清脆的叮咚聲 (Sine wave)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.5);
            } else {
                // 低沉的錯誤提示音 (Triangle wave)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        /* --- TTS 語音朗讀 API --- */
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                // 調整語速與音調，讓發音更自然
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("很抱歉，您的瀏覽器目前不支援語音朗讀功能喔！");
            }
        }

        /* --- 安全洗牌演算法 --- */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }

        /* --- 頁面切換邏輯 --- */
        function goHome() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'none'; 
            document.body.classList.remove('practice-mode');
        }

        function goToExam() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'block';
            document.getElementById('practice-screen').style.display = 'none';
            document.body.classList.remove('practice-mode');
            startGame(words);
        }

        function goToPractice() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'flex'; 
            document.body.classList.add('practice-mode');
            renderPracticeList();
            resetPracticeState();
        }

        /* --- 練習模式邏輯 --- */
        let areAnswersVisible = false;

        function resetPracticeState() {
            areAnswersVisible = false;
            const btn = document.getElementById('toggle-all-btn');
            btn.innerHTML = '顯示所有答案 / 批改<br><span style="font-size:0.8em">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>';
            btn.style.background = 'linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%)';
        }

        function renderPracticeList() {
            const listContainer = document.getElementById('practice-list');
            listContainer.innerHTML = '';

            words.forEach((word, index) => {
                const rowContainer = document.createElement('div');
                rowContainer.className = 'practice-row-container';
                rowContainer.innerHTML = `
                    <div class="practice-row">
                        <div class="col-zh">${word.zh}</div>
                        <div class="col-input">
                            <input type="text" class="practice-input" id="p-input-${index}" placeholder="嘗試拼寫..." autocomplete="off">
                        </div>
                        <div class="col-ans">
                            <div id="ans-${index}" class="answer-text">
                                ${word.en}
                                <button class="tts-btn" onclick="speakWord('${word.en}')" title="唸出單字">🔊</button>
                            </div>
                        </div>
                    </div>
                    <div id="p-mnemonic-${index}" class="practice-mnemonic">
                        💡 <b>記憶法：</b>${word.mnemonic}
                    </div>
                `;
                listContainer.appendChild(rowContainer);
            });
        }

        document.getElementById('practice-list-container').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') toggleAllAnswers();
        });

        function toggleAllAnswers() {
            const btn = document.getElementById('toggle-all-btn');
            const answers = document.querySelectorAll('.answer-text');
            const inputs = document.querySelectorAll('.practice-input');

            areAnswersVisible = !areAnswersVisible;

            if (areAnswersVisible) {
                btn.innerHTML = '隱藏所有答案<br><span style="font-size:0.8em">ㄧㄣˇ ㄘㄤˊ ㄉㄚˊ ㄢˋ</span>';
                btn.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
                
                answers.forEach(el => el.style.display = 'block');

                let allCorrect = true;
                inputs.forEach((input, index) => {
                    const userWord = input.value.trim().toLowerCase();
                    const correctWord = words[index].en.toLowerCase();
                    const mnemonicDiv = document.getElementById(`p-mnemonic-${index}`);
                    
                    if (userWord === correctWord) {
                        input.classList.add('correct');
                        input.classList.remove('wrong');
                        mnemonicDiv.style.display = 'none'; 
                    } else {
                        input.classList.add('wrong');
                        input.classList.remove('correct');
                        mnemonicDiv.style.display = 'block'; 
                        allCorrect = false;
                    }
                });

                // 批改音效
                playFeedbackSound(allCorrect);

            } else {
                btn.innerHTML = '顯示所有答案 / 批改<br><span style="font-size:0.8em">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>';
                btn.style.background = 'linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%)';
                
                answers.forEach(el => el.style.display = 'none');
                
                words.forEach((_, index) => {
                    document.getElementById(`p-mnemonic-${index}`).style.display = 'none';
                });
            }
        }

        /* --- 考試模式邏輯 --- */
        let currentQuestion = 0;
        let score = 0;
        let totalQuestions = 0;
        let questions = [];
        let wrongWords = [];
        let isWaitingToContinue = false;

        function startGame(wordList) {
            // 啟用 AudioContext (必須由使用者互動觸發)
            if(audioCtx.state === 'suspended') audioCtx.resume();

            let listToUse = words;
            if (wordList && Array.isArray(wordList) && wordList.length > 0) {
                listToUse = wordList;
            }
            
            questions = [...listToUse];
            totalQuestions = questions.length;
            shuffle(questions);
            currentQuestion = 0;
            score = 0;
            wrongWords = [];
            isWaitingToContinue = false;
            
            document.getElementById('exam-restart').style.display = 'none';
            document.getElementById('exam-retest').style.display = 'none';
            document.getElementById('wrong-words').textContent = '';
            document.getElementById('exam-answer').style.display = 'inline-block';
            document.getElementById('exam-submit').style.display = 'inline-block';
            document.getElementById('exam-submit').textContent = '提交答案';
            document.getElementById('mnemonic').style.display = 'none';
            
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }
            
            const q = questions[currentQuestion];
            if (!q) return;

            const mnemonicEl = document.getElementById('mnemonic');
            mnemonicEl.textContent = '';
            mnemonicEl.style.display = 'none';

            isWaitingToContinue = false;
            document.getElementById('exam-submit').textContent = '提交答案';
            document.getElementById('exam-submit').style.background = 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)';
            
            document.getElementById('question').innerHTML = `請拼出：<br><span style="color:#3b82f6;">"${q.zh}"</span>`;
            document.getElementById('exam-answer').value = '';
            document.getElementById('exam-result').textContent = '';
            
            updateScore();
            setTimeout(() => { document.getElementById('exam-answer').focus(); }, 50);
        }

        function checkExamAnswer() {
            if (isWaitingToContinue) {
                currentQuestion++;
                nextQuestion();
                return;
            }

            const userAnswer = document.getElementById('exam-answer').value.trim().toLowerCase();
            const q = questions[currentQuestion];
            const correctAnswer = q.en.toLowerCase();

            if (userAnswer === correctAnswer) {
                score++;
                playFeedbackSound(true); // 播放正確音效
                document.getElementById('exam-result').textContent = '🎉 正確！太棒了！';
                document.getElementById('exam-result').style.color = '#10b981';
                setTimeout(() => {
                    currentQuestion++;
                    nextQuestion();
                }, 1200);
            } else {
                playFeedbackSound(false); // 播放錯誤音效
                document.getElementById('exam-result').textContent = `❌ 錯誤。正確答案是：${q.en}`;
                document.getElementById('exam-result').style.color = '#ef4444';
                
                const mnemonicEl = document.getElementById('mnemonic');
                mnemonicEl.innerHTML = `
                    💡 <b>記憶法：</b>${q.mnemonic}
                    <br><br>
                    <button class="tts-btn" onclick="speakWord('${q.en}')">🔊 聽聽正確發音</button>
                `;
                mnemonicEl.style.display = 'block';
                
                document.getElementById('exam-submit').textContent = '下一題 ➔';
                document.getElementById('exam-submit').style.background = 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)';
                wrongWords.push({ zh: q.zh, en: q.en, user: userAnswer, mnemonic: q.mnemonic });
                isWaitingToContinue = true;
            }
            updateScore();
        }

        function updateScore() {
            document.getElementById('score').textContent = `進度: ${currentQuestion + (isWaitingToContinue ? 1 : 0)} / ${totalQuestions} | 得分: ${score}`;
        }

        function endGame() {
            document.getElementById('mnemonic').style.display = 'none';
            document.getElementById('question').innerHTML = '🏆 測驗結束！';
            document.getElementById('exam-answer').style.display = 'none';
            document.getElementById('exam-submit').style.display = 'none';
            document.getElementById('exam-result').textContent = `妳的最終分數：${score} / ${totalQuestions}`;
            document.getElementById('exam-result').style.color = '#3b82f6';
            
            if (score === totalQuestions) {
                playFeedbackSound(true);
                document.getElementById('wrong-words').innerHTML = '<h3 style="color:#10b981;">太完美了！妳全部答對了！✨</h3>';
            } else {
                let wrongText = '<h3>需要再複習的單字：</h3><ul style="line-height:1.8;">';
                wrongWords.forEach(w => {
                    wrongText += `<li><b>${w.zh}</b>：正確是 <span style="color:#10b981;">${w.en}</span> (妳輸入: <span style="color:#ef4444;">${w.user || '(空白)'}</span>)</li>`;
                });
                wrongText += '</ul>';
                document.getElementById('wrong-words').innerHTML = wrongText;
                document.getElementById('exam-retest').style.display = 'inline-block';
            }
            document.getElementById('exam-restart').style.display = 'inline-block';
        }

        // 綁定事件
        document.getElementById('exam-submit').addEventListener('click', checkExamAnswer);
        document.getElementById('exam-answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkExamAnswer();
        });
        document.getElementById('exam-restart').addEventListener('click', () => startGame(words));
        document.getElementById('exam-retest').addEventListener('click', () => {
            if (wrongWords.length > 0) {
                const retestWords = wrongWords.map(w => ({ en: w.en, zh: w.zh, mnemonic: w.mnemonic }));
                startGame(retestWords);
            }
        });
    </script>
</body>
</html>
