<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P6 單字特訓站 | Week 5 & Week 6</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.92);
      --card-border: rgba(255, 255, 255, 0.1);
      --neon-cyan: #00f0ff;
      --neon-magenta: #ff007f;
      --neon-green: #39ff14;
      --neon-amber: #ffbe0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 12% 15%, rgba(255, 0, 127, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 88% 85%, rgba(0, 240, 255, 0.14) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 12px var(--neon-cyan), 0 0 24px rgba(0, 240, 255, 0.6);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--neon-amber);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* 頂部控制面板 */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.15);
      border-radius: 16px;
      padding: 16px 20px;
      width: 100%;
      max-width: 860px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .row-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-chip:hover {
      border-color: var(--neon-cyan);
      color: #fff;
    }

    .btn-chip.active {
      background: var(--neon-cyan);
      color: #050811;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px var(--neon-cyan);
      font-weight: 800;
    }

    .btn-chip.mode-active {
      background: var(--neon-magenta);
      color: #fff;
      border-color: var(--neon-magenta);
      box-shadow: 0 0 14px var(--neon-magenta);
      font-weight: 800;
    }

    ruby {
      font-weight: 700;
      ruby-position: over;
      line-height: 1.8;
      margin: 0 2px;
    }

    rt {
      font-size: 0.55em;
      font-weight: 400;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    /* ================= 1. 考試模式樣式 ================= */
    #examView {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .exam-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 0, 127, 0.35);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.15);
      border-radius: 20px;
      padding: 36px 24px;
      width: 100%;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .card-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tag {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-week {
      background: rgba(0, 240, 255, 0.15);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
    }

    .chinese-prompt {
      margin: 10px 0 20px 0;
      text-align: center;
      font-size: 2.2rem;
    }

    .input-box {
      width: 100%;
      max-width: 460px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1.25rem;
      color: #fff;
      text-align: center;
      outline: none;
      transition: all 0.25s ease;
      letter-spacing: 1px;
    }

    input[type="text"]:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 15px var(--neon-green);
    }

    input[type="text"]:disabled {
      background: rgba(30, 41, 59, 0.65);
      border-color: #ff4757;
      color: #cbd5e1;
      cursor: not-allowed;
    }

    .action-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
      margin-bottom: 16px;
    }

    .action-btn {
      padding: 11px 22px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-submit {
      background: var(--neon-green);
      color: #061805;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
    }
    .btn-submit:hover:not(:disabled) {
      box-shadow: 0 0 25px var(--neon-green);
      transform: translateY(-2px);
    }
    .btn-submit:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-next-action {
      background: var(--neon-cyan);
      color: #030712;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .btn-next-action:hover {
      box-shadow: 0 0 25px var(--neon-cyan);
      transform: translateY(-2px);
    }

    .btn-audio {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
    }
    .btn-audio:hover {
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 15px var(--neon-cyan);
    }

    .reveal-card {
      width: 100%;
      background: rgba(0, 0, 0, 0.75);
      border: 2px dashed var(--neon-magenta);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      display: none;
      margin-top: 12px;
      animation: fadeIn 0.3s ease;
    }

    .reveal-title {
      font-size: 0.95rem;
      color: #ff4757;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .answer-word {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      text-shadow: 0 0 12px var(--neon-cyan);
      margin-bottom: 6px;
    }

    .mnemonic-text {
      color: var(--neon-amber);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .feedback {
      min-height: 32px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
    }
    .feedback.correct {
      color: var(--neon-green);
      text-shadow: 0 0 10px var(--neon-green);
    }
    .feedback.wrong {
      color: #ff4757;
      text-shadow: 0 0 10px #ff4757;
    }

    .stats-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 14px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
      width: 0%;
      transition: width 0.3s ease;
    }

    .retest-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      width: 100%;
    }

    /* ================= 2. 練習模式樣式 (Practice Mode) ================= */
    #practiceView {
      width: 100%;
      max-width: 860px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .practice-toolbar {
      position: sticky;
      top: 16px;
      z-index: 100;
      background: rgba(11, 15, 25, 0.94);
      border: 1px solid var(--neon-cyan);
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.2);
      border-radius: 14px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
    }

    .practice-counter {
      font-size: 0.95rem;
      color: var(--neon-cyan);
      font-weight: 700;
    }

    .practice-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .practice-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .practice-card:hover {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.08);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-chinese {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }

    .card-interactive-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .practice-input {
      flex: 1;
      min-width: 200px;
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1.1rem;
      color: #fff;
      outline: none;
      transition: all 0.25s ease;
    }

    .practice-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .practice-input.is-correct {
      border-color: var(--neon-green);
      background: rgba(57, 255, 20, 0.08);
    }

    .practice-input.is-wrong {
      border-color: #ff4757;
      background: rgba(255, 71, 87, 0.08);
    }

    .practice-btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-prac {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-prac-audio {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
    }
    .btn-prac-audio:hover {
      background: var(--neon-cyan);
      color: #0b0f19;
    }

    .btn-prac-reveal {
      background: rgba(255, 0, 127, 0.1);
      border: 1px solid var(--neon-magenta);
      color: var(--neon-magenta);
    }
    .btn-prac-reveal:hover {
      background: var(--neon-magenta);
      color: #fff;
    }

    .practice-reveal-box {
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid var(--neon-magenta);
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .practice-target-word {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--neon-cyan);
      margin-bottom: 4px;
    }

    .practice-mnemonic-desc {
      color: var(--neon-amber);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>VOCABULARY ARENA</h1>
    <div class="subtitle">✨ 國小 P6 英語字彙特訓 • 暗黑霓虹互動站 ✨</div>
  </header>

  <!-- 頂部控制面板 -->
  <div class="controls-panel">
    <!-- 模式選擇 -->
    <div class="control-row">
      <div class="row-label">
        <ruby>模<rt>ㄇㄛˊ</rt></ruby><ruby>式<rt>ㄕˋ</rt></ruby><ruby>選<rt>ㄒㄩㄢˇ</rt></ruby><ruby>擇<rt>ㄗㄜˊ</rt></ruby> (Study Mode)：
      </div>
      <div class="btn-group">
        <button class="btn-chip mode-active" id="btnModeExam" onclick="switchMode('exam')">
          ✍️ <ruby>開<rt>ㄎㄞ</rt></ruby><ruby>始<rt>ㄕˇ</rt></ruby><ruby>考<rt>ㄎㄠˇ</rt></ruby><ruby>試<rt>ㄕˋ</rt></ruby> (Exam Mode)
        </button>
        <button class="btn-chip" id="btnModePractice" onclick="switchMode('practice')">
          📖 <ruby>我<rt>ㄨㄛˇ</rt></ruby><ruby>要<rt>ㄧㄠˋ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt></ruby><ruby>習<rt>ㄒㄧˊ</rt></ruby> (Practice Mode)
        </button>
      </div>
    </div>

    <!-- 範圍篩選 -->
    <div class="control-row">
      <div class="row-label">
        <ruby>範<rt>ㄈㄢˋ</rt></ruby><ruby>圍<rt>ㄨㄟˊ</rt></ruby><ruby>選<rt>ㄒㄩㄢˇ</rt></ruby><ruby>擇<rt>ㄗㄜˊ</rt></ruby> (Scope)：
      </div>
      <div class="btn-group">
        <button class="btn-chip active" id="scopeAll" onclick="setScope('all')">全範圍 (Week 5 + 6，共 66 字)</button>
        <button class="btn-chip" id="scopeW5" onclick="setScope('week5')">僅 Week 5 (33字)</button>
        <button class="btn-chip" id="scopeW6" onclick="setScope('week6')">僅 Week 6 (33字)</button>
      </div>
    </div>
  </div>

  <!-- ================= 視圖 1：考試模式 (Exam View) ================= -->
  <div id="examView">
    <div class="exam-card">
      <div class="card-meta">
        <span class="tag tag-week" id="cardWeek">WEEK 5</span>
      </div>

      <div class="chinese-prompt" id="chinesePrompt"></div>
      <div class="feedback" id="feedback"></div>

      <div class="input-box">
        <input type="text" id="answerInput" placeholder="請在此輸入英文拼寫..." autocomplete="off">
      </div>

      <div class="action-btn-group">
        <button class="action-btn btn-submit" id="btnSubmitExam" onclick="checkExamAnswer()">
          <ruby>驗<rt>ㄧㄢˋ</rt></ruby><ruby>證<rt>ㄓㄥˋ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby> (Enter)
        </button>
        <button class="action-btn btn-next-action" id="btnNextExam" onclick="handleNextClick()">
          <ruby>下<rt>ㄒㄧㄚˋ</rt></ruby><ruby>一<rt>ㄧ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby> ➔
        </button>
        <button class="action-btn btn-audio" onclick="playWordAudio(currentExamList[currentExamIndex].word)">
          🔊 <ruby>聽<rt>㊊ㄧㄥ</rt></ruby><ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby>
        </button>
      </div>

      <!-- 答錯時自動展開的答案與口訣區塊 -->
      <div class="reveal-card" id="revealCard">
        <div class="reveal-title">⚠️ <ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt></ruby><ruby>布<rt>ㄅㄨˋ</rt></ruby><ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>解<rt>ㄐㄧㄝˇ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby>（<ruby>已<rt>ㄧˇ</rt></ruby><ruby>鎖<rt>ㄙㄨㄛˇ</rt></ruby><ruby>定<rt>ㄉㄧㄥˋ</rt></ruby>）</div>
        <div class="answer-word" id="revealWord">word</div>
        <div class="mnemonic-text" id="revealMnemonic">口訣載入中...</div>
      </div>

      <!-- 錯題重測區塊 -->
      <div class="retest-panel" id="retestPanel">
        <button class="action-btn btn-submit" onclick="startRetestWrong()">
          🔄 <ruby>重<rt>ㄔㄨㄥˊ</rt></ruby><ruby>測<rt>ㄘㄜˋ</rt></ruby><ruby>剛<rt>ㄍㄤ</rt></ruby><ruby>才<rt>ㄘㄞˊ</rt></ruby><ruby>的<rt>ㄉㄜ˙</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby>
        </button>
      </div>

      <div class="stats-bar">
        <span id="scoreText">答對: 0 題</span>
        <span id="counterText">題目: 1 / 66</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
    </div>
  </div>

  <!-- ================= 視圖 2：練習模式 (Practice View) ================= -->
  <div id="practiceView">
    <div class="practice-toolbar">
      <div class="practice-counter" id="pracCounter">當前範圍：共 66 個單字</div>
      <div class="btn-group">
        <button class="btn-chip" style="border-color: var(--neon-magenta); color: var(--neon-magenta);" onclick="toggleGlobalReveal()">
          🚀 <ruby>一<rt>ㄧ</rt></ruby><ruby>鍵<rt>ㄐㄧㄢˋ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt></ruby><ruby>布<rt>ㄅㄨˋ</rt></ruby><ruby>全<rt>ㄑㄩㄢˊ</rt></ruby><ruby>部<rt>ㄅㄨˋ</rt></ruby>
        </button>
        <button class="btn-chip" onclick="resetPracticeInputs()">
          🧹 <ruby>清<rt>ㄑㄧㄥ</rt></ruby><ruby>空<rt>ㄎㄨㄥ</rt></ruby><ruby>重<rt>ㄔㄨㄥˊ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt></ruby>
        </button>
      </div>
    </div>

    <div class="practice-list" id="practiceContainer"></div>
  </div>

  <script>
    // 完整字彙資料庫 (全新 Week 5 與 Week 6)
    const rawVocab = [

    let currentMode = 'exam';
    let currentScope = 'all';
    let activeVocabList = [];

    // 考試狀態變數
    let currentExamList = [];
    let currentExamIndex = 0;
    let examScore = 0;
    let hasAnsweredCurrent = false; // 是否已判定當前題目
    let wrongExamList = [];         // 記錄答錯題目
    let wrongActionTimestamp = 0;   // 答錯時間戳記，防止連按 Enter 跳過

    // 洗牌演算法
    function shuffleArray(arr) {
      let copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 發音
    function playWordAudio(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 更新篩選作用清單
    function updateActiveList() {
      if (currentScope === 'all') {
        activeVocabList = [...rawVocab];
      } else {
        activeVocabList = rawVocab.filter(item => item.week === currentScope);
      }
    }

    // 設定範圍
    function setScope(scope) {
      currentScope = scope;
      document.querySelectorAll(".controls-panel .control-row:nth-child(2) .btn-chip").forEach(btn => btn.classList.remove("active"));
      if (scope === 'all') document.getElementById("scopeAll").classList.add("active");
      if (scope === 'week5') document.getElementById("scopeW5").classList.add("active");
      if (scope === 'week6') document.getElementById("scopeW6").classList.add("active");

      updateActiveList();

      if (currentMode === 'exam') {
        startExam();
      } else {
        renderPracticeMode();
      }
    }

    // 切換模式
    function switchMode(mode) {
      currentMode = mode;
      const btnExam = document.getElementById("btnModeExam");
      const btnPrac = document.getElementById("btnModePractice");
      const examView = document.getElementById("examView");
      const practiceView = document.getElementById("practiceView");

      if (mode === 'exam') {
        btnExam.classList.add("mode-active");
        btnPrac.classList.remove("mode-active");
        examView.style.display = "flex";
        practiceView.style.display = "none";
        startExam();
      } else {
        btnPrac.classList.add("mode-active");
        btnExam.classList.remove("mode-active");
        practiceView.style.display = "flex";
        examView.style.display = "none";
        renderPracticeMode();
      }
    }

    // ================= 考試模式實作 =================
    function startExam() {
      currentExamList = shuffleArray(activeVocabList);
      currentExamIndex = 0;
      examScore = 0;
      wrongExamList = [];
      document.getElementById("retestPanel").style.display = "none";
      loadExamCard();
    }

    function loadExamCard() {
      if (currentExamList.length === 0) return;
      hasAnsweredCurrent = false;
      wrongActionTimestamp = 0;

      const current = currentExamList[currentExamIndex];
      const input = document.getElementById("answerInput");
      const btnSubmit = document.getElementById("btnSubmitExam");
      const feedback = document.getElementById("feedback");

      document.getElementById("cardWeek").innerText = current.week.toUpperCase();
      document.getElementById("chinesePrompt").innerHTML = current.ruby;

      // 重新啟用輸入框與驗證按鈕
      input.value = "";
      input.disabled = false;
      input.placeholder = "請輸入英文拼寫後按 Enter...";
      btnSubmit.disabled = false;

      feedback.innerHTML = "";
      feedback.className = "feedback";
      document.getElementById("revealCard").style.display = "none";

      document.getElementById("revealWord").innerText = current.word;
      document.getElementById("revealMnemonic").innerHTML = "💡 <ruby>口<rt>ㄎㄡˇ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt></ruby>：" + current.hint;

      document.getElementById("scoreText").innerText = `答對: ${examScore} 題`;
      document.getElementById("counterText").innerText = `題目: ${currentExamIndex + 1} / ${currentExamList.length}`;
      document.getElementById("progressBar").style.width = `${(currentExamIndex / currentExamList.length) * 100}%`;

      setTimeout(() => {
        input.focus();
      }, 50);
    }

    // 驗證答案
    function checkExamAnswer() {
      if (hasAnsweredCurrent) return;

      const input = document.getElementById("answerInput");
      const btnSubmit = document.getElementById("btnSubmitExam");
      const feedback = document.getElementById("feedback");
      const current = currentExamList[currentExamIndex];
      const val = input.value.trim().toLowerCase();

      if (!val) {
        feedback.innerHTML = "<ruby>請<rt>ㄑㄧㄥˇ</rt></ruby><ruby>先<rt>ㄒㄧㄢ</rt></ruby><ruby>輸<rt>ㄕㄨ</rt></ruby><ruby>入<rt>ㄖㄨˋ</rt></ruby><ruby>單<rt>ㄉㄢ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby><ruby>拼<rt>ㄆㄧㄣ</rt></ruby><ruby>寫<rt>ㄒㄧㄝˇ</rt></ruby><ruby>唷<rt>ㄧㄛ</rt></ruby>！";
        feedback.className = "feedback wrong";
        return;
      }

      hasAnsweredCurrent = true;

      if (val === current.word.toLowerCase()) {
        // === 答對狀況 ===
        feedback.innerHTML = "✨ <ruby>太<rt>ㄊㄞˋ</rt></ruby><ruby>棒<rt>ㄅㄤˋ</rt></ruby><ruby>了<rt>ㄌㄜ˙</rt></ruby>！<ruby>拼<rt>ㄆㄧㄣ</rt></ruby><ruby>寫<rt>ㄒㄧㄝˇ</rt></ruby><ruby>完<rt>ㄨㄢˊ</rt></ruby><ruby>全<rt>ㄑㄩㄢˊ</rt></ruby><ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby>！";
        feedback.className = "feedback correct";
        input.disabled = true;
        btnSubmit.disabled = true;
        examScore++;
        document.getElementById("scoreText").innerText = `答對: ${examScore} 題`;
        playWordAudio(current.word);

        // 答對停留 1 秒自動載入下一題
        setTimeout(() => {
          nextExamWord();
        }, 1000);
      } else {
        // === 答錯防作弊機制：立刻鎖定、公布答案、進入檢視冷卻 ===
        wrongActionTimestamp = Date.now();

        feedback.innerHTML = "❌ <ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>了<rt>ㄌㄜ˙</rt></ruby>！<ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby><ruby>已<rt>ㄧˇ</rt></ruby><ruby>鎖<rt>ㄙㄨㄛˇ</rt></ruby><ruby>定<rt>ㄉㄧㄥˋ</rt></ruby>。請<rt>ㄑㄧㄥˇ</rt><ruby>記<rt>ㄐㄧˋ</rt></ruby><ruby>熟<rt>ㄕㄡˊ</rt></ruby><ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>解<rt>ㄐㄧㄝˇ</rt></ruby>，<ruby>再<rt>ㄗㄞˋ</rt></ruby><ruby>按<rt>ㄢˋ</rt></ruby> Enter <ruby>或<rt>ㄏㄨㄛˋ</rt></ruby>「<ruby>下<rt>ㄒㄧㄚˋ</rt></ruby><ruby>一<rt>ㄧ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby>」！";
        feedback.className = "feedback wrong";

        // 強制鎖定輸入框，無法再次改寫
        input.disabled = true;
        btnSubmit.disabled = true;

        // 記錄進錯題庫
        wrongExamList.push(current);

        // 展開解答與口訣並朗讀發音
        document.getElementById("revealCard").style.display = "block";
        playWordAudio(current.word);
      }
    }

    // 處理點擊「下一題」
    function handleNextClick() {
      if (!hasAnsweredCurrent) {
        hasAnsweredCurrent = true;
        wrongExamList.push(currentExamList[currentExamIndex]);
      }
      nextExamWord();
    }

    // 前往下一題
    function nextExamWord() {
      if (currentExamIndex < currentExamList.length - 1) {
        currentExamIndex++;
        loadExamCard();
      } else {
        finishExam();
      }
    }

    // 考試結束結算
    function finishExam() {
      document.getElementById("progressBar").style.width = "100%";
      document.getElementById("chinesePrompt").innerHTML = `<ruby>考<rt>ㄎㄠˇ</rt></ruby><ruby>試<rt>ㄕˋ</rt></ruby><ruby>結<rt>ㄐㄧㄝˊ</rt></ruby><ruby>束<rt>ㄕㄨˋ</rt></ruby>！`;
      const feedback = document.getElementById("feedback");
      feedback.innerHTML = `🎉 <ruby>測<rt>ㄘㄜˋ</rt></ruby><ruby>驗<rt>ㄧㄢˋ</rt></ruby><ruby>完<rt>ㄨㄢˊ</rt></ruby><ruby>成<rt>ㄔㄥˊ</rt></ruby>！<ruby>最<rt>ㄗㄨㄟˋ</rt></ruby><ruby>終<rt>ㄓㄨㄥ</rt></ruby><ruby>成<rt>ㄔㄥˊ</rt></ruby><ruby>績<rt>ㄐㄧ</rt></ruby>：${examScore} / ${currentExamList.length} 分`;
      feedback.className = "feedback correct";
      
      document.getElementById("revealCard").style.display = "none";
      document.getElementById("answerInput").style.display = "none";
      document.getElementById("btnSubmitExam").style.display = "none";
      document.getElementById("btnNextExam").style.display = "none";

      if (wrongExamList.length > 0) {
        const retestPanel = document.getElementById("retestPanel");
        retestPanel.style.display = "flex";
      }
    }

    // 錯題重新測驗
    function startRetestWrong() {
      currentExamList = shuffleArray(wrongExamList);
      wrongExamList = [];
      currentExamIndex = 0;
      examScore = 0;

      document.getElementById("answerInput").style.display = "block";
      document.getElementById("btnSubmitExam").style.display = "flex";
      document.getElementById("btnNextExam").style.display = "flex";
      document.getElementById("retestPanel").style.display = "none";

      loadExamCard();
    }

    // 全域鍵盤監聽（防止連擊 Enter 誤跳）
    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && currentMode === 'exam') {
        e.preventDefault();

        if (!hasAnsweredCurrent) {
          checkExamAnswer();
        } else {
          // 答錯後至少必須停留在畫面上 0.6 秒以上才允許按 Enter 跳下一題
          if (Date.now() - wrongActionTimestamp < 600) {
            return;
          }
          nextExamWord();
        }
      }
    });

    // ================= 練習模式實作 =================
    function renderPracticeMode() {
      const container = document.getElementById("practiceContainer");
      const counter = document.getElementById("pracCounter");
      container.innerHTML = "";
      counter.innerText = `當前範圍：共 ${activeVocabList.length} 個單字`;

      activeVocabList.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "practice-card";
        card.innerHTML = `
          <div class="card-top">
            <div class="card-meta">
              <span class="tag tag-week">${item.week.toUpperCase()}</span>
            </div>
            <div style="color: var(--text-muted); font-size: 0.85rem;">#${index + 1}</div>
          </div>
          <div class="card-chinese">${item.ruby}</div>
          <div class="card-interactive-row">
            <input type="text" class="practice-input" id="pracInput_${index}" placeholder="輸入拼寫自主檢核..." oninput="checkPracticeTyping(${index}, '${item.word}')">
            <div class="practice-btn-group">
              <button class="btn-prac btn-prac-audio" onclick="playWordAudio('${item.word}')">
                🔊 <ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby>
              </button>
              <button class="btn-prac btn-prac-reveal" onclick="toggleSinglePracReveal(${index})">
                💡 <ruby>公<rt>ㄍㄨㄥ</rt></ruby><ruby>布<rt>ㄅㄨˋ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby><ruby>與<rt>ㄩˇ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt></ruby><ruby>竅<rt>ㄑㄧㄠˋ</rt></ruby>
              </button>
            </div>
          </div>
          <div class="practice-reveal-box" id="pracReveal_${index}">
            <div class="practice-target-word">${item.word}</div>
            <div class="practice-mnemonic-desc">💡 <ruby>口<rt>ㄎㄡˇ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt></ruby>：${item.hint}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function checkPracticeTyping(index, targetWord) {
      const input = document.getElementById(`pracInput_${index}`);
      const val = input.value.trim().toLowerCase();
      if (!val) {
        input.classList.remove("is-correct", "is-wrong");
        return;
      }
      if (val === targetWord.toLowerCase()) {
        input.classList.add("is-correct");
        input.classList.remove("is-wrong");
      } else {
        input.classList.remove("is-correct");
        input.classList.add("is-wrong");
      }
    }

    function toggleSinglePracReveal(index) {
      const box = document.getElementById(`pracReveal_${index}`);
      if (box.style.display === "block") {
        box.style.display = "none";
      } else {
        box.style.display = "block";
        playWordAudio(activeVocabList[index].word);
      }
    }

    let isAllRevealed = false;
    function toggleGlobalReveal() {
      isAllRevealed = !isAllRevealed;
      activeVocabList.forEach((_, index) => {
        const box = document.getElementById(`pracReveal_${index}`);
        if (box) box.style.display = isAllRevealed ? "block" : "none";
      });
    }

    function resetPracticeInputs() {
      activeVocabList.forEach((_, index) => {
        const input = document.getElementById(`pracInput_${index}`);
        const box = document.getElementById(`pracReveal_${index}`);
        if (input) {
          input.value = "";
          input.classList.remove("is-correct", "is-wrong");
        }
        if (box) box.style.display = "none";
      });
      isAllRevealed = false;
    }

    // 初始化啟動
    window.onload = function() {
      updateActiveList();
      switchMode('exam');
    };
  </script>
</body>
</html>
