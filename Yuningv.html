<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寧寧的單字挑戰 - 酷炫暗色特仕版</title>
    <style>
        /* --- 全局暗色主題設定 --- */
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* 深色背景 */
            color: #e0e0e0;
            transition: background-color 0.5s;
        }

        /* --- 通用容器樣式 --- */
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.2);
            border: 1px solid #333;
            width: 90%;
            max-width: 650px;
            max-height: 90vh;
            position: relative;
            overflow-y: auto; 
        }

        h1 { 
            margin-top: 0; 
            color: #00e676; 
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }
        
        h2 { color: #2979ff; }

        /* --- 按鈕通用樣式 --- */
        button {
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        button:active { transform: scale(0.95); }

        /* --- 發音按鈕樣式 --- */
        .tts-btn {
            background-color: #00bcd4;
            color: white;
            font-size: 14px;
            padding: 6px 12px;
            margin: 5px 0 0 10px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
        }
        .tts-btn:hover { background-color: #0097a7; box-shadow: 0 0 15px rgba(0, 188, 212, 0.6); }

        /* --- 首頁選單樣式 --- */
        #menu-screen { display: block; }
        .menu-btn {
            display: block;
            width: 80%;
            margin: 20px auto;
            background-color: #2979ff; 
            color: white;
            box-shadow: 0 4px 15px rgba(41, 121, 255, 0.4);
        }
        .menu-btn:hover { background-color: #2264d1; }
        .ruby-text { font-size: 0.8em; display: block; margin-bottom: 2px; color: #b3e5fc; font-weight: normal; }

        /* --- 考試模式樣式 --- */
        #exam-screen { display: none; }
        .exam-input {
            padding: 15px;
            font-size: 20px;
            width: 75%;
            margin-bottom: 15px;
            border: 2px solid #555;
            border-radius: 8px;
            background-color: #2c2c2c;
            color: #fff;
            text-align: center;
        }
        .exam-input:focus {
            outline: none;
            border-color: #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }
        .exam-input:disabled {
            background-color: #1a1a1a;
            border-color: #f44336;
            color: #888;
            cursor: not-allowed;
        }
        
        .exam-btn { background-color: #00e676; color: #121212; }
        .exam-btn:hover { background-color: #00c853; }
        .exam-btn-next { background-color: #ff9100; color: #121212; }
        
        #mnemonic {
            font-size: 16px;
            margin-top: 15px;
            color: #e0e0e0;
            text-align: left;
            padding: 15px;
            border: 1px solid #444;
            border-left: 5px solid #ff1744;
            border-radius: 8px;
            background-color: #2a1b1b;
            line-height: 1.6;
        }
        
        #wrong-words-summary { 
            text-align: left; 
            margin-top: 20px;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .summary-item {
            padding: 8px 0;
            border-bottom: 1px dashed #444;
        }
        .summary-item:last-child { border-bottom: none; }

        /* --- 練習模式樣式 --- */
        #practice-screen { display: none; flex-direction: column; padding: 0; overflow: hidden; }
        
        .practice-fixed-top {
            background-color: #1e1e1e;
            padding: 20px;
            border-bottom: 2px solid #333;
            z-index: 10;
        }

        .top-btn-group { display: flex; gap: 10px; margin-bottom: 10px; }

        #practice-list-container {
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 10px 20px 20px 20px;
            scrollbar-width: thin;
            scrollbar-color: #555 #1e1e1e;
        }
        
        #practice-list-container::-webkit-scrollbar { width: 8px; }
        #practice-list-container::-webkit-scrollbar-track { background: #1e1e1e; }
        #practice-list-container::-webkit-scrollbar-thumb { background-color: #555; border-radius: 4px; }

        .practice-row-container {
            border-bottom: 1px solid #333;
            padding: 15px 0;
        }

        .practice-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .col-zh { width: 35%; text-align: left; font-size: 16px; color: #ffeb3b; }
        .col-input { width: 35%; }
        .col-ans { width: 30%; text-align: right; color: #00e676; font-weight: bold; font-size: 18px; display: flex; flex-direction: column; align-items: flex-end;}

        .practice-input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
            background-color: #2c2c2c;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
        }
        .practice-input.correct { border-color: #00e676; background-color: #14301c; }
        .practice-input.wrong { border-color: #ff1744; background-color: #3b1619; }

        .practice-mnemonic {
            display: none;
            margin-top: 10px;
            font-size: 14px;
            color: #b0bec5;
            text-align: left;
            background-color: #263238;
            padding: 12px;
            border-left: 4px solid #2979ff;
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }

        .global-toggle-btn {
            background-color: #ff1744;
            color: white;
            width: 100%;
            margin: 0;
            padding: 12px;
        }
        .global-toggle-btn:hover { background-color: #d50000; }

        .header-back-btn {
            background-color: #546e7a;
            color: white;
            width: 30%;
            margin: 0;
            font-size: 14px;
            padding: 10px;
        }

        .answer-text { display: none; margin-bottom: 5px; }
        
        .list-header {
            display: flex; 
            justify-content: space-between; 
            color: #888; 
            font-size: 14px; 
            margin-top: 15px;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- 1. 首頁選單 -->
    <div id="menu-screen" class="container">
        <h1>寧寧的英文單字特訓</h1>
        <p style="color: #aaa;">暗色特仕版</p>
        
        <button class="menu-btn" onclick="goToExam()">
            <span class="ruby-text">ㄎㄞ ㄕˇ ㄎㄠˇ ㄕˋ</span>
            開始考試
        </button>

        <button class="menu-btn" onclick="goToPractice()" style="background-color: #ff9100; box-shadow: 0 4px 15px rgba(255, 145, 0, 0.4);">
            <span class="ruby-text">ㄨㄛˇ ㄧㄠˋ ㄌㄧㄢˋ ㄒㄧˊ</span>
            我要練習
        </button>
    </div>

    <!-- 2. 考試模式 -->
    <div id="exam-screen" class="container">
        <h2>單字拼寫嚴格測驗</h2>
        <div id="question" style="font-size: 24px; margin: 20px 0; color: #ffeb3b;">載入題目中...</div>
        <input type="text" id="exam-answer" class="exam-input" placeholder="輸入英文拼寫 (大小寫皆可)" autocomplete="off">
        <br>
        <button id="exam-submit" class="exam-btn">提交</button>
        <div id="exam-result" style="font-size: 22px; margin-top: 15px; font-weight: bold;"></div>
        <div id="mnemonic" style="display: none;"></div>
        <div id="score" style="font-size: 18px; margin-top: 20px; color: #aaa;">分數: 0 / 0</div>
        
        <!-- 考後總結報告區塊 -->
        <div id="wrong-words-summary" style="display: none;"></div>
        
        <button id="exam-restart" class="exam-btn" style="display: none; margin-top: 20px;">重新開始</button>
        <button id="exam-retest" class="exam-btn" style="display: none; background-color: #2979ff; margin-top: 20px;">重測錯題</button>
        <button class="menu-btn" style="background-color:#546e7a; width: 60%; margin-top: 20px;" onclick="goHome()">回首頁</button>
    </div>

    <!-- 3. 練習模式 -->
    <div id="practice-screen" class="container">
        <div class="practice-fixed-top">
            <h2 style="margin: 0 0 15px 0;">單字練習室</h2>
            <div class="top-btn-group">
                <button class="header-back-btn" onclick="goHome()">
                    回首頁<br><span style="font-size:0.8em">ㄏㄨㄟˊ ㄕㄡˇ ㄧㄝˋ</span>
                </button>
                <button id="toggle-all-btn" class="global-toggle-btn" style="width: 70%;" onclick="toggleAllAnswers()">
                    顯示所有答案 / 批改
                    <br><span style="font-size:0.8em">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>
                </button>
            </div>
            <div class="list-header">
                <span style="width:35%; text-align:left;">中文意思 (含注音)</span>
                <span style="width:35%">拼寫練習</span>
                <span style="width:30%; text-align:right;">正確答案</span>
            </div>
        </div>
        <div id="practice-list-container">
            <div id="practice-list"></div>
        </div>
    </div>

    <script>
        // 包含 33 個單字與注音的題庫
        const words = [
            { en: 'fear', zh: '恐懼 (ㄎㄨㄥˇ ㄐㄩˋ)', mnemonic: '聽起來像 tear (眼淚)。因為極度恐懼而流下眼淚。' },
            { en: 'mysterious', zh: '神秘的 (ㄕㄣˊ ㄇㄧˋ ㄉㄜ˙)', mnemonic: 'mystery (神秘) 加上 ous (的形容詞字尾)。充滿未知與神秘的。' },
            { en: 'substance', zh: '物質 (ㄨˋ ㄓˊ)', mnemonic: 'sub (在下面) + stance (站立)。支撐在底下、構成事物的基本物質。' },
            { en: 'rarely', zh: '很少 (ㄏㄣˇ ㄕㄠˇ)', mnemonic: 'rare (稀有) + ly (地)。非常稀有，代表很少發生。' },
            { en: 'particle', zh: '粒子 (ㄌㄧˋ ㄗˇ)', mnemonic: 'part (部分) + icle (小)。物質中極小的部分就是粒子。' },
            { en: 'support', zh: '支持 (ㄓ ㄔˊ)', mnemonic: 'sup (在下面) + port (攜帶/支撐)。在底下撐著，給予支持。' },
            { en: 'blend', zh: '混合 (ㄏㄨㄣˋ ㄏㄜˊ)', mnemonic: '想像使用 blender (果汁機) 把各種水果混合在一起。' },
            { en: 'conflict', zh: '衝突 (ㄔㄨㄥ ㄊㄨˊ)', mnemonic: 'con (一起) + flict (打擊)。雙方互相打擊，產生了衝突。' },
            { en: 'branch', zh: '樹枝 (ㄕㄨˋ ㄓ)', mnemonic: '聽起來像 bench (長椅)。想像一張用粗壯樹枝做成的木製長椅。' },
            { en: 'cream', zh: '奶油 (ㄋㄞˇ ㄧㄡˊ)', mnemonic: '包含在 ice cream (冰淇淋) 裡面，香甜滑順的奶油。' },
            { en: 'grant', zh: '准許 (ㄓㄨㄣˇ ㄒㄩˇ)', mnemonic: '聽起來像 grand (宏大的)。宏大威嚴的國王准許了你的請求。' },
            { en: 'risk', zh: '風險 (ㄈㄥ ㄒㄧㄢˇ)', mnemonic: '聽起來像 rise (上升) + k。攀登高山不斷上升是伴隨著風險的。' },
            { en: 'respect', zh: '尊敬 (ㄗㄨㄣ ㄐㄧㄥˋ)', mnemonic: 're (再/重複) + spect (看)。因為尊敬，所以讓人忍不住一再注視。' },
            { en: 'spinach', zh: '菠菜 (ㄅㄛ ㄘㄞˋ)', mnemonic: 'spin (旋轉) + ach (痛)。大力水手吃完菠菜後，旋轉出拳把壞人打得很痛。' },
            { en: 'frost', zh: '霜 (ㄕㄨㄤ)', mnemonic: '與 freeze (結冰) 相關。天氣非常冷，水氣在結冰前會在葉子上結成霜。' },
            { en: 'bloom', zh: '開花 (ㄎㄞ ㄏㄨㄚ)', mnemonic: '聽起來像 boom (爆炸的聲音)。春天一到，花朵就像煙火爆炸一樣盛開。' },
            { en: 'flash', zh: '閃光 (ㄕㄢˇ ㄍㄨㄤ)', mnemonic: '就像超級英雄閃電俠 (The Flash) 一樣，伴隨著一道快速的閃光。' },
            { en: 'breakfast', zh: '早餐 (ㄗㄠˇ ㄘㄢ)', mnemonic: 'break (打破/中斷) + fast (禁食)。打破一整晚沒有吃東西的狀態，就是吃早餐。' },
            { en: 'secret', zh: '秘密 (ㄇㄧˋ ㄇㄧˋ)', mnemonic: 'se (分開) + cret (看)。把大家分開，只能躲在角落偷偷看的就是秘密。' },
            { en: 'grade', zh: '年級/成績 (ㄋㄧㄢˊ ㄐㄧˊ / ㄔㄥˊ ㄐㄧ)', mnemonic: '聽起來像 great (棒的)。在學校拿到好成績 (grade) 是一件很棒 (great) 的事。' },
            { en: 'skunk', zh: '臭鼬 (ㄔㄡˋ ㄧㄡˋ)', mnemonic: '聽起來像 stunk (發臭的過去式)。這種會散發臭味的動物就是臭鼬。' },
            { en: 'animal', zh: '動物 (ㄉㄨㄥˋ ㄨˋ)', mnemonic: 'anima (靈魂/生命氣息) + al。擁有生命氣息會活動的生物。' },
            { en: 'drink', zh: '喝 (ㄏㄜ)', mnemonic: '聽起來像 sink (下沉)。咕嚕咕嚕喝下去的水，慢慢沉入肚子裡。' },
            { en: 'blackboard', zh: '黑板 (ㄏㄟ ㄅㄢˇ)', mnemonic: 'black (黑色的) + board (板子)。教室裡黑色的板子就是黑板。' },
            { en: 'weeds', zh: '雜草 (ㄗㄚˊ ㄘㄠˇ)', mnemonic: '聽起來像 need (需要)。花園裡的雜草是「需要」被立刻拔除的。' },
            { en: 'bitter', zh: '苦的 (ㄎㄨˇ ㄉㄜ˙)', mnemonic: 'bite (咬) + ter。你咬了一口苦瓜，馬上覺得味道非常苦。' },
            { en: 'everybody', zh: '每個人 (ㄇㄟˇ ㄍㄜ˙ ㄖㄣˊ)', mnemonic: 'every (每一個) + body (身體/人)。指在場的每一個人。' },
            { en: 'ankle', zh: '腳踝 (ㄐㄧㄠˇ ㄏㄨㄞˊ)', mnemonic: '聽起來像 uncle (叔叔)。叔叔在跑步的時候不小心扭到了腳踝。' },
            { en: 'greatest', zh: '最偉大的 (ㄗㄨㄟˋ ㄨㄟˇ ㄉㄚˋ ㄉㄜ˙)', mnemonic: 'great (偉大的) + est (最高級字尾)。代表無人能比，最偉大的。' },
            { en: 'chase', zh: '追逐 (ㄓㄨㄟ ㄓㄨˊ)', mnemonic: '聽起來像 chess (西洋棋)。下棋就像兩方在棋盤上互相追逐廝殺。' },
            { en: 'everyone', zh: '每個人 (ㄇㄟˇ ㄍㄜ˙ ㄖㄣˊ)', mnemonic: 'every (每一個) + one (人)。也就是指每一個人。' },
            { en: 'present', zh: '禮物/現在 (ㄌㄧˇ ㄨˋ / ㄒㄧㄢˋ ㄗㄞˋ)', mnemonic: 'pre (提前) + sent (送出)。在節日到來前提前送出去的驚喜就是禮物。' },
            { en: 'challenge', zh: '挑戰 (ㄊㄧㄠˇ ㄓㄢˋ)', mnemonic: '聽起來像 call (呼叫)。大聲呼叫對手出來，向他發起挑戰。' }
        ];

        /* --- 語音朗讀 API --- */
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("很抱歉，您的瀏覽器目前不支援語音朗讀功能。");
            }
        }

        /* --- 安全洗牌演算法 --- */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }

        /* --- 頁面切換邏輯 --- */
        function goHome() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'none'; 
        }

        function goToExam() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'block';
            document.getElementById('practice-screen').style.display = 'none';
            startGame(words);
        }

        function goToPractice() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'flex'; 
            renderPracticeList();
            resetPracticeState();
        }

        /* --- 練習模式邏輯 --- */
        let areAnswersVisible = false;

        function resetPracticeState() {
            areAnswersVisible = false;
            const btn = document.getElementById('toggle-all-btn');
            btn.innerHTML = '顯示所有答案 / 批改<br><span style="font-size:0.8em">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>';
            btn.style.backgroundColor = '#ff1744';
        }

        function renderPracticeList() {
            const listContainer = document.getElementById('practice-list');
            listContainer.innerHTML = '';

            words.forEach((word, index) => {
                const rowContainer = document.createElement('div');
                rowContainer.className = 'practice-row-container';
                rowContainer.innerHTML = `
                    <div class="practice-row">
                        <div class="col-zh">${word.zh}</div>
                        <div class="col-input">
                            <input type="text" class="practice-input" id="p-input-${index}" placeholder="拼寫..." autocomplete="off">
                        </div>
                        <div class="col-ans">
                            <div id="ans-${index}" class="answer-text">
                                ${word.en}
                                <button class="tts-btn" onclick="speakWord('${word.en}')" title="唸出單字">🔊</button>
                            </div>
                        </div>
                    </div>
                    <div id="p-mnemonic-${index}" class="practice-mnemonic">
                        💡 <b>記憶提示：</b>${word.mnemonic}
                    </div>
                `;
                listContainer.appendChild(rowContainer);
            });
        }

        document.getElementById('practice-list-container').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') toggleAllAnswers();
        });

        function toggleAllAnswers() {
            const btn = document.getElementById('toggle-all-btn');
            const answers = document.querySelectorAll('.answer-text');
            const inputs = document.querySelectorAll('.practice-input');

            areAnswersVisible = !areAnswersVisible;

            if (areAnswersVisible) {
                btn.innerHTML = '隱藏所有答案<br><span style="font-size:0.8em">ㄧㄣˇ ㄘㄤˊ ㄉㄚˊ ㄢˋ</span>';
                btn.style.backgroundColor = '#00e676';
                btn.style.color = '#121212';
                
                answers.forEach(el => el.style.display = 'block');

                inputs.forEach((input, index) => {
                    const userWord = input.value.trim().toLowerCase();
                    const correctWord = words[index].en.toLowerCase();
                    const mnemonicDiv = document.getElementById(`p-mnemonic-${index}`);
                    
                    if (userWord === correctWord) {
                        input.classList.add('correct');
                        input.classList.remove('wrong');
                        mnemonicDiv.style.display = 'none';
                    } else {
                        input.classList.add('wrong');
                        input.classList.remove('correct');
                        mnemonicDiv.style.display = 'block'; 
                    }
                });
            } else {
                btn.innerHTML = '顯示所有答案 / 批改<br><span style="font-size:0.8em">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>';
                btn.style.backgroundColor = '#ff1744';
                btn.style.color = '#fff';
                
                answers.forEach(el => el.style.display = 'none');
                words.forEach((_, index) => {
                    document.getElementById(`p-mnemonic-${index}`).style.display = 'none';
                });
            }
        }

        /* --- 考試模式邏輯 (含強制鎖定機制) --- */
        let currentQuestion = 0;
        let score = 0;
        let totalQuestions = words.length;
        let questions = [];
        let wrongWords = [];
        let isWaitingToContinue = false;

        function startGame(wordList) {
            let listToUse = wordList && Array.isArray(wordList) && wordList.length > 0 ? wordList : words;
            
            questions = [...listToUse];
            totalQuestions = questions.length;
            shuffle(questions);
            currentQuestion = 0;
            score = 0;
            wrongWords = [];
            isWaitingToContinue = false;
            
            document.getElementById('exam-restart').style.display = 'none';
            document.getElementById('exam-retest').style.display = 'none';
            document.getElementById('wrong-words-summary').style.display = 'none';
            document.getElementById('wrong-words-summary').innerHTML = '';
            
            const answerInput = document.getElementById('exam-answer');
            answerInput.style.display = 'inline-block';
            answerInput.disabled = false; // 解除鎖定
            
            const submitBtn = document.getElementById('exam-submit');
            submitBtn.style.display = 'inline-block';
            submitBtn.textContent = '提交';
            submitBtn.className = 'exam-btn';
            
            document.getElementById('mnemonic').style.display = 'none';
            
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }
            
            const q = questions[currentQuestion];
            if (!q) return; 

            const mnemonicEl = document.getElementById('mnemonic');
            mnemonicEl.textContent = '';
            mnemonicEl.style.display = 'none';

            isWaitingToContinue = false;
            
            const submitBtn = document.getElementById('exam-submit');
            submitBtn.textContent = '提交';
            submitBtn.className = 'exam-btn';
            
            const answerInput = document.getElementById('exam-answer');
            answerInput.disabled = false; // 進入下一題時確保解鎖
            answerInput.value = '';
            
            document.getElementById('question').innerHTML = `輸入 <b>"${q.zh}"</b> 的英文：`;
            document.getElementById('exam-result').textContent = '';
            updateScore();
            
            setTimeout(() => { answerInput.focus(); }, 100);
        }

        function checkExamAnswer() {
            if (isWaitingToContinue) {
                currentQuestion++;
                nextQuestion();
                return;
            }

            const answerInput = document.getElementById('exam-answer');
            const userAnswer = answerInput.value.trim().toLowerCase();
            const q = questions[currentQuestion];
            const correctAnswer = q.en.toLowerCase();
            const submitBtn = document.getElementById('exam-submit');

            if (userAnswer === correctAnswer) {
                score++;
                document.getElementById('exam-result').textContent = '✅ 完全正確！';
                document.getElementById('exam-result').style.color = '#00e676';
                
                // 答對後自動稍微延遲跳下一題，體驗比較順暢
                setTimeout(() => {
                    currentQuestion++;
                    nextQuestion();
                }, 800);
            } else {
                // 答錯邏輯：鎖定輸入框，強制按下一題
                answerInput.disabled = true; 
                isWaitingToContinue = true;
                
                document.getElementById('exam-result').textContent = `❌ 錯誤。正確答案是：${q.en}`;
                document.getElementById('exam-result').style.color = '#ff1744';
                
                const mnemonicEl = document.getElementById('mnemonic');
                mnemonicEl.innerHTML = `
                    <div style="font-size: 18px; margin-bottom: 10px;">💡 <b>記憶提示：</b><br>${q.mnemonic}</div>
                    <button class="tts-btn" onclick="speakWord('${q.en}')" style="margin:0;">🔊 唸出正確單字</button>
                `;
                mnemonicEl.style.display = 'block';
                
                submitBtn.textContent = '下一題 ⏭';
                submitBtn.className = 'exam-btn exam-btn-next';
                
                wrongWords.push({ zh: q.zh, en: q.en, user: userAnswer });
            }
            updateScore();
        }

        function updateScore() {
            document.getElementById('score').textContent = `分數: ${score} / ${totalQuestions} (目前進度: 第 ${currentQuestion + 1} 題)`;
        }

        function endGame() {
            document.getElementById('mnemonic').style.display = 'none';
            document.getElementById('question').textContent = '🎯 測驗結束！';
            
            const answerInput = document.getElementById('exam-answer');
            answerInput.style.display = 'none';
            
            const submitBtn = document.getElementById('exam-submit');
            submitBtn.style.display = 'none';
            
            document.getElementById('exam-result').textContent = `你的最終分數：${score} / ${totalQuestions}`;
            document.getElementById('exam-result').style.color = '#00e676';
            document.getElementById('score').textContent = '';
            
            const summaryDiv = document.getElementById('wrong-words-summary');
            if (score === totalQuestions) {
                summaryDiv.innerHTML = '<h3 style="color:#00e676; margin:0;">🎉 太棒了！你全部答對，完美過關！</h3>';
                summaryDiv.style.display = 'block';
            } else {
                let html = '<h3 style="color:#ff1744; margin-top:0;">📝 錯題總結報告：</h3>';
                wrongWords.forEach((w, idx) => {
                    html += `<div class="summary-item">
                        <b>${idx + 1}. ${w.zh}</b><br>
                        ✅ 正確答案：<span style="color:#00e676;">${w.en}</span><br>
                        ❌ 你的輸入：<span style="color:#ff5252; text-decoration: line-through;">${w.user || '(未輸入)'}</span>
                    </div>`;
                });
                summaryDiv.innerHTML = html;
                summaryDiv.style.display = 'block';
                document.getElementById('exam-retest').style.display = 'inline-block';
            }
            document.getElementById('exam-restart').style.display = 'inline-block';
        }

        document.getElementById('exam-submit').addEventListener('click', checkExamAnswer);
        document.getElementById('exam-answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkExamAnswer();
        });
        document.getElementById('exam-restart').addEventListener('click', () => startGame(words));
        document.getElementById('exam-retest').addEventListener('click', () => {
            if (wrongWords.length > 0) {
                // 從原始字庫中抓出剛剛錯的字重新組裝題庫
                const retestWords = words.filter(w => wrongWords.some(ww => ww.en === w.en));
                startGame(retestWords);
            }
        });

    </script>
</body>
</html>
