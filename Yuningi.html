<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寧寧的單字聽寫與多選特訓</title>
    <style>
        /* --- 全局酷炫暗色主題 --- */
        :root {
            --bg-main: #0b0f19;
            --bg-card: #161f30;
            --bg-input: #0f172a;
            --border-color: #293548;
            --neon-cyan: #22d3ee;
            --neon-pink: #f472b6;
            --neon-green: #10b981;
            --neon-amber: #fbbf24;
            --neon-red: #f43f5e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-main);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.10), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(244, 114, 182, 0.10), transparent 35%);
            color: var(--text-main);
            padding: 16px;
        }

        /* 注音樣式 */
        ruby {
            ruby-position: over;
            ruby-align: center;
        }
        rt {
            font-size: 0.55em;
            color: var(--neon-cyan);
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        /* 通用主容器 */
        .container {
            text-align: center;
            background: var(--bg-card);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--border-color);
            width: 100%;
            max-width: 760px;
            max-height: 92vh;
            overflow-y: auto;
            position: relative;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: var(--neon-cyan);
            text-shadow: 0 0 14px rgba(34, 211, 238, 0.35);
            line-height: 1.8;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            color: var(--neon-amber);
            line-height: 1.8;
        }

        button {
            padding: 12px 22px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
            font-family: inherit;
        }
        button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
        button:active:not(:disabled) { transform: scale(0.97); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        button rt { color: rgba(255, 255, 255, 0.9); }

        /* --- 首頁選單 --- */
        #menu-screen { display: block; padding: 36px 28px; }
        .badge {
            display: inline-block;
            background: rgba(244, 114, 182, 0.15);
            color: var(--neon-pink);
            border: 1px solid rgba(244, 114, 182, 0.4);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 14px;
            margin-bottom: 22px;
            line-height: 1.8;
        }
        .menu-btn {
            display: block;
            width: 82%;
            max-width: 360px;
            margin: 18px auto;
            padding: 16px 24px;
            font-size: 20px;
            color: #0b0f19;
            line-height: 1.8;
        }
        .menu-btn.exam {
            background: linear-gradient(135deg, #22d3ee, #38bdf8);
            box-shadow: 0 6px 20px rgba(34, 211, 238, 0.35);
        }
        .menu-btn.exam rt, .menu-btn.practice rt { color: #0f172a; }
        .menu-btn.practice {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.35);
        }

        /* --- 考試模式 --- */
        #exam-screen { display: none; }
        .progress-bar-wrap {
            width: 100%;
            height: 8px;
            background: var(--bg-input);
            border-radius: 999px;
            overflow: hidden;
            margin: 10px 0 18px 0;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            transition: width 0.3s ease;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 8px;
        }
        .tts-hero-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #fff;
            font-size: 17px;
            padding: 10px 24px;
            border-radius: 999px;
            margin: 10px 0 16px 0;
            box-shadow: 0 4px 16px rgba(236, 72, 153, 0.35);
            line-height: 1.7;
        }
        .exam-input {
            padding: 14px 18px;
            font-size: 20px;
            width: 85%;
            max-width: 460px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-input);
            color: #fff;
            text-align: center;
            letter-spacing: 1px;
        }
        .exam-input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.35);
        }
        .exam-input:disabled {
            background-color: #111827;
            border-color: var(--neon-red);
            color: #64748b;
            cursor: not-allowed;
        }

        /* 多選題區塊 */
        #exam-options {
            text-align: left;
            margin: 18px auto;
            width: 85%;
            max-width: 460px;
            background: var(--bg-input);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }
        .options-title {
            color: var(--neon-amber);
            font-size: 15px;
            margin-bottom: 10px;
            line-height: 1.8;
        }
        .exam-checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-main);
            padding: 10px 14px;
            background-color: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s, background-color 0.2s;
            line-height: 1.9;
        }
        .exam-checkbox-label:hover {
            border-color: var(--neon-cyan);
            background-color: #1e293b;
        }
        .exam-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--neon-cyan);
            cursor: pointer;
            flex-shrink: 0;
        }

        .exam-submit-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            min-width: 160px;
            margin: 8px;
            line-height: 1.7;
        }
        .exam-next-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0b0f19;
            min-width: 180px;
            margin: 12px 8px 4px 8px;
            line-height: 1.7;
            display: none;
        }
        .exam-next-btn rt { color: #0f172a; }

        #exam-result {
            font-size: 18px;
            margin-top: 14px;
            font-weight: bold;
            line-height: 1.9;
        }

        #mnemonic-box {
            display: none;
            font-size: 16px;
            margin: 14px auto 0 auto;
            width: 90%;
            color: var(--text-main);
            text-align: left;
            padding: 16px 18px;
            border: 1px solid rgba(244, 63, 94, 0.5);
            border-left: 5px solid var(--neon-red);
            border-radius: 12px;
            background-color: rgba(244, 63, 94, 0.1);
            line-height: 2.0;
        }

        /* 考後總結 */
        #summary-section {
            display: none;
            text-align: left;
            margin-top: 16px;
        }
        .summary-score-card {
            text-align: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            line-height: 1.9;
        }
        .wrong-card {
            background: var(--bg-input);
            border: 1px solid rgba(244, 63, 94, 0.35);
            border-left: 4px solid var(--neon-pink);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            line-height: 2.0;
        }
        .wrong-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }
        .en-highlight {
            font-size: 22px;
            font-weight: bold;
            color: var(--neon-green);
        }

        /* --- 練習模式 --- */
        #practice-screen {
            display: none;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
            height: 90vh;
        }
        .practice-fixed-top {
            background: #111827;
            padding: 18px 22px;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
        }
        .toolbar-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .btn-global-reveal {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            color: #fff;
            padding: 10px 18px;
            font-size: 15px;
            line-height: 1.7;
        }
        .btn-reset {
            background: #334155;
            color: #f8fafc;
            padding: 10px 18px;
            font-size: 15px;
            line-height: 1.7;
        }
        .btn-home {
            background: #475569;
            color: #fff;
            padding: 10px 18px;
            font-size: 15px;
            line-height: 1.7;
        }

        #practice-list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 22px 24px 22px;
        }
        .practice-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            text-align: left;
            transition: border-color 0.2s;
        }
        .practice-card-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .zh-display {
            font-size: 18px;
            color: var(--neon-amber);
            font-weight: bold;
            flex: 1 1 200px;
            line-height: 2.0;
        }
        .practice-input-wrap {
            flex: 1 1 180px;
        }
        .practice-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 16px;
            background: var(--bg-card);
            color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 10px;
        }
        .practice-input:focus {
            outline: none;
            border-color: var(--neon-cyan);
        }
        .practice-input.correct {
            border-color: var(--neon-green);
            background-color: rgba(16, 185, 129, 0.15);
        }
        .practice-input.wrong {
            border-color: var(--neon-red);
            background-color: rgba(244, 63, 94, 0.15);
        }
        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .btn-speak {
            background: #0284c7;
            color: #fff;
            font-size: 14px;
            padding: 7px 14px;
            border-radius: 999px;
            line-height: 1.6;
        }
        .btn-reveal-one {
            background: #6366f1;
            color: #fff;
            font-size: 14px;
            padding: 7px 14px;
            border-radius: 999px;
            line-height: 1.6;
        }
        .practice-reveal-area {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            background: rgba(34, 211, 238, 0.08);
            border-left: 4px solid var(--neon-cyan);
            border-radius: 8px;
            line-height: 2.0;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- 1. 首頁選單 -->
    <div id="menu-screen" class="container">
        <h1>✨ <ruby>寧<rt>ㄋㄧㄥˊ</rt>寧<rt>ㄋㄧㄥˊ</rt>的<rt>ㄉㄜ˙</rt>單<rt>ㄉㄢ</rt>字<rt>ㄗˋ</rt>大<rt>ㄉㄚˋ</rt>挑<rt>ㄊㄧㄠˇ</rt>戰<rt>ㄓㄢˋ</rt></ruby> ✨</h1>
        <div class="badge">🎧 <ruby>聽<rt>ㄊㄧㄥ</rt>寫<rt>ㄒㄧㄝˇ</rt>拼<rt>ㄆㄧㄣ</rt>字<rt>ㄗˋ</rt></ruby> ＋ ✅ <ruby>中<rt>ㄓㄨㄥ</rt>文<rt>ㄨㄣˊ</rt>多<rt>ㄉㄨㄛ</rt>選<rt>ㄒㄩㄢˇ</rt></ruby>（<ruby>共<rt>ㄍㄨㄥˋ</rt></ruby> 19 <ruby>題<rt>ㄊㄧˊ</rt></ruby>）</div>

        <button class="menu-btn exam" onclick="goToExam()">
            🚀 <ruby>開<rt>ㄎㄞ</rt>始<rt>ㄕˇ</rt>考<rt>ㄎㄠˇ</rt>試<rt>ㄕˋ</rt></ruby>
        </button>

        <button class="menu-btn practice" onclick="goToPractice()">
            📖 <ruby>我<rt>ㄨㄛˇ</rt>要<rt>ㄧㄠˋ</rt>練<rt>ㄌㄧㄢˋ</rt>習<rt>ㄒㄧˊ</rt></ruby>
        </button>
    </div>

    <!-- 2. 考試模式 -->
    <div id="exam-screen" class="container">
        <h2>🎧 <ruby>聽<rt>ㄊㄧㄥ</rt>音<rt>ㄧㄣ</rt>拼<rt>ㄆㄧㄣ</rt>字<rt>ㄗˋ</rt>與<rt>ㄩˇ</rt>多<rt>ㄉㄨㄛ</rt>選<rt>ㄒㄩㄢˇ</rt>測<rt>ㄘㄜˋ</rt>驗<rt>ㄧㄢˋ</rt></ruby></h2>

        <div id="exam-active-area">
            <div class="status-row">
                <span id="question-progress"></span>
                <span id="score-display"></span>
            </div>
            <div class="progress-bar-wrap">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <button class="tts-hero-btn" onclick="speakCurrentExamWord()">
                🔊 <ruby>聽<rt>ㄊㄧㄥ</rt>發<rt>ㄈㄚ</rt>音<rt>ㄧㄣ</rt>提<rt>ㄊㄧˊ</rt>示<rt>ㄕˋ</rt></ruby>
            </button>

            <div>
                <input type="text" id="exam-answer" class="exam-input" placeholder="1. 輸入英文拼寫（大小寫皆可）" autocomplete="off">
            </div>

            <div id="exam-options"></div>

            <div>
                <button id="exam-submit" class="exam-submit-btn">
                    ✅ <ruby>提<rt>ㄊㄧˊ</rt>交<rt>ㄐㄧㄠ</rt>答<rt>ㄉㄚˊ</rt>案<rt>ㄢˋ</rt></ruby>
                </button>
                <button id="exam-next" class="exam-next-btn">
                    ⏭ <ruby>下<rt>ㄒㄧㄚˋ</rt>一<rt>ㄧˋ</rt>題<rt>ㄊㄧˊ</rt></ruby>
                </button>
            </div>

            <div id="exam-result"></div>
            <div id="mnemonic-box"></div>
        </div>

        <!-- 考後總結報告 -->
        <div id="summary-section">
            <div id="summary-score-card" class="summary-score-card"></div>
            <div id="wrong-list-container"></div>
            <div style="text-align: center; margin-top: 18px;">
                <button id="exam-retest" class="btn-global-reveal" style="display: none;">
                    🔁 <ruby>針<rt>ㄓㄣ</rt>對<rt>ㄉㄨㄟˋ</rt>錯<rt>ㄘㄨㄛˋ</rt>題<rt>ㄊㄧˊ</rt>重<rt>ㄔㄨㄥˊ</rt>新<rt>ㄒㄧㄣ</rt>測<rt>ㄘㄜˋ</rt>驗<rt>ㄧㄢˋ</rt></ruby>
                </button>
                <button id="exam-restart" class="exam-submit-btn">
                    🔄 <ruby>重<rt>ㄔㄨㄥˊ</rt>新<rt>ㄒㄧㄣ</rt>開<rt>ㄎㄞ</rt>始<rt>ㄕˇ</rt>完<rt>ㄨㄢˊ</rt>整<rt>ㄓㄥˇ</rt>測<rt>ㄘㄜˋ</rt>驗<rt>ㄧㄢˋ</rt></ruby>
                </button>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn-home" onclick="goHome()">🏠 <ruby>回<rt>ㄏㄨㄟˊ</rt>首<rt>ㄕㄡˇ</rt>頁<rt>ㄧㄝˋ</rt></ruby></button>
        </div>
    </div>

    <!-- 3. 練習模式 -->
    <div id="practice-screen" class="container">
        <div class="practice-fixed-top">
            <h2 style="margin: 0;">📖 <ruby>單<rt>ㄉㄢ</rt>字<rt>ㄗˋ</rt>練<rt>ㄌㄧㄢˋ</rt>習<rt>ㄒㄧˊ</rt>室<rt>ㄕˋ</rt></ruby></h2>
            <div class="toolbar-btns">
                <button class="btn-global-reveal" onclick="revealAllPractice()">
                    🚀 <ruby>一<rt>ㄧ</rt>鍵<rt>ㄐㄧㄢˋ</rt>公<rt>ㄍㄨㄥ</rt>布<rt>ㄅㄨˋ</rt>全<rt>ㄑㄩㄢˊ</rt>部<rt>ㄅㄨˋ</rt></ruby>
                </button>
                <button class="btn-reset" onclick="resetAllPractice()">
                    🧹 <ruby>清<rt>ㄑㄧㄥ</rt>空<rt>ㄎㄨㄥ</rt>重<rt>ㄔㄨㄥˊ</rt>練<rt>ㄌㄧㄢˋ</rt></ruby>
                </button>
                <button class="btn-home" onclick="goHome()">
                    🏠 <ruby>回<rt>ㄏㄨㄟˊ</rt>首<rt>ㄕㄡˇ</rt>頁<rt>ㄧㄝˋ</rt></ruby>
                </button>
            </div>
        </div>
        <div id="practice-list-container">
            <div id="practice-list"></div>
        </div>
    </div>

    <script>
        // 19 個單字題庫（含多義陣列與 Ruby 注音、記憶法）
        const words = [
            {
                en: 'grown',
                meanings: [
                    { text: '成年的', ruby: '<ruby>成<rt>ㄔㄥˊ</rt>年<rt>ㄋㄧㄢˊ</rt>的<rt>ㄉㄜ˙</rt></ruby>' },
                    { text: '長大的', ruby: '<ruby>長<rt>ㄓㄤˇ</rt>大<rt>ㄉㄚˋ</rt>的<rt>ㄉㄜ˙</rt></ruby>' }
                ],
                mnemonic: 'grow（<ruby>成<rt>ㄔㄥˊ</rt>長<rt>ㄓㄤˇ</rt></ruby>）<ruby>的<rt>ㄉㄜ˙</rt>過<rt>ㄍㄨㄛˋ</rt>去<rt>ㄑㄩˋ</rt>分<rt>ㄈㄣ</rt>詞<rt>ㄘˊ</rt></ruby>。<ruby>已<rt>ㄧˇ</rt>經<rt>ㄐㄧㄥ</rt>成<rt>ㄔㄥˊ</rt>長<rt>ㄓㄤˇ</rt>完<rt>ㄨㄢˊ</rt>成<rt>ㄔㄥˊ</rt>了<rt>ㄌㄜ˙</rt></ruby>，<ruby>就<rt>ㄐㄧㄡˋ</rt>是<rt>ㄕˋ</rt></ruby>「<ruby>長<rt>ㄓㄤˇ</rt>大<rt>ㄉㄚˋ</rt>的<rt>ㄉㄜ˙</rt></ruby>、<ruby>成<rt>ㄔㄥˊ</rt>年<rt>ㄋㄧㄢˊ</rt>的<rt>ㄉㄜ˙</rt></ruby>」。'
            },
            {
                en: 'issue',
                meanings: [
                    { text: '議題', ruby: '<ruby>議<rt>ㄧˋ</rt>題<rt>ㄊㄧˊ</rt></ruby>' },
                    { text: '問題', ruby: '<ruby>問<rt>ㄨㄣˋ</rt>題<rt>ㄊㄧˊ</rt></ruby>' },
                    { text: '發行', ruby: '<ruby>發<rt>ㄈㄚ</rt>行<rt>ㄒㄧㄥˊ</rt></ruby>' }
                ],
                mnemonic: '<ruby>拆<rt>ㄔㄞ</rt>成<rt>ㄔㄥˊ</rt></ruby> is + sue（<ruby>控<rt>ㄎㄨㄥˋ</rt>告<rt>ㄍㄠˋ</rt></ruby>）。<ruby>如<rt>ㄖㄨˊ</rt>果<rt>ㄍㄨㄛˇ</rt>是<rt>ㄕˋ</rt>嚴<rt>ㄧㄢˊ</rt>重<rt>ㄓㄨㄥˋ</rt>的<rt>ㄉㄜ˙</rt></ruby>「<ruby>議<rt>ㄧˋ</rt>題<rt>ㄊㄧˊ</rt></ruby>」<ruby>或<rt>ㄏㄨㄛˋ</rt></ruby>「<ruby>問<rt>ㄨㄣˋ</rt>題<rt>ㄊㄧˊ</rt></ruby>」，<ruby>大<rt>ㄉㄚˋ</rt>家<rt>ㄐㄧㄚ</rt>就<rt>ㄐㄧㄡˋ</rt>會<rt>ㄏㄨㄟˋ</rt>互<rt>ㄏㄨˋ</rt>相<rt>ㄒㄧㄤ</rt>控<rt>ㄎㄨㄥˋ</rt>告<rt>ㄍㄠˋ</rt></ruby>；<ruby>報<rt>ㄅㄠˋ</rt>紙<rt>ㄓˇ</rt>也<rt>ㄧㄝˇ</rt>會<rt>ㄏㄨㄟˋ</rt></ruby>「<ruby>發<rt>ㄈㄚ</rt>行<rt>ㄒㄧㄥˊ</rt></ruby>」<ruby>報<rt>ㄅㄠˋ</rt>導<rt>ㄉㄠˇ</rt></ruby>。'
            },
            {

                mnemonic: 'fright（<ruby>驚<rt>ㄐㄧㄥ</rt>嚇<rt>ㄒㄧㄚˋ</rt></ruby>）+ ful（<ruby>充<rt>ㄔㄨㄥ</rt>滿<rt>ㄇㄢˇ</rt></ruby>）。<ruby>充<rt>ㄔㄨㄥ</rt>滿<rt>ㄇㄢˇ</rt>驚<rt>ㄐㄧㄥ</rt>嚇<rt>ㄒㄧㄚˋ</rt>的<rt>ㄉㄜ˙</rt>感<rt>ㄍㄢˇ</rt>覺<rt>ㄐㄩㄝˊ</rt></ruby>，<ruby>就<rt>ㄐㄧㄡˋ</rt>是<rt>ㄕˋ</rt></ruby>「<ruby>可<rt>ㄎㄜˇ</rt>怕<rt>ㄆㄚˋ</rt>的<rt>ㄉㄜ˙</rt></ruby>、<ruby>駭<rt>ㄏㄞˋ</rt>人<rt>ㄖㄣˊ</rt>的<rt>ㄉㄜ˙</rt></ruby>」。'
            },
            {
                en: 'certainly',
                meanings: [
                    { text: '當然', ruby: '<ruby>當<rt>ㄉㄤ</rt>然<rt>ㄖㄢˊ</rt></ruby>' },
                    { text: '無疑地', ruby: '<ruby>無<rt>ㄨˊ</rt>疑<rt>ㄧˊ</rt>地<rt>ㄉㄜ˙</rt></ruby>' }
                ],
                mnemonic: 'certain（<ruby>確<rt>ㄑㄩㄝˋ</rt>定<rt>ㄉㄧㄥˋ</rt>的<rt>ㄉㄜ˙</rt></ruby>）+ ly（<ruby>地<rt>ㄉㄜ˙</rt></ruby>）。<ruby>非<rt>ㄈㄟ</rt>常<rt>ㄔㄤˊ</rt>確<rt>ㄑㄩㄝˋ</rt>定<rt>ㄉㄧㄥˋ</rt>無<rt>ㄨˊ</rt>疑<rt>ㄧˊ</rt></ruby>，<ruby>也<rt>ㄧㄝˇ</rt>就<rt>ㄐㄧㄡˋ</rt>是<rt>ㄕˋ</rt></ruby>「<ruby>當<rt>ㄉㄤ</rt>然<rt>ㄖㄢˊ</rt></ruby>」。'
            }
        ];

        /* --- 語音朗讀 API --- */
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.92;
                window.speechSynthesis.speak(utterance);
            } else {
                alert('很抱歉，您的瀏覽器目前不支援語音朗讀功能。');
            }
        }

        /* --- 標準 Fisher-Yates 洗牌演算法 --- */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }

        /* --- 頁面切換 --- */
        function goHome() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'none';
        }

        function goToExam() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'block';
            document.getElementById('practice-screen').style.display = 'none';
            startGame(words);
        }

        function goToPractice() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'flex';
            renderPracticeList();
        }

        /* ================= 練習模式 ================= */
        function renderPracticeList() {
            const listEl = document.getElementById('practice-list');
            listEl.innerHTML = '';

            for (let i = 0; i < words.length; i++) {
                const w = words[i];
                const zhHtml = w.meanings.map(m => m.ruby).join(' ／ ');

                const card = document.createElement('div');
                card.className = 'practice-card';
                card.innerHTML = `
                    <div class="practice-card-top">
                        <div class="zh-display">${i + 1}. ${zhHtml}</div>
                        <div class="practice-input-wrap">
                            <input type="text" id="p-input-${i}" class="practice-input" placeholder="輸入英文拼寫..." autocomplete="off">
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-speak" onclick="speakWord('${w.en}')">
                            🔊 <ruby>發<rt>ㄈㄚ</rt>音<rt>ㄧㄣ</rt></ruby>
                        </button>
                        <button class="btn-reveal-one" onclick="revealSinglePractice(${i})">
                            💡 <ruby>公<rt>ㄍㄨㄥ</rt>布<rt>ㄅㄨˋ</rt>答<rt>ㄉㄚˊ</rt>案<rt>ㄢˋ</rt>與<rt>ㄩˇ</rt>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>
                        </button>
                    </div>
                    <div id="p-reveal-${i}" class="practice-reveal-area">
                        <div>✅ <ruby>正<rt>ㄓㄥˋ</rt>確<rt>ㄑㄩㄝˋ</rt>拼<rt>ㄆㄧㄣ</rt>寫<rt>ㄒㄧㄝˇ</rt></ruby>：<span class="en-highlight">${w.en}</span></div>
                        <div style="margin-top: 6px;">💡 <ruby>記<rt>ㄐㄧˋ</rt>憶<rt>ㄧˋ</rt>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>：${w.mnemonic}</div>
                    </div>
                `;
                listEl.appendChild(card);
            }
        }

        function gradePracticeInput(index) {
            const inputEl = document.getElementById('p-input-' + index);
            const userVal = inputEl.value.trim().toLowerCase();
            const correctVal = words[index].en.toLowerCase();

            inputEl.classList.remove('correct', 'wrong');
            if (userVal === correctVal) {
                inputEl.classList.add('correct');
            } else {
                inputEl.classList.add('wrong');
            }
        }

        function revealSinglePractice(index) {
            const revealEl = document.getElementById('p-reveal-' + index);
            const isShown = revealEl.style.display === 'block';
            if (isShown) {
                revealEl.style.display = 'none';
                document.getElementById('p-input-' + index).classList.remove('correct', 'wrong');
            } else {
                revealEl.style.display = 'block';
                gradePracticeInput(index);
            }
        }

        function revealAllPractice() {
            for (let i = 0; i < words.length; i++) {
                document.getElementById('p-reveal-' + i).style.display = 'block';
                gradePracticeInput(i);
            }
        }

        function resetAllPractice() {
            for (let i = 0; i < words.length; i++) {
                const inputEl = document.getElementById('p-input-' + i);
                inputEl.value = '';
                inputEl.classList.remove('correct', 'wrong');
                document.getElementById('p-reveal-' + i).style.display = 'none';
            }
        }

        /* ================= 考試模式 ================= */
        let questions = [];
        let currentQuestion = 0;
        let score = 0;
        let wrongWords = [];
        let isLocked = false;

        function speakCurrentExamWord() {
            if (questions[currentQuestion]) {
                speakWord(questions[currentQuestion].en);
            }
        }

        function generateOptions(wordObj) {
            const options = wordObj.meanings.slice();
            const distractorPool = [];

            for (let i = 0; i < words.length; i++) {
                if (words[i].en !== wordObj.en) {
                    for (let j = 0; j < words[i].meanings.length; j++) {
                        distractorPool.push(words[i].meanings[j]);
                    }
                }
            }
            shuffle(distractorPool);

            const targetCount = Math.max(4, options.length + 2);
            for (let i = 0; i < distractorPool.length && options.length < targetCount; i++) {
                const candidate = distractorPool[i];
                let exists = false;
                for (let k = 0; k < options.length; k++) {
                    if (options[k].text === candidate.text) {
                        exists = true;
                        break;
                    }
                }
                if (!exists) {
                    options.push(candidate);
                }
            }
            shuffle(options);
            return options;
        }

        function startGame(wordList) {
            questions = wordList.slice();
            shuffle(questions);
            currentQuestion = 0;
            score = 0;
            wrongWords = [];
            isLocked = false;

            document.getElementById('exam-active-area').style.display = 'block';
            document.getElementById('summary-section').style.display = 'none';
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= questions.length) {
                endGame();
                return;
            }

            isLocked = false;
            const q = questions[currentQuestion];

            const progressPct = (currentQuestion / questions.length) * 100;
            document.getElementById('progress-bar').style.width = progressPct + '%';
            document.getElementById('question-progress').innerHTML =
                `<ruby>第<rt>ㄉㄧˋ</rt></ruby> ${currentQuestion + 1} / ${questions.length} <ruby>題<rt>ㄊㄧˊ</rt></ruby>`;
            document.getElementById('score-display').innerHTML =
                `<ruby>得<rt>ㄉㄜˊ</rt>分<rt>ㄈㄣ</rt></ruby>：${score}`;

            const inputEl = document.getElementById('exam-answer');
            inputEl.disabled = false;
            inputEl.value = '';

            document.getElementById('exam-submit').style.display = 'inline-block';
            document.getElementById('exam-submit').disabled = false;
            document.getElementById('exam-next').style.display = 'none';
            document.getElementById('exam-result').innerHTML = '';
            document.getElementById('mnemonic-box').style.display = 'none';

            // 產生多選題選項
            const optionsDiv = document.getElementById('exam-options');
            optionsDiv.innerHTML = `
                <div class="options-title">
                    2. <ruby>請<rt>ㄑㄧㄥˇ</rt>勾<rt>ㄍㄡ</rt>選<rt>ㄒㄩㄢˇ</rt>所<rt>ㄙㄨㄛˇ</rt>有<rt>ㄧㄡˇ</rt>正<rt>ㄓㄥˋ</rt>確<rt>ㄑㄩㄝˋ</rt>的<rt>ㄉㄜ˙</rt>中<rt>ㄓㄨㄥ</rt>文<rt>ㄨㄣˊ</rt>意<rt>ㄧˋ</rt>思<rt>ㄙ˙</rt></ruby>（<ruby>可<rt>ㄎㄜˇ</rt>能<rt>ㄋㄥˊ</rt>不<rt>ㄅㄨˋ</rt>止<rt>ㄓˇ</rt>一<rt>ㄧˊ</rt>個<rt>ㄍㄜ˙</rt></ruby>）：
                </div>
            `;
            const opts = generateOptions(q);
            for (let i = 0; i < opts.length; i++) {
                const label = document.createElement('label');
                label.className = 'exam-checkbox-label';
                label.innerHTML = `<input type="checkbox" class="exam-checkbox" value="${opts[i].text}"> <span>${opts[i].ruby}</span>`;
                optionsDiv.appendChild(label);
            }

            setTimeout(function() {
                speakCurrentExamWord();
                inputEl.focus();
            }, 150);
        }

        function checkExamAnswer() {
            if (isLocked) return;

            const q = questions[currentQuestion];
            const inputEl = document.getElementById('exam-answer');
            const submitBtn = document.getElementById('exam-submit');
            const nextBtn = document.getElementById('exam-next');
            const checkboxes = document.querySelectorAll('.exam-checkbox');

            const userSpelling = inputEl.value.trim().toLowerCase();
            const correctSpelling = q.en.toLowerCase();

            const selectedTexts = [];
            for (let i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].checked) {
                    selectedTexts.push(checkboxes[i].value);
                }
            }

            const correctTexts = q.meanings.map(m => m.text);
            const isSpellingCorrect = userSpelling === correctSpelling;
            const isMeaningCorrect =
                selectedTexts.length === correctTexts.length &&
                correctTexts.every(t => selectedTexts.indexOf(t) !== -1);

            if (isSpellingCorrect && isMeaningCorrect) {
                isLocked = true;
                score++;
                inputEl.disabled = true;
                submitBtn.disabled = true;
                for (let i = 0; i < checkboxes.length; i++) {
                    checkboxes[i].disabled = true;
                }

                document.getElementById('score-display').innerHTML =
                    `<ruby>得<rt>ㄉㄜˊ</rt>分<rt>ㄈㄣ</rt></ruby>：${score}`;
                document.getElementById('exam-result').style.color = 'var(--neon-green)';
                document.getElementById('exam-result').innerHTML =
                    '🎉 <ruby>拼<rt>ㄆㄧㄣ</rt>寫<rt>ㄒㄧㄝˇ</rt>與<rt>ㄩˇ</rt>中<rt>ㄓㄨㄥ</rt>文<rt>ㄨㄣˊ</rt>完<rt>ㄨㄢˊ</rt>全<rt>ㄑㄩㄢˊ</rt>正<rt>ㄓㄥˋ</rt>確<rt>ㄑㄩㄝˋ</rt></ruby>！';

                setTimeout(function() {
                    currentQuestion++;
                    nextQuestion();
                }, 950);
            } else {
                // 答錯：立即暫停並鎖定輸入框與選項，隱藏送出鍵，只允許點「下一題」
                isLocked = true;
                inputEl.disabled = true;
                for (let i = 0; i < checkboxes.length; i++) {
                    checkboxes[i].disabled = true;
                }
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'inline-block';

                const correctRubyStr = q.meanings.map(m => m.ruby).join(' ／ ');
                let errHtml = '❌ <ruby>答<rt>ㄉㄚˊ</rt>錯<rt>ㄘㄨㄛˋ</rt>囉<rt>ㄌㄨㄛ˙</rt></ruby>！<br>';
                if (!isSpellingCorrect) {
                    errHtml += `<ruby>正<rt>ㄓㄥˋ</rt>確<rt>ㄑㄩㄝˋ</rt>拼<rt>ㄆㄧㄣ</rt>寫<rt>ㄒㄧㄝˇ</rt></ruby>：<span style="color: var(--neon-green); font-size: 22px;">${q.en}</span><br>`;
                }
                if (!isMeaningCorrect) {
                    errHtml += `<ruby>正<rt>ㄓㄥˋ</rt>確<rt>ㄑㄩㄝˋ</rt>意<rt>ㄧˋ</rt>思<rt>ㄙ˙</rt></ruby>：<span style="color: var(--neon-amber);">${correctRubyStr}</span>`;
                }

                const resultEl = document.getElementById('exam-result');
                resultEl.style.color = 'var(--neon-red)';
                resultEl.innerHTML = errHtml;

                const mnemonicEl = document.getElementById('mnemonic-box');
                mnemonicEl.innerHTML = `
                    <div>💡 <b><ruby>記<rt>ㄐㄧˋ</rt>憶<rt>ㄧˋ</rt>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>：</b>${q.mnemonic}</div>
                    <div style="margin-top: 10px;">
                        <button class="btn-speak" onclick="speakWord('${q.en}')">
                            🔊 <ruby>唸<rt>ㄋㄧㄢˋ</rt>出<rt>ㄔㄨ</rt>正<rt>ㄓㄥˋ</rt>確<rt>ㄑㄩㄝˋ</rt>單<rt>ㄉㄢ</rt>字<rt>ㄗˋ</rt></ruby>
                        </button>
                    </div>
                `;
                mnemonicEl.style.display = 'block';

                wrongWords.push({
                    wordObj: q,
                    userSpelling: inputEl.value.trim(),
                    selectedTexts: selectedTexts
                });
            }
        }

        function endGame() {
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('exam-active-area').style.display = 'none';
            document.getElementById('summary-section').style.display = 'block';

            const total = questions.length;
            const rate = Math.round((score / total) * 100);

            document.getElementById('summary-score-card').innerHTML = `
                <h2 style="margin:0 0 8px 0; color: var(--neon-cyan);">🎯 <ruby>測<rt>ㄘㄜˋ</rt>驗<rt>ㄧㄢˋ</rt>完<rt>ㄨㄢˊ</rt>成<rt>ㄔㄥˊ</rt></ruby>！</h2>
                <div style="font-size: 22px; font-weight: bold; color: var(--neon-green);">
                    <ruby>總<rt>ㄗㄨㄥˇ</rt>得<rt>ㄉㄜˊ</rt>分<rt>ㄈㄣ</rt></ruby>：${score} / ${total}（<ruby>答<rt>ㄉㄚˊ</rt>對<rt>ㄉㄨㄟˋ</rt>率<rt>ㄌㄩˋ</rt></ruby> ${rate}%）
                </div>
            `;

            const wrongContainer = document.getElementById('wrong-list-container');
            const retestBtn = document.getElementById('exam-retest');

            if (wrongWords.length === 0) {
                wrongContainer.innerHTML = `
                    <div style="text-align:center; padding: 18px; color: var(--neon-green); font-size: 20px; font-weight: bold; line-height: 2;">
                        🏆 <ruby>太<rt>ㄊㄞˋ</rt>厲<rt>ㄌㄧˋ</rt>害<rt>ㄏㄞˋ</rt>了<rt>ㄌㄜ˙</rt></ruby>！<ruby>全<rt>ㄑㄩㄢˊ</rt>部<rt>ㄅㄨˋ</rt>答<rt>ㄉㄚˊ</rt>對<rt>ㄉㄨㄟˋ</rt></ruby>，<ruby>完<rt>ㄨㄢˊ</rt>美<rt>ㄇㄟˇ</rt>過<rt>ㄍㄨㄛˋ</rt>關<rt>ㄍㄨㄢ</rt></ruby>！
                    </div>
                `;
                retestBtn.style.display = 'none';
            } else {
                let html = `<h3 style="color: var(--neon-pink); margin: 0 0 12px 0; line-height: 1.9;">📝 <ruby>錯<rt>ㄘㄨㄛˋ</rt>題<rt>ㄊㄧˊ</rt>總<rt>ㄗㄨㄥˇ</rt>結<rt>ㄐㄧㄝˊ</rt>與<rt>ㄩˇ</rt>複<rt>ㄈㄨˋ</rt>習<rt>ㄒㄧˊ</rt>清<rt>ㄑㄧㄥ</rt>單<rt>ㄉㄢ</rt></ruby>（<ruby>共<rt>ㄍㄨㄥˋ</rt></ruby> ${wrongWords.length} <ruby>題<rt>ㄊㄧˊ</rt></ruby>）</h3>`;
                for (let i = 0; i < wrongWords.length; i++) {
                    const item = wrongWords[i];
                    const w = item.wordObj;
                    const zhRuby = w.meanings.map(m => m.ruby).join(' ／ ');
                    html += `
                        <div class="wrong-card">
                            <div class="wrong-card-header">
                                <span class="en-highlight">${i + 1}. ${w.en}</span>
                                <button class="btn-speak" onclick="speakWord('${w.en}')">🔊 <ruby>發<rt>ㄈㄚ</rt>音<rt>ㄧㄣ</rt></ruby></button>
                            </div>
                            <div>✅ <ruby>中<rt>ㄓㄨㄥ</rt>文<rt>ㄨㄣˊ</rt>釋<rt>ㄕˋ</rt>義<rt>ㄧˋ</rt></ruby>：<span style="color: var(--neon-amber);">${zhRuby}</span></div>
                            <div>❌ <ruby>妳<rt>ㄋㄧˇ</rt>的<rt>ㄉㄜ˙</rt>拼<rt>ㄆㄧㄣ</rt>寫<rt>ㄒㄧㄝˇ</rt></ruby>：<span style="color: var(--neon-red);">${item.userSpelling || '（未輸入）'}</span></div>
                            <div>❌ <ruby>妳<rt>ㄋㄧˇ</rt>的<rt>ㄉㄜ˙</rt>勾<rt>ㄍㄡ</rt>選<rt>ㄒㄩㄢˇ</rt></ruby>：<span style="color: var(--neon-red);">${item.selectedTexts.length ? item.selectedTexts.join(' ／ ') : '（未勾選）'}</span></div>
                            <div style="margin-top: 6px; color: #cbd5e1;">💡 <ruby>記<rt>ㄐㄧˋ</rt>憶<rt>ㄧˋ</rt>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>：${w.mnemonic}</div>
                        </div>
                    `;
                }
                wrongContainer.innerHTML = html;
                retestBtn.style.display = 'inline-block';
            }
        }

        // 綁定事件
        document.getElementById('exam-submit').addEventListener('click', checkExamAnswer);
        document.getElementById('exam-next').addEventListener('click', function() {
            currentQuestion++;
            nextQuestion();
        });
        document.getElementById('exam-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isLocked) {
                checkExamAnswer();
            }
        });
        document.getElementById('exam-restart').addEventListener('click', function() {
            startGame(words);
        });
        document.getElementById('exam-retest').addEventListener('click', function() {
            if (wrongWords.length > 0) {
                const retestList = wrongWords.map(item => item.wordObj);
                startGame(retestList);
            }
        });
    </script>
</body>
</html>
