    function renderQuiz() {
      const container = document.getElementById("questionsContainer");
      const navGrid = document.getElementById("navGrid");
      container.innerHTML = "";
      navGrid.innerHTML = "";

      questionsData.forEach((q, idx) => {
        // Nav dot
        const dot = document.createElement("a");
        dot.className = "nav-dot";
        dot.id = `nav-dot-${q.id}`;
        dot.innerText = q.id;
        dot.href = `#q-${q.id}`;
        navGrid.appendChild(dot);

        // Question card
        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `q-${q.id}`;

        let optionsHtml = "";
        const letters = ["A", "B", "C", "D"];
        q.options.forEach((opt, optIdx) => {
          optionsHtml += `
            <label class="option-label" id="opt-label-${q.id}-${optIdx}">
              <input type="radio" name="q_${q.id}" value="${optIdx}" onchange="selectOption(${q.id}, ${optIdx})" ${isSubmitted ? "disabled" : ""}>
              <span><strong>(${letters[optIdx]})</strong> ${opt.replace(/^[A-D]\.\s*/, '')}</span>
            </label>
          `;
        });

        card.innerHTML = `
          <div class="q-header">
            <span class="q-num">第 ${q.id} 題 / 共 30 題</span>
            <span class="q-badge">${q.cat}</span>
          </div>
          <div class="q-stem">${q.stem}</div>
          <div class="options-list">${optionsHtml}</div>
          <div class="explanation-box" id="exp-${q.id}">
            <div class="exp-title">💡 破案詳解與文法放大鏡</div>
            <div class="exp-item" style="color:#047857; font-weight:700;">📖 核心法則：${q.rule}</div>
            <div style="margin: 6px 0;">
              ${q.analysis.map(a => `<div class="exp-item">• ${a}</div>`).join('')}
            </div>
            <div class="exp-tip">🐾 通關金句：${q.tip}</div>
          </div>
        `;
        container.appendChild(card);
      });
      updateProgress();
    }

    function selectOption(qId, optIdx) {
      userAnswers[qId] = optIdx;
      // Style labels
      const q = questionsData.find(item => item.id === qId);
      q.options.forEach((_, i) => {
        const label = document.getElementById(`opt-label-${qId}-${i}`);
        if (i === optIdx) {
          label.classList.add("selected");
        } else {
          label.classList.remove("selected");
        }
      });
      // Update nav dot
      const dot = document.getElementById(`nav-dot-${qId}`);
      if (dot) dot.classList.add("answered");
      updateProgress();
    }

    function updateProgress() {
      const answeredCount = Object.keys(userAnswers).length;
      document.getElementById("progressText").innerText = `已作答: ${answeredCount} / 30 題`;
      const pct = (answeredCount / 30) * 100;
      document.getElementById("progressFill").style.width = `${pct}%`;
    }

    function gradeQuiz() {
      const answeredCount = Object.keys(userAnswers).length;
      if (answeredCount < 30) {
        const proceed = confirm(`寧寧，你目前還有 ${30 - answeredCount} 題尚未作答喔！確定要現在送出評分嗎？`);
        if (!proceed) return;
      }

      isSubmitted = true;
      let correctCount = 0;

      questionsData.forEach(q => {
        const userChoice = userAnswers[q.id];
        const isCorrect = userChoice === q.answer;
        if (isCorrect) correctCount++;

        // Nav dot styling
        const dot = document.getElementById(`nav-dot-${q.id}`);
        if (dot) {
          dot.className = `nav-dot ${isCorrect ? 'correct' : 'incorrect'}`;
        }

        // Highlight options
        q.options.forEach((_, optIdx) => {
          const label = document.getElementById(`opt-label-${q.id}-${optIdx}`);
          const input = label.querySelector("input");
          input.disabled = true;

          if (optIdx === q.answer) {
            label.classList.add("is-correct");
          } else if (optIdx === userChoice && !isCorrect) {
            label.classList.add("is-wrong");
          }
        });

        // Show explanation
        const exp = document.getElementById(`exp-${q.id}`);
        if (exp) exp.classList.add("visible");
      });

      // Calculate score
      const finalScore = Math.round((correctCount / 30) * 100);
      document.getElementById("scoreNum").innerText = finalScore;
      document.getElementById("statCorrect").innerText = `答對：${correctCount} 題`;
      document.getElementById("statWrong").innerText = `答錯：${30 - correctCount} 題`;

      // Teacher feedback tailored for 寧寧
      const titleEl = document.getElementById("resultTitle");
      const feedbackEl = document.getElementById("resultFeedback");

      if (finalScore === 100) {
        titleEl.innerHTML = "🎉 滿分金牌大達人！太不可思議了！";
        feedbackEl.innerHTML = "<strong>親愛的寧寧：</strong>你太優秀了！整份測驗 30 題全部答對！從 a/an 發音、形容詞緊貼法則、世上獨一無二自然景觀、固定時間片語到專有名詞與複數零冠詞，每一個文法地雷你都輕鬆避開，Unit 2 冠詞金牌小達人非你莫屬！🏆✨";
      } else if (finalScore >= 85) {
        titleEl.innerHTML = "🌟 優秀冠詞探險家！表現非常亮眼！";
        feedbackEl.innerHTML = "<strong>親愛的寧寧：</strong>表現非常棒喔！已經掌握了絕大部分的冠詞核心觀念。趕快往下看看紅色標記的題目與詳細解析，把最後幾顆小螺絲鎖緊，下一次一定能拿下 100 分滿分！💪";
      } else if (finalScore >= 70) {
        titleEl.innerHTML = "🐿️ 努力小松鼠！基礎觀念很扎實！";
        feedbackEl.innerHTML = "<strong>親愛的寧寧：</strong>你做得很不錯！大部分的題目都順利過關囉。特別注意緊貼形容詞時要聽第一個發音（例如 a green apple, an orange boat），以及固定時間片語一定要加 the，複習完詳解會更厲害喔！";
      } else {
        titleEl.innerHTML = "🐾 溫習充電站！再接再厲不氣餒！";
        feedbackEl.innerHTML = "<strong>親愛的寧寧：</strong>沒關係，學習文法就是從除錯中慢慢進步的！請跟著每一題下方的「破案詳解」與通關金句好好看過一遍，看完後點擊下方按鈕重新挑戰一次，老師相信你一定會大躍進！🌱";
      }

      const resCard = document.getElementById("resultCard");
      resCard.style.display = "block";
      resCard.scrollIntoView({ behavior: "smooth" });

      document.getElementById("submitBtn").style.display = "none";
    }

    function resetQuiz() {
      if (confirm("確定要重置所有答案並重新測驗嗎？")) {
        userAnswers = {};
        isSubmitted = false;
        document.getElementById("resultCard").style.display = "none";
        document.getElementById("submitBtn").style.display = "inline-flex";
        renderQuiz();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    // Initialize on page load
    window.onload = renderQuiz;
  </script>
</body>
</html>
