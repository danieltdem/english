<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寧寧的電影級單字挑戰</title>
    <style>
        /* --- 電影級色調與全域設定 --- */
        :root {
            --bg-color-1: #0f2027;
            --bg-color-2: #203a43;
            --bg-color-3: #2c5364;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #e0f7fa;
            --text-accent: #00e5ff;
            --text-muted: #90a4ae;
            --btn-hover: rgba(0, 229, 255, 0.2);
            --correct-color: #00e676;
            --wrong-color: #ff5252;
            --ruby-color: #80deea;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Microsoft JhengHei', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 專屬注音排版優化 --- */
        ruby {
            ruby-position: over;
            font-family: inherit;
        }
        rt {
            font-size: 0.55em;
            line-height: 1.1;
            color: var(--ruby-color);
            font-weight: normal;
            user-select: none;
            letter-spacing: 0px;
        }

        /* --- PBR 磨砂玻璃材質容器 --- */
        .container {
            text-align: center;
            background: var(--glass-bg);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 90%;
            max-width: 680px;
            max-height: 88vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--text-accent) transparent;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        h1, h2 { 
            color: var(--text-accent); 
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); 
            line-height: 1.5;
        }

        /* --- 現代按鈕設計 (霓虹柔光) --- */
        button {
            padding: 12px 26px;
            font-size: 17px;
            font-weight: bold;
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            line-height: 1.4;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: var(--text-accent);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            transform: translateY(-2px);
        }
        button:active { transform: translateY(1px); }

        /* 發音按鈕特製 */
        .tts-btn {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--text-accent);
            border-radius: 50px;
            padding: 8px 18px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* --- 輸入框 PBR 視覺優化 --- */
        input[type="text"] {
            padding: 12px 16px;
            font-size: 18px;
            width: 70%;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: var(--text-accent);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3), inset 0 2px 5px rgba(0,0,0,0.5);
        }
        input.correct { border-color: var(--correct-color); background: rgba(0, 230, 118, 0.1); }
        input.wrong { border-color: var(--wrong-color); background: rgba(255, 82, 82, 0.1); }

        /* --- 記憶法提示區 --- */
        .mnemonic-box {
            display: none;
            margin-top: 15px;
            font-size: 16px;
            color: #ffd54f;
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            padding: 16px;
            border-left: 4px solid #ffd54f;
            border-radius: 6px;
            line-height: 1.8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- 練習模式排版 --- */
        .practice-row-container {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 14px 0;
        }
        .practice-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .col-zh { width: 38%; text-align: left; font-size: 17px; color: #bcaaa4; line-height: 1.6; }
        .col-input { width: 32%; }
        .col-ans { width: 30%; text-align: right; color: var(--correct-color); font-weight: bold; font-size: 18px; }
        .answer-text { display: none; }
        
        #menu-screen, #exam-screen, #practice-screen { display: none; }
        #menu-screen.active, #exam-screen.active, #practice-screen.active {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #wrong-words { text-align: left; margin-top: 20px; line-height: 1.8; }
    </style>
</head>
<body>

    <!-- 首頁選單 -->
    <div id="menu-screen" class="container active">
        <h1>
            <ruby>寧<rt>ㄋㄧㄥˊ</rt></ruby><ruby>寧<rt>ㄋㄧㄥˊ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>單<rt>ㄉㄢ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby><ruby>挑<rt>ㄊㄧㄠ</rt></ruby><ruby>戰<rt>ㄓㄢˋ</rt></ruby><br>
            <span style="font-size:0.5em; color:var(--text-muted)">Cinematic Edition</span>
        </h1>
        <p style="font-size:18px; margin-bottom: 25px;">
            <ruby>請<rt>ㄑㄧㄥˇ</rt></ruby><ruby>選<rt>ㄒㄩㄢˇ</rt></ruby><ruby>擇<rt>ㄗㄜˊ</rt></ruby><ruby>你<rt>ㄋㄧˇ</rt></ruby><ruby>喜<rt>ㄒㄧˇ</rt></ruby><ruby>歡<rt>ㄏㄨㄢ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>學<rt>ㄒㄩㄝˊ</rt></ruby><ruby>習<rt>ㄒㄧˊ</rt></ruby><ruby>模<rt>ㄇㄛˊ</rt></ruby><ruby>式<rt>ㄕˋ</rt></ruby>：
        </p>
        <div>
            <button onmouseenter="playSound('hover')" onclick="goToExam()">
                <ruby>開<rt>ㄎㄞ</rt></ruby><ruby>始<rt>ㄕˇ</rt></ruby><ruby>考<rt>ㄎㄠˇ</rt></ruby><ruby>試<rt>ㄕˋ</rt></ruby>
            </button>
            <button onmouseenter="playSound('hover')" onclick="goToPractice()">
                <ruby>我<rt>ㄨㄛˇ</rt></ruby><ruby>要<rt>ㄧㄠˋ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt></ruby><ruby>習<rt>ㄒㄧˊ</rt></ruby>
            </button>
        </div>
    </div>

    <!-- 考試模式 -->
    <div id="exam-screen" class="container">
        <h2><ruby>單<rt>ㄉㄢ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby><ruby>拼<rt>ㄆㄧㄣ</rt></ruby><ruby>寫<rt>ㄒㄧㄝˇ</rt></ruby><ruby>測<rt>ㄘㄜˋ</rt></ruby><ruby>驗<rt>ㄧㄢˋ</rt></ruby></h2>
        <p style="color:var(--text-muted); font-size:15px;">
            <ruby>大<rt>ㄉㄚˋ</rt></ruby><ruby>小<rt>ㄒㄧㄠˇ</rt></ruby><ruby>寫<rt>ㄒㄧㄝˇ</rt></ruby><ruby>皆<rt>ㄐㄧㄝ</rt></ruby><ruby>可<rt>ㄎㄜˇ</rt></ruby>，<ruby>系<rt>ㄒㄧˋ</rt></ruby><ruby>統<rt>ㄊㄨㄥˇ</rt></ruby><ruby>自<rt>ㄗˋ</rt></ruby><ruby>動<rt>ㄉㄨㄥˋ</rt></ruby><ruby>幫<rt>ㄅㄤ</rt></ruby><ruby>你<rt>ㄋㄧˇ</rt></ruby><ruby>判<rt>ㄆㄢˋ</rt></ruby><ruby>斷<rt>ㄉㄨㄢˋ</rt></ruby>！
        </p>
        <div id="question" style="font-size: 24px; margin: 25px 0; color: #fff;">
            <ruby>載<rt>ㄗㄞˋ</rt></ruby><ruby>入<rt>ㄖㄨˋ</rt></ruby><ruby>中<rt>ㄓㄨㄥ</rt></ruby>...
        </div>
        <input type="text" id="exam-answer" placeholder="Type here..." autocomplete="off">
        <br>
        <button id="exam-submit" onmouseenter="playSound('hover')">
            <ruby>提<rt>ㄊㄧˊ</rt></ruby><ruby>交<rt>ㄐㄧㄠ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby>
        </button>
        <div id="exam-result" style="font-size: 20px; margin-top: 20px; font-weight:bold;"></div>
        <div id="mnemonic" class="mnemonic-box"></div>
        <div id="score" style="font-size: 18px; margin-top: 15px; color: var(--text-muted);">
            <ruby>目<rt>ㄇㄨˋ</rt></ruby><ruby>前<rt>ㄑㄧㄢˊ</rt></ruby><ruby>分<rt>ㄈㄣ</rt></ruby><ruby>數<rt>ㄕㄨˋ</rt></ruby>: 0 / 0
        </div>
        <div id="wrong-words"></div>
        
        <div style="margin-top: 25px; display: flex; justify-content: center; flex-wrap: wrap;">
            <button id="exam-restart" style="display: none;" onmouseenter="playSound('hover')">
                <ruby>重<rt>ㄔㄨㄥˊ</rt></ruby><ruby>新<rt>ㄒㄧㄣ</rt></ruby><ruby>開<rt>ㄎㄞ</rt></ruby><ruby>始<rt>ㄕˇ</rt></ruby>
            </button>
            <button id="exam-retest" style="display: none; border-color: #ffd54f;" onmouseenter="playSound('hover')">
                <ruby>重<rt>ㄔㄨㄥˊ</rt></ruby><ruby>測<rt>ㄘㄜˋ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby>
            </button>
            <button onmouseenter="playSound('hover')" onclick="goHome()" style="background: rgba(255,255,255,0.1);">
                <ruby>回<rt>ㄏㄨㄟˊ</rt></ruby><ruby>首<rt>ㄕㄡˇ</rt></ruby><ruby>頁<rt>ㄧㄝˋ</rt></ruby>
            </button>
        </div>
    </div>

    <!-- 練習模式 -->
    <div id="practice-screen" class="container">
        <h2><ruby>單<rt>ㄉㄢ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt></ruby><ruby>習<rt>ㄒㄧˊ</rt></ruby><ruby>室<rt>ㄕˋ</rt></ruby></h2>
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
            <button onclick="goHome()" onmouseenter="playSound('hover')" style="background: rgba(255,255,255,0.1);">
                <ruby>回<rt>ㄏㄨㄟˊ</rt></ruby><ruby>首<rt>ㄕㄡˇ</rt></ruby><ruby>頁<rt>ㄧㄝˋ</rt></ruby>
            </button>
            <button id="toggle-all-btn" onclick="toggleAllAnswers()" onmouseenter="playSound('hover')" style="border-color: #ffd54f;">
                <ruby>顯<rt>ㄒㄧㄢˇ</rt></ruby><ruby>示<rt>ㄕˋ</rt></ruby><ruby>所<rt>ㄙㄨㄛˇ</rt></ruby><ruby>有<rt>ㄧㄡˇ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby> / <ruby>批<rt>ㄆㄧ</rt></ruby><ruby>改<rt>ㄍㄞˇ</rt></ruby>
            </button>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 15px; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">
            <span style="width:38%; text-align:left;">
                <ruby>中<rt>ㄓㄨㄥ</rt></ruby><ruby>文<rt>ㄨㄣˊ</rt></ruby><ruby>意<rt>ㄧˋ</rt></ruby><ruby>思<rt>ㄙ</rt></ruby>
            </span>
            <span style="width:32%">
                <ruby>拼<rt>ㄆㄧㄣ</rt></ruby><ruby>寫<rt>ㄒㄧㄝˇ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt></ruby><ruby>習<rt>ㄒㄧˊ</rt></ruby>
            </span>
            <span style="width:30%; text-align:right;">
                <ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby>
            </span>
        </div>
        <div id="practice-list" style="margin-top: 10px;"></div>
    </div>

    <script>
        // Web Audio API 音效系統 (最高質感標準)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'hover') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // 單字庫 (30 個單字，中文釋義與記憶提示皆已加上標準注音)
        const words = [
            { 
                en: 'fantasy', 
                zh: '<ruby>幻<rt>ㄏㄨㄢˋ</rt></ruby><ruby>想<rt>ㄒㄧㄤˇ</rt></ruby>', 
                mnemonic: 'fan(<ruby>粉<rt>ㄈㄣˇ</rt></ruby><ruby>絲<rt>ㄙ</rt></ruby>) + tasy(<ruby>聽<rt>ㄊㄧㄥ</rt></ruby><ruby>起<rt>ㄑㄧˇ</rt></ruby><ruby>來<rt>ㄌㄞˊ</rt></ruby><ruby>像<rt>ㄒㄧㄤˋ</rt></ruby><ruby>太<rt>ㄊㄞˋ</rt></ruby><ruby>帥<rt>ㄕㄨㄞˋ</rt></ruby>) -> <ruby>粉<rt>ㄈㄣˇ</rt></ruby><ruby>絲<rt>ㄙ</rt></ruby><ruby>總<rt>ㄗㄨㄥˇ</rt></ruby><ruby>是<rt>ㄕˋ</rt></ruby><ruby>有<rt>ㄧㄡˇ</rt></ruby><ruby>各<rt>ㄍㄜˋ</rt></ruby><ruby>種<rt>ㄓㄨㄥˇ</rt></ruby><ruby>太<rt>ㄊㄞˋ</rt></ruby><ruby>帥<rt>ㄕㄨㄞˋ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>幻<rt>ㄏㄨㄢˋ</rt></ruby><ruby>想<rt>ㄒㄧㄤˇ</rt></ruby>。' 
            },
            { 
                en: 'worry', 
                zh: '<ruby>擔<rt>ㄉㄢ</rt></ruby><ruby>心<rt>ㄒㄧㄣ</rt></ruby>', 
                mnemonic: '<ruby>聽<rt>ㄊㄧㄥ</rt></ruby><ruby>起<rt>ㄑㄧˇ</rt></ruby><ruby>來<rt>ㄌㄞˊ</rt></ruby><ruby>像<rt>ㄒㄧㄤˋ</rt></ruby>「<ruby>我<rt>ㄨㄛˇ</rt></ruby><ruby>累<rt>ㄌㄟˋ</rt></ruby>」，<ruby>整<rt>ㄓㄥˇ</rt></ruby><ruby>天<rt>ㄊㄧㄢ</rt></ruby><ruby>擔<rt>ㄉㄢ</rt></ruby><ruby>心<rt>ㄒㄧㄣ</rt></ruby><ruby>這<rt>ㄓㄜˋ</rt></ruby><ruby>擔<rt>ㄉㄢ</rt></ruby><ruby>心<rt>ㄒㄧㄣ</rt></ruby><ruby>那<rt>ㄋㄚˋ</rt></ruby>，<ruby>覺<rt>ㄐㄩㄝˊ</rt></ruby><ruby>得<rt>˙ㄉㄜ</rt></ruby>「<ruby>我<rt>ㄨㄛˇ</rt></ruby><ruby>好<rt>ㄏㄠˇ</rt></ruby><ruby>累<rt>ㄌㄟˋ</rt></ruby>」。' 
            },
            { 
                en: 'wonder', 
                zh: '<ruby>想<rt>ㄒㄧㄤˇ</rt></ruby><ruby>知<rt>ㄓ</rt></ruby><ruby>道<rt>ㄉㄠˋ</rt></ruby> / <ruby>奇<rt>ㄑㄧˊ</rt></ruby><ruby>蹟<rt>ㄐㄧ</rt></ruby>', 
                mnemonic: 'won(<ruby>贏<rt>ㄧㄥˊ</rt></ruby>) + der(<ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>人<rt>ㄖㄣˊ</rt></ruby>)。<ruby>贏<rt>ㄧㄥˊ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>人<rt>ㄖㄣˊ</rt></ruby><ruby>總<rt>ㄗㄨㄥˇ</rt></ruby><ruby>能<rt>ㄋㄥˊ</rt></ruby><ruby>創<rt>ㄔㄨㄤˋ</rt></ruby><ruby>造<rt>ㄗㄠˋ</rt></ruby><ruby>奇<rt>ㄑㄧˊ</rt></ruby><ruby>蹟<rt>ㄐㄧ</rt></ruby>，<ruby>讓<rt>ㄖㄤˋ</rt></ruby><ruby>大<rt>ㄉㄚˋ</rt></ruby><ruby>家<rt>ㄐㄧㄚ</rt></ruby><ruby>都<rt>ㄉㄡ</rt></ruby><ruby>想<rt>ㄒㄧㄤˇ</rt></ruby><ruby>知<rt>ㄓ</rt></ruby><ruby>道<rt>ㄉㄠˋ</rt></ruby><ruby>他<rt>ㄊㄚ</rt></ruby><ruby>怎<rt>ㄗㄣˇ</rt></ruby><ruby>麼<rt>˙ㄇㄜ</rt></ruby><ruby>辦<rt>ㄅㄢˋ</rt></ruby><ruby>到<rt>ㄉㄠˋ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby>。' 
            },
            { 
                en: 'extra', 
                zh: '<ruby>額<rt>ㄜˊ</rt></ruby><ruby>外<rt>ㄨㄞˋ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby>', 
                mnemonic: 'ex(<ruby>向<rt>ㄒㄧㄤˋ</rt></ruby><ruby>外<rt>ㄨㄞˋ</rt></ruby>) + tra。<ruby>向<rt>ㄒㄧㄤˋ</rt></ruby><ruby>外<rt>ㄨㄞˋ</rt></ruby><ruby>再<rt>ㄗㄞˋ</rt></ruby><ruby>多<rt>ㄉㄨㄛ</rt></ruby><ruby>拿<rt>ㄋㄚˊ</rt></ruby><ruby>出<rt>ㄔㄨ</rt></ruby><ruby>來<rt>ㄌㄞˊ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby>，<ruby>就<rt>ㄐㄧㄡˋ</rt></ruby><ruby>是<rt>ㄕˋ</rt></ruby><ruby>額<rt>ㄜˊ</rt></ruby><ruby>外<rt>ㄨㄞˋ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby>。' 
            },
            {

        /* --- 語音朗讀 API --- */
        function speakWord(word) {
            playSound('click');
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        /* --- 洗牌演算法 --- */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /* --- 頁面切換邏輯 --- */
        function switchScreen(screenId) {
            playSound('click');
            document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goHome() { switchScreen('menu-screen'); }

        function goToExam() {
            switchScreen('exam-screen');
            startGame(words);
        }

        function goToPractice() {
            switchScreen('practice-screen');
            renderPracticeList();
            resetPracticeState();
        }

        /* --- 練習模式邏輯 --- */
        let areAnswersVisible = false;

        function resetPracticeState() {
            areAnswersVisible = false;
            document.getElementById('toggle-all-btn').innerHTML = '<ruby>顯<rt>ㄒㄧㄢˇ</rt></ruby><ruby>示<rt>ㄕˋ</rt></ruby><ruby>所<rt>ㄙㄨㄛˇ</rt></ruby><ruby>有<rt>ㄧㄡˇ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby> / <ruby>批<rt>ㄆㄧ</rt></ruby><ruby>改<rt>ㄍㄞˇ</rt></ruby>';
        }

        function renderPracticeList() {
            const listContainer = document.getElementById('practice-list');
            listContainer.innerHTML = '';

            words.forEach((word, index) => {
                const div = document.createElement('div');
                div.className = 'practice-row-container';
                div.innerHTML = `
                    <div class="practice-row">
                        <div class="col-zh">${word.zh}</div>
                        <div class="col-input">
                            <input type="text" id="p-input-${index}" placeholder="Type here..." autocomplete="off">
                        </div>
                        <div class="col-ans">
                            <div id="ans-${index}" class="answer-text">
                                ${word.en}
                                <br><button class="tts-btn" onclick="speakWord('${word.en}')">🔊 <ruby>聽<rt>ㄊㄧㄥ</rt></ruby><ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby></button>
                            </div>
                        </div>
                    </div>
                    <div id="p-mnemonic-${index}" class="mnemonic-box">
                        💡 <b><ruby>記<rt>ㄐㄧˋ</rt></ruby><ruby>憶<rt>ㄧˋ</rt></ruby><ruby>提<rt>ㄊㄧˊ</rt></ruby><ruby>示<rt>ㄕˋ</rt></ruby>：</b>${word.mnemonic}
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        document.getElementById('practice-screen').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') toggleAllAnswers();
        });

        function toggleAllAnswers() {
            playSound('click');
            const btn = document.getElementById('toggle-all-btn');
            const answers = document.querySelectorAll('.answer-text');
            const inputs = document.querySelectorAll('#practice-list input[type="text"]');

            areAnswersVisible = !areAnswersVisible;

            if (areAnswersVisible) {
                btn.innerHTML = '<ruby>隱<rt>ㄧㄣˇ</rt></ruby><ruby>藏<rt>ㄘㄤˊ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby><ruby>與<rt>ㄩˇ</rt></ruby><ruby>提<rt>ㄊㄧˊ</rt></ruby><ruby>示<rt>ㄕˋ</rt></ruby>';
                btn.style.borderColor = '#ff5252';
                
                answers.forEach(el => el.style.display = 'block');

                let allCorrect = true;
                inputs.forEach((input, index) => {
                    const userWord = input.value.trim().toLowerCase();
                    const correctWord = words[index].en.toLowerCase();
                    const mnemonicDiv = document.getElementById(`p-mnemonic-${index}`);
                    
                    if (userWord === correctWord) {
                        input.classList.add('correct');
                        input.classList.remove('wrong');
                        mnemonicDiv.style.display = 'none'; 
                    } else {
                        input.classList.add('wrong');
                        input.classList.remove('correct');
                        mnemonicDiv.style.display = 'block'; 
                        allCorrect = false;
                    }
                });
                
                if (allCorrect) playSound('correct');
                else playSound('wrong');

            } else {
                btn.innerHTML = '<ruby>顯<rt>ㄒㄧㄢˇ</rt></ruby><ruby>示<rt>ㄕˋ</rt></ruby><ruby>所<rt>ㄙㄨㄛˇ</rt></ruby><ruby>有<rt>ㄧㄡˇ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby> / <ruby>批<rt>ㄆㄧ</rt></ruby><ruby>改<rt>ㄍㄞˇ</rt></ruby>';
                btn.style.borderColor = '#ffd54f';
                answers.forEach(el => el.style.display = 'none');
                document.querySelectorAll('.mnemonic-box').forEach(el => el.style.display = 'none');
            }
        }

        /* --- 考試模式邏輯 --- */
        let currentQuestion = 0, score = 0, totalQuestions = 0;
        let questions = [], wrongWords = [];
        let isWaitingToContinue = false;

        function startGame(wordList) {
            questions = [...wordList];
            totalQuestions = questions.length;
            shuffle(questions);
            currentQuestion = 0; score = 0; wrongWords = []; isWaitingToContinue = false;
            
            document.getElementById('exam-restart').style.display = 'none';
            document.getElementById('exam-retest').style.display = 'none';
            document.getElementById('wrong-words').innerHTML = '';
            document.getElementById('exam-answer').style.display = 'inline-block';
            document.getElementById('exam-submit').style.display = 'inline-block';
            document.getElementById('exam-submit').innerHTML = '<ruby>提<rt>ㄊㄧˊ</rt></ruby><ruby>交<rt>ㄐㄧㄠ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby>';
            document.getElementById('mnemonic').style.display = 'none';
            
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) { endGame(); return; }
            const q = questions[currentQuestion];
            
            document.getElementById('mnemonic').style.display = 'none';
            isWaitingToContinue = false;
            document.getElementById('exam-submit').innerHTML = '<ruby>提<rt>ㄊㄧˊ</rt></ruby><ruby>交<rt>ㄐㄧㄠ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby>';
            document.getElementById('question').innerHTML = `<ruby>請<rt>ㄑㄧㄥˇ</rt></ruby><ruby>輸<rt>ㄕㄨ</rt></ruby><ruby>入<rt>ㄖㄨˋ</rt></ruby>「${q.zh}」<ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>英<rt>ㄧㄥ</rt></ruby><ruby>文<rt>ㄨㄣˊ</rt></ruby>：`;
            document.getElementById('exam-answer').value = '';
            document.getElementById('exam-result').innerHTML = '';
            
            document.getElementById('score').innerHTML = `<ruby>目<rt>ㄇㄨˋ</rt></ruby><ruby>前<rt>ㄑㄧㄢˊ</rt></ruby><ruby>分<rt>ㄈㄣ</rt></ruby><ruby>數<rt>ㄕㄨˋ</rt></ruby>: ${score} / ${totalQuestions}`;
            setTimeout(() => document.getElementById('exam-answer').focus(), 50);
        }

        function checkExamAnswer() {
            if (isWaitingToContinue) {
                currentQuestion++;
                nextQuestion();
                return;
            }

            const userAnswer = document.getElementById('exam-answer').value.trim().toLowerCase();
            const q = questions[currentQuestion];
            const correctAnswer = q.en.toLowerCase();

            if (userAnswer === correctAnswer) {
                playSound('correct');
                score++;
                document.getElementById('exam-result').innerHTML = '<ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>對<rt>ㄉㄨㄟˋ</rt></ruby><ruby>了<rt>˙ㄌㄜ</rt></ruby>！<ruby>太<rt>ㄊㄞˋ</rt></ruby><ruby>厲<rt>ㄌㄧˋ</rt></ruby><ruby>害<rt>ㄏㄞˋ</rt></ruby><ruby>了<rt>˙ㄌㄜ</rt></ruby>！';
                document.getElementById('exam-result').style.color = 'var(--correct-color)';
                setTimeout(() => { currentQuestion++; nextQuestion(); }, 1200);
            } else {
                playSound('wrong');
                document.getElementById('exam-result').innerHTML = `<ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>了<rt>˙ㄌㄜ</rt></ruby>，<ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby><ruby>是<rt>ㄕˋ</rt></ruby>：${q.en}`;
                document.getElementById('exam-result').style.color = 'var(--wrong-color)';
                
                const mnemonicEl = document.getElementById('mnemonic');
                mnemonicEl.innerHTML = `
                    💡 <b><ruby>記<rt>ㄐㄧˋ</rt></ruby><ruby>憶<rt>ㄧˋ</rt></ruby><ruby>提<rt>ㄊㄧˊ</rt></ruby><ruby>示<rt>ㄕˋ</rt></ruby>：</b>${q.mnemonic}
                    <br><br><button class="tts-btn" onclick="speakWord('${q.en}')">🔊 <ruby>聽<rt>ㄊㄧㄥ</rt></ruby><ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby></button>
                `;
                mnemonicEl.style.display = 'block';
                
                document.getElementById('exam-submit').innerHTML = '<ruby>點<rt>ㄉㄧㄢˇ</rt></ruby><ruby>擊<rt>ㄐㄧˊ</rt></ruby><ruby>繼<rt>ㄐㄧˋ</rt></ruby><ruby>續<rt>ㄒㄩˋ</rt></ruby><ruby>下<rt>ㄒㄧㄚˋ</rt></ruby><ruby>一<rt>ㄧ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby>';
                wrongWords.push({ zh: q.zh, en: q.en, user: userAnswer, mnemonic: q.mnemonic });
                isWaitingToContinue = true;
            }
            document.getElementById('score').innerHTML = `<ruby>目<rt>ㄇㄨˋ</rt></ruby><ruby>前<rt>ㄑㄧㄢˊ</rt></ruby><ruby>分<rt>ㄈㄣ</rt></ruby><ruby>數<rt>ㄕㄨˋ</rt></ruby>: ${score} / ${totalQuestions}`;
        }

        function endGame() {
            document.getElementById('mnemonic').style.display = 'none';
            document.getElementById('question').innerHTML = '<ruby>測<rt>ㄘㄜˋ</rt></ruby><ruby>驗<rt>ㄧㄢˋ</rt></ruby><ruby>結<rt>ㄐㄧㄝˊ</rt></ruby><ruby>束<rt>ㄕㄨˋ</rt></ruby>！';
            document.getElementById('exam-answer').style.display = 'none';
            document.getElementById('exam-submit').style.display = 'none';
            document.getElementById('exam-result').innerHTML = `<ruby>你<rt>ㄋㄧˇ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>最<rt>ㄗㄨㄟˋ</rt></ruby><ruby>終<rt>ㄓㄨㄥ</rt></ruby><ruby>分<rt>ㄈㄣ</rt></ruby><ruby>數<rt>ㄕㄨˋ</rt></ruby>：<br><span style="font-size:40px; color:var(--text-accent);">${score} / ${totalQuestions}</span>`;
            
            if (score === totalQuestions) {
                playSound('correct');
                document.getElementById('wrong-words').innerHTML = '<span style="color:var(--correct-color); font-size:18px;"><ruby>太<rt>ㄊㄞˋ</rt></ruby><ruby>完<rt>ㄨㄢˊ</rt></ruby><ruby>美<rt>ㄇㄟˇ</rt></ruby><ruby>了<rt>˙ㄌㄜ</rt></ruby>！<ruby>你<rt>ㄋㄧˇ</rt></ruby><ruby>全<rt>ㄑㄩㄢˊ</rt></ruby><ruby>部<rt>ㄅㄨˋ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>對<rt>ㄉㄨㄟˋ</rt></ruby><ruby>了<rt>˙ㄌㄜ</rt></ruby>！</span>';
            } else {
                let wrongHTML = '<div style="margin-bottom:12px; font-weight:bold; font-size:17px;"><ruby>你<rt>ㄋㄧˇ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>單<rt>ㄉㄢ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby>：</div>';
                wrongWords.forEach(w => {
                    wrongHTML += `
                        <div style="margin-bottom:12px; padding:12px; background:rgba(0,0,0,0.25); border-radius:8px; border-left:3px solid #ff5252;">
                            <div style="font-size:16px;">❌ ${w.zh}</div>
                            <div style="color:#ffab91; margin-top:4px;">👉 <ruby>你<rt>ㄋㄧˇ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby>: "${w.user || '（空白）'}"</div>
                            <div style="color:var(--correct-color); margin-top:2px;">✅ <ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby>: "${w.en}"</div>
                        </div>
                    `;
                });
                document.getElementById('wrong-words').innerHTML = wrongHTML;
                document.getElementById('exam-retest').style.display = 'inline-block';
            }
            document.getElementById('exam-restart').style.display = 'inline-block';
        }

        document.getElementById('exam-submit').addEventListener('click', checkExamAnswer);
        document.getElementById('exam-answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkExamAnswer();
        });
        document.getElementById('exam-restart').addEventListener('click', () => { playSound('click'); startGame(words); });
        document.getElementById('exam-retest').addEventListener('click', () => {
            playSound('click');
            if (wrongWords.length > 0) {
                const retestWords = wrongWords.map(w => ({ en: w.en, zh: w.zh, mnemonic: w.mnemonic }));
                startGame(retestWords);
            }
        });
    </script>
</body>
</html>
