<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寧寧的頂級單字挑戰</title>
    <style>
        /* 電影級色調映射與現代背景 */
        :root {
            --primary-color: #6c63ff;
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top left, #1e1b4b, var(--bg-color), #020617);
            color: var(--text-main);
            overflow: hidden;
            /* 色調映射感 */
            filter: contrast(1.05) saturate(1.1); 
        }

        /* PBR 玻璃材質與柔和陰影 (Glassmorphism) */
        .container {
            text-align: center;
            background: var(--surface-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) transparent;
        }

        .container::-webkit-scrollbar { width: 6px; }
        .container::-webkit-scrollbar-thumb { background-color: var(--primary-color); border-radius: 10px; }

        h1 { margin-top: 0; font-weight: 300; letter-spacing: 2px; }
        
        /* 圖片視覺 */
        .game-image {
            width: 100%;
            max-width: 250px;
            height: auto;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }

        /* 現代感按鈕 */
        button {
            padding: 14px 28px;
            font-size: 16px;
            letter-spacing: 1px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.6); filter: brightness(1.1); }
        button:active { transform: translateY(1px); }

        .tts-btn {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
            display: inline-flex;
            align-items: center;
        }

        .ruby-text { font-size: 0.75em; display: block; margin-bottom: 4px; opacity: 0.8; }

        /* 考試模式 */
        .exam-input {
            padding: 15px;
            font-size: 20px;
            width: 80%;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        .exam-input:focus { border-color: var(--primary-color); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }
        
        #mnemonic {
            font-size: 16px;
            margin-top: 15px;
            color: #e0e7ff;
            text-align: left;
            padding: 20px;
            border-radius: 12px;
            background: rgba(79, 70, 229, 0.15);
            border: 1px solid rgba(79, 70, 229, 0.3);
            line-height: 1.6;
        }

        #wrong-words { text-align: left; white-space: pre-wrap; margin-top: 20px; color: #fca5a5;}

        /* 練習模式 */
        .practice-fixed-top {
            background: rgba(15, 23, 42, 0.85);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .practice-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .col-zh { width: 35%; text-align: left; font-size: 16px; color: #fbbf24; }
        .col-input { width: 35%; }
        .col-ans { width: 30%; text-align: right; color: var(--success); font-weight: bold; display: flex; flex-direction: column; align-items: flex-end;}

        .practice-input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
            background: rgba(0,0,0,0.3);
            color: white;
            border: 1px solid #475569;
            border-radius: 8px;
            outline: none;
        }
        .practice-input.correct { border-color: var(--success); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
        .practice-input.wrong { border-color: var(--error); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }

        .practice-mnemonic {
            display: none;
            margin-bottom: 20px;
            font-size: 14px;
            color: #bae6fd;
            text-align: left;
            background: rgba(14, 165, 233, 0.1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .global-toggle-btn { background: linear-gradient(135deg, #ef4444, #dc2626); width: 100%; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .global-toggle-btn.active { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        
        .answer-text { display: none; margin-bottom: 5px; font-size: 18px; }
        
        /* 隱藏區塊 */
        #exam-screen, #practice-screen { display: none; }
    </style>
</head>
<body>

    <!-- 1. 首頁選單 -->
    <div id="menu-screen" class="container">
        <h1>✨ 寧寧的頂級單字挑戰</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">請選擇妳的學習模式：</p>
        
        <button style="width: 80%; padding: 20px;" onclick="goToExam()">
            <span class="ruby-text">ㄎㄞ ㄕˇ ㄎㄠˇ ㄕˋ</span>
            開始考試
        </button>

        <button style="width: 80%; padding: 20px; background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);" onclick="goToPractice()">
            <span class="ruby-text">ㄨㄛˇ ㄧㄠˋ ㄌㄧㄢˋ ㄒㄧˊ</span>
            我要練習
        </button>
    </div>

    <!-- 2. 考試模式 -->
    <div id="exam-screen" class="container">
        <h1>單字拼寫測驗</h1>
        <div id="question" style="font-size: 26px; margin: 30px 0; color: #fbbf24;">載入題目中...</div>
        <input type="text" id="exam-answer" class="exam-input" placeholder="輸入英文拼寫 (大小寫皆可)" autocomplete="off">
        <br>
        <button id="exam-submit">提交答案</button>
        <div id="exam-result" style="font-size: 22px; margin-top: 20px; height: 30px;"></div>
        <div id="mnemonic"></div>
        <div id="score" style="font-size: 18px; margin-top: 15px; color: var(--text-muted);">分數: 0 / 0</div>
        <div id="wrong-words"></div>
        
        <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <button id="exam-restart" style="display: none;">重新開始</button>
            <button id="exam-retest" style="display: none; background: linear-gradient(135deg, #f59e0b, #d97706);">重測錯題</button>
            <button style="background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); box-shadow: none;" onclick="goHome()">回首頁</button>
        </div>
    </div>

    <!-- 3. 練習模式 -->
    <div id="practice-screen" class="container" style="max-width: 800px; padding: 20px;">
        <div class="practice-fixed-top">
            <h2 style="margin: 0 0 15px 0;">單字練習室</h2>
            <div style="display: flex; gap: 10px;">
                <button style="flex: 1; background: transparent; border: 1px solid var(--text-muted); box-shadow:none;" onclick="goHome()">
                    回首頁<br><span style="font-size:0.8em; opacity:0.6;">ㄏㄨㄟˊ ㄕㄡˇ ㄧㄝˋ</span>
                </button>
                <button id="toggle-all-btn" class="global-toggle-btn" style="flex: 3;" onclick="toggleAllAnswers()">
                    顯示答案與批改<br><span style="font-size:0.8em; opacity:0.8;">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>
                </button>
            </div>
        </div>
        <div id="practice-list" style="text-align: left;"></div>
    </div>

    <script>
        // --- Web Audio API 高質感音效引擎 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // 清脆的叮聲
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                oscillator.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // 低沉的嗡聲
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- 全新的單字庫 (結合 Mnemonic Dictionary 記憶法) ---
        const words = [
            { en: 'fantasy', zh: '幻想 / 奇幻 (ㄏㄨㄢˋ ㄒㄧㄤˇ)', mnemonic: 'fan (粉絲) + tasy (tasty, 美味的)。粉絲覺得偶像的一切都很美好美味，這是一種幻想 (fantasy)。' },
            { en: 'worry', zh: '擔心 / 憂慮 (ㄉㄢ ㄒㄧㄣ)', mnemonic: 'wor (war, 戰爭) + ry。戰爭會帶來許多擔心與憂慮 (worry)。' },
            { en: 'wonder', zh: '想知道 / 驚奇 (ㄒㄧㄤˇ ㄓ ㄉㄠˋ)', mnemonic: 'won (贏) + der。贏得比賽的人會讓人想知道 (wonder) 他是怎麼辦到的。' },
            { en: 'extra', zh: '額外的 (ㄜˊ ㄨㄞˋ ㄉㄜ˙)', mnemonic: 'ex (出去) + tra (track, 軌道)。跑出原本軌道之外的，就是額外的 (extra)。' },
            { en: 'go wading', zh: '去涉水 / 玩水 (ㄑㄩˋ ㄕㄜˋ ㄕㄨㄟˇ)', mnemonic: 'wade 聽起來像 wait (等待)。在水裡涉水而行 (go wading) 要慢慢走，像是在等待。' },
            { en: 'late', zh: '遲到的 (ㄔˊ ㄉㄠˋ ㄉㄜ˙)', mnemonic: 'late 聽起來像中文的「累的」。因為太累了爬不起來，所以就遲到了 (late)。' },
            { en: 'teacher', zh: '老師 (ㄌㄠˇ ㄕ)', mnemonic: 'teach (教導) + er (的人)。專門教導別人的人就是老師 (teacher)。' },
            { en: 'tractor', zh: '拖拉機 (ㄊㄨㄛ ㄌㄚ ㄐㄧ)', mnemonic: 'tract (拉) + or (機器)。用來拉東西的農用機器就是拖拉機 (tractor)。' },
            { en: 'doctor', zh: '醫生 (ㄧ ㄕㄥ)', mnemonic: 'doc (document, 文件/病歷) + tor。常常看病歷文件的人是醫生 (doctor)。' },
            { en: 'sister', zh: '姐妹 (ㄐㄧㄝˇ ㄇㄟˋ)', mnemonic: 'sis (sit, 坐) + ter。跟你從小坐在一起長大的女孩是姐妹 (sister)。' },
            { en: 'knife', zh: '刀子 (ㄉㄠ ㄗ˙)', mnemonic: 'k (不發音) + nife (聽起來像 life, 生命)。拿刀子 (knife) 不小心會威脅到生命 (life)。' },
            { en: 'later', zh: '稍後 / 後來 (ㄕㄠ ㄏㄡˋ)', mnemonic: 'late (遲) + r (比較級)。比遲到還要更晚一點，就是稍後 (later)。' },
            { en: 'adopt', zh: '收養 / 採用 (ㄕㄡ ㄧㄤˇ)', mnemonic: 'ad (add, 增加) + opt (選擇)。選擇 (opt) 把別人增加 (add) 到自己家裡，就是收養 (adopt)。' },
            { en: 'blood', zh: '血液 (ㄒㄧㄝˇ ㄧㄝˋ)', mnemonic: 'b + flood (洪水)。受傷時血液 (blood) 像洪水一樣流出來。' },
            { en: 'cash', zh: '現金 (ㄒㄧㄢˋ ㄐㄧㄣ)', mnemonic: '聽起來像 catch (抓住)。用現金 (cash) 買東西可以立刻抓住物品。' }
        ];

        /* --- 語音朗讀 API --- */
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 中斷前一個語音
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // 稍微放慢，聽得更清楚
                window.speechSynthesis.speak(utterance);
            } else {
                alert("很抱歉，您的瀏覽器目前不支援語音朗讀功能喔！");
            }
        }

        /* --- 洗牌演算法 --- */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /* --- 頁面切換邏輯 --- */
        function goHome() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'none'; 
        }

        function goToExam() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'block';
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startGame(words);
        }

        function goToPractice() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'block'; 
            if(audioCtx.state === 'suspended') audioCtx.resume();
            renderPracticeList();
            resetPracticeState();
        }

        /* --- 練習模式邏輯 --- */
        let areAnswersVisible = false;

        function resetPracticeState() {
            areAnswersVisible = false;
            const btn = document.getElementById('toggle-all-btn');
            btn.innerHTML = '顯示答案與批改<br><span style="font-size:0.8em; opacity:0.8;">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>';
            btn.classList.remove('active');
        }

        function renderPracticeList() {
            const listContainer = document.getElementById('practice-list');
            listContainer.innerHTML = '';

            words.forEach((word, index) => {
                const rowHTML = `
                    <div class="practice-row">
                        <div class="col-zh">${word.zh}</div>
                        <div class="col-input">
                            <input type="text" class="practice-input" id="p-input-${index}" placeholder="拼寫..." autocomplete="off">
                        </div>
                        <div class="col-ans">
                            <div id="ans-${index}" class="answer-text">
                                ${word.en}
                                <button class="tts-btn" onclick="speakWord('${word.en}')" title="唸出單字" style="padding: 4px 10px; margin: 5px 0 0 0;">🔊</button>
                            </div>
                        </div>
                    </div>
                    <div id="p-mnemonic-${index}" class="practice-mnemonic">
                        💡 <b>記憶提示：</b>${word.mnemonic}
                    </div>
                `;
                listContainer.innerHTML += rowHTML;
            });
        }

        document.getElementById('practice-screen').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') toggleAllAnswers();
        });

        function toggleAllAnswers() {
            const btn = document.getElementById('toggle-all-btn');
            const answers = document.querySelectorAll('.answer-text');
            const inputs = document.querySelectorAll('.practice-input');
            let allCorrect = true;

            areAnswersVisible = !areAnswersVisible;

            if (areAnswersVisible) {
                btn.innerHTML = '隱藏答案繼續練習<br><span style="font-size:0.8em; opacity:0.8;">ㄧㄣˇ ㄘㄤˊ ㄉㄚˊ ㄢˋ</span>';
                btn.classList.add('active');
                answers.forEach(el => el.style.display = 'block');

                inputs.forEach((input, index) => {
                    const userWord = input.value.trim().toLowerCase();
                    const correctWord = words[index].en.toLowerCase();
                    const mnemonicDiv = document.getElementById(`p-mnemonic-${index}`);
                    
                    if (userWord === correctWord) {
                        input.classList.add('correct');
                        input.classList.remove('wrong');
                        mnemonicDiv.style.display = 'none';
                    } else {
                        input.classList.add('wrong');
                        input.classList.remove('correct');
                        mnemonicDiv.style.display = 'block';
                        allCorrect = false;
                    }
                });

                if(allCorrect) playSound('correct'); else playSound('wrong');

            } else {
                btn.innerHTML = '顯示答案與批改<br><span style="font-size:0.8em; opacity:0.8;">ㄒㄧㄢˇ ㄕˋ ㄉㄚˊ ㄢˋ</span>';
                btn.classList.remove('active');
                answers.forEach(el => el.style.display = 'none');
                words.forEach((_, index) => {
                    document.getElementById(`p-mnemonic-${index}`).style.display = 'none';
                });
            }
        }

        /* --- 考試模式邏輯 --- */
        let currentQuestion = 0;
        let score = 0;
        let totalQuestions = 0;
        let questions = [];
        let wrongWords = [];
        let isWaitingToContinue = false;

        function startGame(wordList) {
            questions = [...(wordList || words)];
            totalQuestions = questions.length;
            shuffle(questions);
            currentQuestion = 0;
            score = 0;
            wrongWords = [];
            isWaitingToContinue = false;
            
            document.getElementById('exam-restart').style.display = 'none';
            document.getElementById('exam-retest').style.display = 'none';
            document.getElementById('wrong-words').textContent = '';
            document.getElementById('exam-answer').style.display = 'inline-block';
            document.getElementById('exam-submit').style.display = 'inline-block';
            document.getElementById('mnemonic').style.display = 'none';
            
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }
            const q = questions[currentQuestion];
            isWaitingToContinue = false;
            document.getElementById('mnemonic').style.display = 'none';
            document.getElementById('exam-submit').textContent = '提交答案';
            document.getElementById('question').innerHTML = `請輸入 <b>"${q.zh}"</b> 的英文拼寫`;
            document.getElementById('exam-answer').value = '';
            document.getElementById('exam-result').textContent = '';
            updateScore();
            
            setTimeout(() => document.getElementById('exam-answer').focus(), 50);
        }

        function checkExamAnswer() {
            if (isWaitingToContinue) {
                currentQuestion++;
                nextQuestion();
                return;
            }

            const userAnswer = document.getElementById('exam-answer').value.trim().toLowerCase();
            const q = questions[currentQuestion];
            const correctAnswer = q.en.toLowerCase();

            if (userAnswer === correctAnswer) {
                playSound('correct');
                score++;
                document.getElementById('exam-result').textContent = '✨ 正確！';
                document.getElementById('exam-result').style.color = 'var(--success)';
                setTimeout(() => {
                    currentQuestion++;
                    nextQuestion();
                }, 1000);
            } else {
                playSound('wrong');
                document.getElementById('exam-result').textContent = `❌ 錯誤。答案是：${q.en}`;
                document.getElementById('exam-result').style.color = 'var(--error)';
                
                const mnemonicEl = document.getElementById('mnemonic');
                mnemonicEl.innerHTML = `
                    💡 <b>記憶提示：</b>${q.mnemonic}
                    <br><br>
                    <button class="tts-btn" onclick="speakWord('${q.en}')" style="margin-left: 0;">🔊 唸出正確單字</button>
                `;
                mnemonicEl.style.display = 'block';
                
                document.getElementById('exam-submit').textContent = '下一題';
                wrongWords.push({ zh: q.zh, en: q.en, user: userAnswer, mnemonic: q.mnemonic });
                isWaitingToContinue = true;
            }
            updateScore();
        }

        function updateScore() {
            document.getElementById('score').textContent = `進度: ${currentQuestion + (isWaitingToContinue?1:0)} / ${totalQuestions} | 得分: ${score}`;
        }

        function endGame() {
            document.getElementById('mnemonic').style.display = 'none';
            document.getElementById('question').textContent = '測驗結束！';
            document.getElementById('exam-answer').style.display = 'none';
            document.getElementById('exam-submit').style.display = 'none';
            document.getElementById('exam-result').textContent = `總得分：${score} / ${totalQuestions}`;
            document.getElementById('exam-result').style.color = 'white';
            
            if (score === totalQuestions) {
                playSound('correct');
                document.getElementById('wrong-words').innerHTML = '<span style="color:var(--success); font-size:24px;">🎉 太棒了！妳全部答對！</span>';
            } else {
                let wrongText = '妳需要多練習的單字：\n\n';
                wrongWords.forEach(w => {
                    wrongText += `• ${w.zh}\n  正確: "${w.en}" (妳輸入: "${w.user}")\n`;
                });
                document.getElementById('wrong-words').textContent = wrongText;
                document.getElementById('exam-retest').style.display = 'inline-block';
            }
            document.getElementById('exam-restart').style.display = 'inline-block';
        }

        document.getElementById('exam-submit').addEventListener('click', checkExamAnswer);
        document.getElementById('exam-answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkExamAnswer();
        });
        document.getElementById('exam-restart').addEventListener('click', () => startGame(words));
        document.getElementById('exam-retest').addEventListener('click', () => {
            if (wrongWords.length > 0) {
                const retestWords = wrongWords.map(w => ({ en: w.en, zh: w.zh, mnemonic: w.mnemonic }));
                startGame(retestWords);
            }
        });
    </script>
</body>
</html>
