<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單字練習與測驗 - P2 Week 5 & 6</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2e;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-purple: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    ruby { ruby-position: over; }
    rt { font-size: 0.55em; color: var(--accent-cyan); letter-spacing: 1px; }

    header {
      text-align: center;
      padding: 24px 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      margin-bottom: 8px;
    }
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }
    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .nav-btn.active, .nav-btn:hover {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
    }

    .container { max-width: 900px; margin: 0 auto; }

    /* Sticky toolbar in practice mode */
    .toolbar {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .action-btn {
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: transform 0.15s, opacity 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .action-btn:hover { transform: translateY(-2px); opacity: 0.95; }
    .btn-all { background: linear-gradient(135deg, #f59e0b, #ef4444); }
    .btn-reset { background: #475569; }
    .btn-speak { background: #3b82f6; }
    .btn-hint { background: #10b981; }

    /* Card list */
    .word-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .word-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .word-card:hover {
      border-color: var(--accent-cyan);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .chinese-def {
      font-size: 1.3rem;
      font-weight: bold;
      color: #f1f5f9;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(139, 92, 246, 0.2);
      color: #c084fc;
      border: 1px solid rgba(139, 92, 246, 0.4);
      margin-left: 8px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input-field {
      flex: 1;
      background: #0b0f19;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      color: #fff;
      font-size: 1.1rem;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
    }
    .reveal-box {
      display: none;
      background: rgba(11, 15, 25, 0.7);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 6px;
    }
    .reveal-box.show { display: block; }
    .correct-answer {
      font-size: 1.15rem;
      color: #38bdf8;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .mnemonic-box {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .mnemonic-box span { color: var(--accent-amber); font-weight: bold; }

    /* Exam Mode */
    .exam-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      max-width: 600px;
      margin: 20px auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .exam-progress {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .exam-question {
      font-size: 2.2rem;
      margin: 25px 0;
      color: #f8fafc;
    }
    .exam-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.3rem;
      text-align: center;
      background: #0b0f19;
      border: 2px solid var(--border);
      border-radius: 12px;
      color: white;
      margin-bottom: 20px;
      outline: none;
    }
    .exam-input:focus { border-color: var(--accent-cyan); }
    .exam-result {
      margin-top: 20px;
      font-size: 1.1rem;
      min-height: 50px;
    }
    .score-banner {
      font-size: 2rem;
      color: var(--accent-amber);
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ <ruby>單<rt>ㄉㄢ</rt>字<rt>ㄗˋ</rt></ruby><ruby>大<rt>ㄉㄚˋ</rt></ruby><ruby>冒<rt>ㄇㄠˋ</rt>險<rt>ㄒㄧㄢˇ</rt></ruby> (P2 Week 5 & 6) ✨</h1>
    <p style="color: var(--text-muted); margin-top: 6px;">
      <ruby>親<rt>ㄑㄧㄣ</rt>愛<rt>ㄞˋ</rt></ruby><ruby>的<rt>˙ㄉㄜ</rt></ruby><ruby>寧<rt>ㄋㄧㄥˊ</rt>寧<rt>ㄋㄧㄥˊ</rt></ruby>，<ruby>一<rt>ㄧ</rt>起<rt>ㄑㄧˇ</rt></ruby><ruby>快<rt>ㄎㄨㄞˋ</rt>樂<rt>ㄌㄜˋ</rt></ruby><ruby>背<rt>ㄅㄟˋ</rt></ruby><ruby>單<rt>ㄉㄢ</rt>字<rt>ㄗˋ</rt></ruby>！
    </p>
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchMode('practice')">
        📝 <ruby>我<rt>ㄨㄛˇ</rt></ruby><ruby>要<rt>ㄧㄠˋ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt>習<rt>ㄒㄧˊ</rt></ruby>
      </button>
      <button class="nav-btn" onclick="switchMode('exam')">
        🎯 <ruby>開<rt>ㄎㄞ</rt>始<rt>ㄕˇ</rt></ruby><ruby>考<rt>ㄎㄠˇ</rt>試<rt>ㄕˋ</rt></ruby>
      </button>
    </div>
  </header>

  <div class="container">
    <!-- 練習模式 -->
    <div id="practice-section">
      <div class="toolbar">
        <div>
          <span style="color: var(--accent-cyan); font-weight: bold;">📚 共 <span id="word-count">0</span> 個單字</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="action-btn btn-all" onclick="revealAllPractice()">
            🚀 <ruby>一<rt>ㄧ</rt>鍵<rt>ㄐㄧㄢˋ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt>布<rt>ㄅㄨˋ</rt></ruby><ruby>全<rt>ㄑㄩㄢˊ</rt>部<rt>ㄅㄨˋ</rt></ruby>
          </button>
          <button class="action-btn btn-reset" onclick="resetPractice()">
            🧹 <ruby>清<rt>ㄑㄧㄥ</rt>空<rt>ㄎㄨㄥ</rt></ruby><ruby>重<rt>ㄔㄨㄥˊ</rt>練<rt>ㄌㄧㄢˋ</rt></ruby>
          </button>
        </div>
      </div>
      <div class="word-grid" id="practice-list"></div>
    </div>

    <!-- 測驗模式 -->
    <div id="exam-section" style="display: none;">
      <div class="exam-container" id="exam-box">
        <div class="exam-progress" id="exam-progress"></div>
        <div class="exam-question" id="exam-question"></div>
        <input type="text" id="exam-input" class="exam-input" placeholder="請輸入英文單字..." autocomplete="off">
        <div>
          <button class="action-btn btn-hint" style="font-size: 1.1rem; padding: 12px 30px;" onclick="checkExamAnswer()">
            確定送出
          </button>
        </div>
        <div class="exam-result" id="exam-result"></div>
      </div>
    </div>
  </div>

      { word: "leap", zhRuby: "<ruby>飛<rt>ㄈㄟ</rt>躍<rt>ㄩㄝˋ</rt></ruby>", unit: "W6 Reach", mnemonicRuby: "<span>記憶訣竅：</span><ruby>青<rt>ㄑㄧㄥ</rt>蛙<rt>ㄨㄚ</rt><ruby>在<rt>ㄗㄞˋ</rt>荷<rt>ㄏㄜˊ</rt><ruby>葉<rt>ㄧㄝˋ</rt> leaf <ruby>上<rt>ㄕㄤˋ</rt>大<rt>ㄉㄚˋ</rt><ruby>步<rt>ㄅㄨˋ</rt> leap (<ruby>飛<rt>ㄈㄟ</rt>躍<rt>ㄩㄝˋ</rt>)！" },
      { word: "catch", zhRuby: "<ruby>接<rt>ㄐㄧㄝ</rt>住<rt>ㄓㄨˋ</rt> / <ruby>抓<rt>ㄓㄨㄚ</rt></ruby>", unit: "W6 Reach", mnemonicRuby: "<span>記憶訣竅：</span>cat (<ruby>貓<rt>ㄇㄠ</rt>) + ch = <ruby>貓<rt>ㄇㄠ</rt>咪<rt>ㄇㄧ</rt><ruby>伸<rt>ㄕㄣ</rt>爪<rt>ㄓㄠˇ</rt><ruby>抓<rt>ㄓㄨㄚ</rt><ruby>接<rt>ㄐㄧㄝ</rt><ruby>球<rt>ㄑㄧㄡˊ</rt>。" },
      { word: "food", zhRuby: "<ruby>食<rt>ㄕˊ</rt>物<rt>ㄨˋ</rt></ruby>", unit: "W6 Reach", mnemonicRuby: "<span>記憶訣竅：</span>good (<ruby>棒<rt>ㄅㄤˋ</rt>) <ruby>的<rt>˙ㄉㄜ</rt> food (<ruby>美<rt>ㄇㄟˇ</rt>食<rt>ㄕˊ</rt>) <ruby>讓<rt>ㄖㄤˋ</rt><ruby>人<rt>ㄖㄣˊ</rt><ruby>心<rt>ㄒㄧㄣ</rt><ruby>情<rt>ㄑㄧㄥˊ</rt><ruby>超<rt>ㄔㄠ</rt><ruby>開<rt>ㄎㄞ</rt>心<rt>ㄒㄧㄣ</rt>。" },

      // Week 6 - Phonics
      { word: "coin", zhRuby: "<ruby>硬<rt>ㄧㄥˋ</rt>幣<rt>ㄅㄧˋ</rt></ruby>", unit: "W6 Phonics", mnemonicRuby: "<span>記憶訣竅：</span><ruby>投<rt>ㄊㄡˊ</rt><ruby>一<rt>ㄧ</rt><ruby>枚<rt>ㄇㄟˊ</rt> coin <ruby>進<rt>ㄐㄧㄣˋ</rt><ruby>存<rt>ㄘㄨㄣˊ</rt><ruby>錢<rt>ㄑㄧㄢˊ</rt><ruby>筒<rt>ㄊㄨㄥˇ</rt>「<ruby>叮<rt>ㄉㄧㄥ</rt>咚<rt>ㄉㄨㄥ</rt>」！" },
      { word: "soil", zhRuby: "<ruby>泥<rt>ㄋㄧˊ</rt>土<rt>ㄊㄨˇ</rt></ruby>", unit: "W6 Phonics", mnemonicRuby: "<span>記憶訣竅：</span>oil (<ruby>油<rt>ㄧㄡˊ</rt>) <ruby>滴<rt>ㄉㄧ</rt><ruby>進<rt>ㄐㄧㄣˋ</rt> s (<ruby>土<rt>ㄊㄨˇ</rt>地<rt>ㄉㄧˋ</rt>) = soil (<ruby>泥<rt>ㄋㄧˊ</rt>土<rt>ㄊㄨˇ</rt>)。" },
      { word: "toy", zhRuby: "<ruby>玩<rt>ㄨㄢˊ</rt>具<rt>ㄐㄩˋ</rt></ruby>", unit: "W6 Phonics", mnemonicRuby: "<span>記憶訣竅：</span>joy (<ruby>快<rt>ㄎㄨㄞˋ</rt>樂<rt>ㄌㄜˋ</rt>) + toy (<ruby>玩<rt>ㄨㄢˊ</rt>具<rt>ㄐㄩˋ</rt>)，<ruby>玩<rt>ㄨㄢˊ</rt>玩具<ruby>充<rt>ㄔㄨㄥ</rt>滿<rt>ㄇㄢˇ</rt><ruby>歡<rt>ㄏㄨㄢ</rt>樂<rt>ㄌㄜˋ</rt>。" },
      { word: "boy", zhRuby: "<ruby>男<rt>ㄋㄢˊ</rt>孩<rt>ㄏㄞˊ</rt></ruby>", unit: "W6 Phonics", mnemonicRuby: "<span>記憶訣竅：</span>little boy (<ruby>小<rt>ㄒㄧㄠˇ</rt><ruby>男<rt>ㄋㄢˊ</rt>孩<rt>ㄏㄞˊ</rt>) <ruby>最<rt>ㄗㄨㄟˋ</rt>喜歡 toy (<ruby>玩<rt>ㄨㄢˊ</rt>具<rt>ㄐㄩˋ</rt>)。" },

      // Week 6 - GEPT
      { word: "lamp", zhRuby: "<ruby>檯<rt>ㄊㄞˊ</rt>燈<rt>ㄉㄥ</rt></ruby>", unit: "W6 GEPT", mnemonicRuby: "<span>記憶訣竅：</span><ruby>開<rt>ㄎㄞ</rt><ruby>起<rt>ㄑㄧˇ</rt> lamp，<ruby>照<rt>ㄓㄠˋ</rt>亮<rt>ㄌㄧㄤˋ</rt><ruby>書<rt>ㄕㄨ</rt>桌<rt>ㄓㄨㄛ</rt><ruby>好<rt>ㄏㄠˇ</rt><ruby>讀<rt>ㄉㄨˊ</rt>書<rt>ㄕㄨ</rt>。" },
      { word: "alive", zhRuby: "<ruby>活<rt>ㄏㄨㄛˊ</rt>著<rt>˙ㄓㄜ</rt>的<rt>˙ㄉㄜ</rt></ruby>", unit: "W6 GEPT", mnemonicRuby: "<span>記憶訣竅：</span>a + live (<ruby>生<rt>ㄕㄥ</rt>活<rt>ㄏㄨㄛˊ</rt>) = <ruby>充<rt>ㄔㄨㄥ</rt>滿<rt>ㄇㄢˇ</rt><ruby>生<rt>ㄕㄥ</rt>命<rt>ㄇㄧㄥˋ</rt>力<rt>ㄌㄧˋ</rt>、<ruby>活<rt>ㄏㄨㄛˊ</rt>著<rt>˙ㄓㄜ</rt>的<rt>˙ㄉㄜ</rt>。" },
      { word: "busy", zhRuby: "<ruby>忙<rt>ㄇㄤˊ</rt>碌<rt>ㄌㄨˋ</rt>的<rt>˙ㄉㄜ</rt></ruby>", unit: "W6 GEPT", mnemonicRuby: "<span>記憶訣竅：</span>business (<ruby>生<rt>ㄕㄥ</rt>意<rt>ㄧˋ</rt>) <ruby>很<rt>ㄏㄣˇ</rt>多<rt>ㄉㄨㄛ</rt>的人非常 busy (<ruby>忙<rt>ㄇㄤˊ</rt>碌<rt>ㄌㄨˋ</rt>)。" },
      { word: "dentist", zhRuby: "<ruby>牙<rt>ㄧㄚˊ</rt>醫<rt>ㄧ</rt></ruby>", unit: "W6 GEPT", mnemonicRuby: "<span>記憶訣竅：</span>dent (<ruby>凹<rt>ㄠ</rt>痕<rt>ㄏㄣˊ</rt>、<ruby>蛀<rt>ㄓㄨˋ</rt>牙<rt>ㄧㄚˊ</rt>) + ist (<ruby>專<rt>ㄓㄨㄢ</rt>家<rt>ㄐㄧㄚ</rt>) = <ruby>專<rt>ㄓㄨㄢ</rt>治<rt>ㄓˋ</rt><ruby>蛀<rt>ㄓㄨˋ</rt>牙<rt>ㄧㄚˊ</rt>的<rt>˙ㄉㄜ</rt><ruby>牙<rt>ㄧㄚˊ</rt>醫<rt>ㄧ</rt>！" },
      { word: "burn", zhRuby: "<ruby>燃<rt>ㄖㄢˊ</rt>燒<rt>ㄕㄠ</rt> / <ruby>燙<rt>ㄊㄤˋ</rt>傷<rt>ㄕㄤ</rt></ruby>", unit: "W6 GEPT", mnemonicRuby: "<span>記憶訣竅：</span>sunburn (<ruby>曬<rt>ㄕㄞˋ</rt>傷<rt>ㄕㄤ</rt>)，<ruby>大<rt>ㄉㄚˋ</rt><ruby>火<rt>ㄏㄨㄛˇ</rt><ruby>在<rt>ㄗㄞˋ</rt> burn (<ruby>燃<rt>ㄖㄢˊ</rt>燒<rt>ㄕㄠ</rt>)。" }
    ];

    // 發音功能 (TTS)
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      } else {
        alert('您的瀏覽器不支援語音播放喔！');
      }
    }

    // 渲染練習模式清單
    function renderPracticeList() {
      const listEl = document.getElementById('practice-list');
      document.getElementById('word-count').innerText = wordData.length;
      listEl.innerHTML = '';

      wordData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'word-card';
        card.id = `practice-card-${index}`;
        card.innerHTML = `
          <div class="card-top">
            <div class="chinese-def">
              ${item.zhRuby}
              <span class="badge">${item.unit}</span>
            </div>
            <div class="card-actions">
              <!-- 按鍵 1: 發音按鍵 -->
              <button class="action-btn btn-speak" onclick="speak('${item.word}')">
                🔊 <ruby>發<rt>ㄈㄚ</rt>音<rt>ㄧㄣ</rt></ruby>
              </button>
              <!-- 按鍵 2: 公布答案與訣竅 -->
              <button class="action-btn btn-hint" onclick="toggleReveal(${index})">
                💡 <ruby>公<rt>ㄍㄨㄥ</rt>布<rt>ㄅㄨˋ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt>案<rt>ㄢˋ</rt></ruby><ruby>與<rt>ㄩˇ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt>竅<rt>ㄑㄧㄠˋ</rt></ruby>
              </button>
            </div>
          </div>
          <div class="input-row">
            <input type="text" class="input-field" id="p-input-${index}" placeholder="輸入英文背背看..." oninput="checkPracticeInput(${index})">
            <span id="p-status-${index}" style="font-size: 1.3rem;"></span>
          </div>
          <div class="reveal-box" id="reveal-${index}">
            <div class="correct-answer">正確拼音：${item.word}</div>
            <div class="mnemonic-box">${item.mnemonicRuby}</div>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    // 單張單字卡公布/隱藏
    function toggleReveal(index) {
      const box = document.getElementById(`reveal-${index}`);
      box.classList.toggle('show');
    }

    // 即時檢查練習輸入
    function checkPracticeInput(index) {
      const input = document.getElementById(`p-input-${index}`);
      const status = document.getElementById(`p-status-${index}`);
      const val = input.value.trim().toLowerCase();
      const target = wordData[index].word.toLowerCase();

      if (val === '') {
        status.innerText = '';
      } else if (val === target) {
        status.innerText = '✅';
        document.getElementById(`reveal-${index}`).classList.add('show');
      } else {
        status.innerText = '✍️';
      }
    }

    // 一鍵公布全部
    function revealAllPractice() {
      wordData.forEach((_, index) => {
        const box = document.getElementById(`reveal-${index}`);
        box.classList.add('show');
      });
    }

    // 清空重練
    function resetPractice() {
      wordData.forEach((_, index) => {
        const input = document.getElementById(`p-input-${index}`);
        const status = document.getElementById(`p-status-${index}`);
        const box = document.getElementById(`reveal-${index}`);
        input.value = '';
        status.innerText = '';
        box.classList.remove('show');
      });
    }

    // 測驗模式狀態
    let examWords = [];
    let examIndex = 0;
    let score = 0;
    let wrongWords = [];

    function switchMode(mode) {
      const practiceSection = document.getElementById('practice-section');
      const examSection = document.getElementById('exam-section');
      const tabs = document.querySelectorAll('.nav-btn');

      if (mode === 'practice') {
        practiceSection.style.display = 'block';
        examSection.style.display = 'none';
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
      } else {
        practiceSection.style.display = 'none';
        examSection.style.display = 'block';
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
        startExam();
      }
    }

    // 開始測驗
    function startExam(customList = null) {
      examWords = customList ? [...customList] : [...wordData];
      // 洗牌
      for (let i = examWords.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [examWords[i], examWords[j]] = [examWords[j], examWords[i]];
      }
      examIndex = 0;
      score = 0;
      wrongWords = [];
      showExamQuestion();
    }

    function showExamQuestion() {
      const resultEl = document.getElementById('exam-result');
      resultEl.innerHTML = '';
      const inputEl = document.getElementById('exam-input');
      inputEl.value = '';
      inputEl.disabled = false;

      if (examIndex >= examWords.length) {
        // 測驗結束結算
        const box = document.getElementById('exam-box');
        let reviewBtn = '';
        if (wrongWords.length > 0) {
          reviewBtn = `<button class="action-btn btn-all" style="margin-top: 15px;" onclick="startExam(wrongWords)">🔁 重新測驗錯題 (${wrongWords.length} 題)</button>`;
        }
        box.innerHTML = `
          <div class="score-banner">🎉 測驗完成！</div>
          <p style="font-size: 1.3rem; margin-bottom: 15px;">得分：<strong style="color: var(--accent-cyan);">${score}</strong> / ${examWords.length}</p>
          <p style="color: var(--text-muted);">${wrongWords.length === 0 ? '太厲害了！全部答對！一百分！💯' : '有錯的單字不要灰心，再練一次會更棒喔！🌟'}</p>
          <div style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
            <button class="action-btn btn-speak" onclick="startExam()">🔄 重新全部測驗</button>
            ${reviewBtn}
          </div>
        `;
        return;
      }

      const cur = examWords[examIndex];
      document.getElementById('exam-progress').innerText = `題目：第 ${examIndex + 1} 題 / 共 ${examWords.length} 題`;
      document.getElementById('exam-question').innerHTML = cur.zhRuby;
      setTimeout(() => inputEl.focus(), 50);
    }

    function checkExamAnswer() {
      const inputEl = document.getElementById('exam-input');
      const val = inputEl.value.trim().toLowerCase();
      const cur = examWords[examIndex];
      const resultEl = document.getElementById('exam-result');

      if (!val) return;

      if (val === cur.word.toLowerCase()) {
        score++;
        speak(cur.word);
        resultEl.innerHTML = `<span style="color: #4ade80; font-weight: bold;">🎉 太棒了，答對了！</span>`;
        inputEl.disabled = true;
        setTimeout(() => {
          examIndex++;
          showExamQuestion();
        }, 1100);
      } else {
        wrongWords.push(cur);
        speak(cur.word);
        resultEl.innerHTML = `
          <div style="color: #f87171; font-weight: bold; margin-bottom: 6px;">❌ 哎呀，拼錯囉！正確答案是：<strong>${cur.word}</strong></div>
          <div style="font-size: 0.9rem; color: var(--text-muted);">${cur.mnemonicRuby}</div>
          <button class="action-btn btn-speak" style="margin-top: 12px;" onclick="examIndex++; showExamQuestion();">下一題 ➡️</button>
        `;
        inputEl.disabled = true;
      }
    }

    // 支援 Enter 鍵送出
    document.getElementById('exam-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkExamAnswer();
    });

    // 初始化頁面
    window.onload = () => {
      renderPracticeList();
    };
  </script>
</body>
</html>
