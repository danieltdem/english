<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寧寧的頂級單字挑戰</title>
    <style>
        /* 電影級視覺標準 & 現代配色 */
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(25, 25, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-glow: rgba(0, 212, 255, 0.6);
            --correct-color: #00e676;
            --wrong-color: #ff3d00;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, var(--bg-color) 100%);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* 擬真 PBR 玻璃面板容器 */
        .container {
            text-align: center;
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 滾動條美化 */
        .container::-webkit-scrollbar { width: 8px; }
        .container::-webkit-scrollbar-track { background: transparent; }
        .container::-webkit-scrollbar-thumb { background-color: #444; border-radius: 4px; }

        h1 {
            font-size: 2.2rem;
            margin-top: 0;
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        /* 按鈕視覺特效 */
        button {
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            color: white;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
            filter: brightness(1.1);
        }
        button:active { transform: translateY(1px) scale(0.97); }

        .tts-btn {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
        }

        .menu-btn { width: 80%; background: linear-gradient(135deg, #f12711, #f5af19); }
        .exam-btn { background: linear-gradient(135deg, #00b09b, #96c93d); }
        
        .exam-input {
            padding: 15px;
            font-size: 20px;
            width: 75%;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.4);
            border: 2px solid #444;
            color: white;
            border-radius: 10px;
            text-align: center;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .exam-input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.4);
        }

        #mnemonic {
            font-size: 16px;
            margin-top: 15px;
            color: #e0f7fa;
            text-align: left;
            padding: 20px;
            border-left: 4px solid #00d2ff;
            border-radius: 0 8px 8px 0;
            background: rgba(0, 210, 255, 0.1);
            line-height: 1.6;
        }

        /* 練習模式專屬 */
        #practice-screen { display: none; padding: 0; }
        .practice-fixed-top {
            background: rgba(20, 20, 25, 0.95);
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .practice-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .col-zh { width: 35%; text-align: left; font-size: 16px; color: #ffca28; }
        .col-input { width: 35%; }
        .col-ans { width: 30%; text-align: right; color: var(--correct-color); font-weight: bold; font-size: 18px;}
        
        .practice-input {
            width: 90%; padding: 10px; font-size: 16px;
            background: rgba(0,0,0,0.5); color: white;
            border: 1px solid #555; border-radius: 6px;
            transition: all 0.3s;
        }
        .practice-input.correct { border-color: var(--correct-color); background: rgba(0, 230, 118, 0.1); box-shadow: 0 0 10px rgba(0,230,118,0.3); }
        .practice-input.wrong { border-color: var(--wrong-color); background: rgba(255, 61, 0, 0.1); box-shadow: 0 0 10px rgba(255,61,0,0.3); }

        .practice-mnemonic {
            display: none; font-size: 14px; color: #b3e5fc;
            text-align: left; background: rgba(255,255,255,0.05);
            padding: 15px; margin: 0 20px 15px 20px; border-radius: 8px;
        }
        
        /* 圖示區 */
        .icon-display { font-size: 80px; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); }
    </style>
</head>
<body>

    <!-- 1. 首頁選單 -->
    <div id="menu-screen" class="container">
        <div class="icon-display">✨</div>
        <h1>寧寧的頂級單字挑戰</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">準備好迎接全新的學習體驗了嗎？</p>
        <button class="menu-btn" onclick="goToExam()">開始考試</button>
        <button class="menu-btn" onclick="goToPractice()" style="background: linear-gradient(135deg, #8e2de2, #4a00e0);">我要練習</button>
    </div>

    <!-- 2. 考試模式 -->
    <div id="exam-screen" class="container" style="display: none;">
        <div id="game-icon" class="icon-display">📝</div>
        <h1>單字拼寫測驗</h1>
        <div id="question" style="font-size: 24px; margin: 25px 0; color: #fff;"></div>
        <input type="text" id="exam-answer" class="exam-input" placeholder="輸入英文拼寫 (大小寫皆可)" autocomplete="off">
        <br>
        <button id="exam-submit" class="exam-btn">提交答案</button>
        <div id="exam-result" style="font-size: 22px; margin-top: 20px; font-weight: bold;"></div>
        <div id="mnemonic" style="display: none;"></div>
        <div id="score" style="font-size: 18px; margin-top: 15px; color: var(--text-muted);">分數: 0 / 0</div>
        <div id="wrong-words" style="text-align: left; white-space: pre-wrap; margin-top: 20px; color: #ff8a65;"></div>
        
        <button id="exam-restart" class="exam-btn" style="display: none;">重新開始</button>
        <button id="exam-retest" class="exam-btn" style="display: none; background: #ff9800;">重測錯題</button>
        <button onclick="goHome()" style="background: #555; margin-top: 25px;">回首頁</button>
    </div>

    <!-- 3. 練習模式 -->
    <div id="practice-screen" class="container">
        <div class="practice-fixed-top">
            <h2 style="color: #00d2ff; margin: 0 0 15px 0;">單字練習室</h2>
            <div style="display: flex; gap: 10px;">
                <button onclick="goHome()" style="background: #555; width: 30%;">回首頁</button>
                <button id="toggle-all-btn" onclick="toggleAllAnswers()" style="width: 70%; background: linear-gradient(135deg, #e52d27, #b31217);">顯示所有答案 / 批改</button>
            </div>
        </div>
        <div id="practice-list-container" style="padding-bottom: 20px;">
            <div id="practice-list"></div>
        </div>
    </div>

    <script>
        // Web Audio API 音效引擎 (高質感聽覺回饋)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // 為所有按鈕綁定點擊音效
        document.addEventListener('click', (e) => {
            if(e.target.tagName === 'BUTTON') playSound('click');
        });

        // 全新的 15 個單字庫 (已配上高質量記憶法)
        const words = [
            { en: 'fantasy', zh: '幻想', mnemonic: '諧音「芬達(Fanta) + sy」。想像你喝著甜甜的芬達汽水，沉浸在美好的「幻想」中。' },
            { en: 'worry', zh: '擔心', mnemonic: '發音類似「war (戰爭)」。發生戰爭時，每個人都會非常「擔心」安全。' },
            { en: 'wonder', zh: '想知道 / 驚奇', mnemonic: '字首「won」像 win (贏) 的過去式。贏了比賽後，大家都「想知道」秘訣是什麼，覺得很「驚奇」。' },
            { en: 'extra', zh: '額外的', mnemonic: '諧音「X + tra (train 火車)」。想像這是一班「額外」加開的神秘X號火車。' },
            { en: 'go wading', zh: '涉水而行', mnemonic: '「wade」發音像「wait (等待)」。在淹水的地方「涉水」前進時，走得很慢就像在等待一樣。' },
            { en: 'late', zh: '遲到的', mnemonic: '諧音「累的」。因為昨天太累睡過頭，所以今天「遲到」了。' },
            { en: 'teacher', zh: '老師', mnemonic: '「teach (教導)」+「er (的人)」。專門教導別人的人就是「老師」。' },
            { en: 'tractor', zh: '拖拉機', mnemonic: '「tract (拉/拖)」+「or (機器)」。在農田裡用來拖拉重物的機器就是「拖拉機」。' },
            { en: 'doctor', zh: '醫生', mnemonic: '字根 doc 有「教導」之意。在醫院裡指導病人恢復健康的人就是「醫生」。' },
            { en: 'sister', zh: '姊妹', mnemonic: '諧音「西施 + 特」。像古代美女西施一樣特別漂亮的女孩，是我的好「姊妹」。' },
            { en: 'knife', zh: '刀子', mnemonic: '字首 k 不發音，音近「奈夫」。想像一個名叫奈夫的刺客，手裡總是拿著一把銳利的「刀子」。' },
            { en: 'later', zh: '稍後', mnemonic: '「late (遲)」+「r (比較級)」。比原本預定的時間還要晚，就是「稍後」。' },
            { en: 'adopt', zh: '收養 / 採納', mnemonic: '「opt」有「選擇」的意思。你「選擇 (opt)」把一個可愛的流浪動物帶回家「收養」。' },
            { en: 'blood', zh: '血液', mnemonic: '發音和「flood (洪水)」押韻。受傷時，「血液」像小洪水一樣流出來。' },
            { en: 'cash', zh: '現金', mnemonic: '發音像「catch (抓)」。看到天上掉下來的「現金」，大家都會想伸手去抓 (catch)！' }
        ];

        // 語音朗讀 API
        function speakWord(word, e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 安全洗牌演算法
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /* --- 頁面切換 --- */
        function goHome() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'none';
        }

        function goToExam() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'block';
            startGame(words);
        }

        function goToPractice() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'block';
            renderPracticeList();
            resetPracticeState();
        }

        /* --- 練習模式 --- */
        let areAnswersVisible = false;

        function resetPracticeState() {
            areAnswersVisible = false;
            const btn = document.getElementById('toggle-all-btn');
            btn.textContent = '顯示所有答案 / 批改';
            btn.style.background = 'linear-gradient(135deg, #e52d27, #b31217)';
        }

        function renderPracticeList() {
            const listContainer = document.getElementById('practice-list');
            listContainer.innerHTML = '';
            words.forEach((word, index) => {
                listContainer.innerHTML += `
                    <div class="practice-row">
                        <div class="col-zh">${word.zh}</div>
                        <div class="col-input">
                            <input type="text" class="practice-input" id="p-input-${index}" placeholder="拼寫..." autocomplete="off">
                        </div>
                        <div class="col-ans">
                            <div id="ans-${index}" style="display:none; display:flex; flex-direction:column; align-items:flex-end;">
                                <span>${word.en}</span>
                                <button class="tts-btn" onclick="speakWord('${word.en}', event)" style="margin-top:5px; padding:4px 10px;">🔊 唸出</button>
                            </div>
                        </div>
                    </div>
                    <div id="p-mnemonic-${index}" class="practice-mnemonic">💡 <b>記憶提示：</b>${word.mnemonic}</div>
                `;
            });
        }

        document.getElementById('practice-list-container').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') toggleAllAnswers();
        });

        function toggleAllAnswers() {
            const btn = document.getElementById('toggle-all-btn');
            areAnswersVisible = !areAnswersVisible;

            words.forEach((word, index) => {
                const ansDiv = document.getElementById(`ans-${index}`);
                const input = document.getElementById(`p-input-${index}`);
                const mnemonic = document.getElementById(`p-mnemonic-${index}`);
                
                if (areAnswersVisible) {
                    ansDiv.style.display = 'flex';
                    const userWord = input.value.trim().toLowerCase();
                    if (userWord === word.en.toLowerCase()) {
                        input.className = 'practice-input correct';
                        mnemonic.style.display = 'none';
                    } else {
                        input.className = 'practice-input wrong';
                        mnemonic.style.display = 'block';
                    }
                } else {
                    ansDiv.style.display = 'none';
                    input.className = 'practice-input';
                    mnemonic.style.display = 'none';
                }
            });

            if (areAnswersVisible) {
                btn.textContent = '隱藏所有答案';
                btn.style.background = 'linear-gradient(135deg, #11998e, #38ef7d)';
                playSound('correct'); // 批改完成音效
            } else {
                btn.textContent = '顯示所有答案 / 批改';
                btn.style.background = 'linear-gradient(135deg, #e52d27, #b31217)';
            }
        }

        /* --- 考試模式 --- */
        let currentQuestion = 0, score = 0, totalQuestions = 0;
        let questions = [], wrongWords = [], isWaitingToContinue = false;

        function startGame(wordList) {
            questions = [...wordList];
            totalQuestions = questions.length;
            shuffle(questions);
            currentQuestion = score = 0;
            wrongWords = [];
            isWaitingToContinue = false;
            
            document.getElementById('exam-restart').style.display = 'none';
            document.getElementById('exam-retest').style.display = 'none';
            document.getElementById('wrong-words').textContent = '';
            document.getElementById('exam-answer').style.display = 'inline-block';
            document.getElementById('exam-submit').style.display = 'inline-block';
            document.getElementById('game-icon').textContent = '📝';
            document.getElementById('mnemonic').style.display = 'none';
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) return endGame();
            const q = questions[currentQuestion];
            document.getElementById('mnemonic').style.display = 'none';
            isWaitingToContinue = false;
            document.getElementById('exam-submit').textContent = '提交答案';
            document.getElementById('question').innerHTML = `請輸入 <b>"${q.zh}"</b> 的英文：`;
            document.getElementById('exam-answer').value = '';
            document.getElementById('exam-result').textContent = '';
            document.getElementById('game-icon').textContent = '🤔';
            updateScore();
            setTimeout(() => document.getElementById('exam-answer').focus(), 50);
        }

        function checkExamAnswer() {
            if (isWaitingToContinue) return nextQuestion();

            const userAnswer = document.getElementById('exam-answer').value.trim().toLowerCase();
            const q = questions[currentQuestion];

            if (userAnswer === q.en.toLowerCase()) {
                score++;
                playSound('correct');
                document.getElementById('exam-result').textContent = '🎉 正確！';
                document.getElementById('exam-result').style.color = 'var(--correct-color)';
                document.getElementById('game-icon').textContent = '✅';
                setTimeout(() => { currentQuestion++; nextQuestion(); }, 1200);
            } else {
                playSound('wrong');
                document.getElementById('exam-result').innerHTML = `❌ 錯誤。<br>正確答案是：<b>${q.en}</b>`;
                document.getElementById('exam-result').style.color = 'var(--wrong-color)';
                document.getElementById('game-icon').textContent = '💥';
                
                const mnemonicEl = document.getElementById('mnemonic');
                mnemonicEl.innerHTML = `💡 <b>記憶提示：</b>${q.mnemonic}<br><br>
                    <button class="tts-btn" onclick="speakWord('${q.en}')">🔊 唸出單字</button>`;
                mnemonicEl.style.display = 'block';
                
                document.getElementById('exam-submit').textContent = '繼續下一題';
                wrongWords.push({ ...q, user: userAnswer });
                isWaitingToContinue = true;
                currentQuestion++;
            }
            updateScore();
        }

        function updateScore() {
            document.getElementById('score').textContent = `進度: ${currentQuestion + (isWaitingToContinue?0:1)} / ${totalQuestions} | 分數: ${score}`;
        }

        function endGame() {
            document.getElementById('mnemonic').style.display = 'none';
            document.getElementById('question').textContent = '測驗結束！';
            document.getElementById('exam-answer').style.display = 'none';
            document.getElementById('exam-submit').style.display = 'none';
            document.getElementById('exam-result').textContent = `最終分數：${score} / ${totalQuestions}`;
            document.getElementById('exam-result').style.color = '#fff';
            
            if (score === totalQuestions) {
                document.getElementById('game-icon').textContent = '🏆';
                document.getElementById('wrong-words').textContent = '太棒了！妳全部答對了！';
                document.getElementById('wrong-words').style.color = 'var(--correct-color)';
            } else {
                document.getElementById('game-icon').textContent = '💪';
                let wrongText = '需要再複習的單字：\n\n';
                wrongWords.forEach(w => { wrongText += `• ${w.zh} ➔ 正確: ${w.en} (妳輸入: ${w.user || '空白'})\n`; });
                document.getElementById('wrong-words').textContent = wrongText;
                document.getElementById('wrong-words').style.color = '#ffb74d';
                document.getElementById('exam-retest').style.display = 'inline-block';
            }
            document.getElementById('exam-restart').style.display = 'inline-block';
        }

        document.getElementById('exam-submit').addEventListener('click', checkExamAnswer);
        document.getElementById('exam-answer').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkExamAnswer(); });
        document.getElementById('exam-restart').addEventListener('click', () => startGame(words));
        document.getElementById('exam-retest').addEventListener('click', () => { if (wrongWords.length > 0) startGame(wrongWords); });

    </script>
</body>
</html>
