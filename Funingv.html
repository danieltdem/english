<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寧寧的電影級單字挑戰</title>
    <style>
        /* --- 電影級色調與全域設定 --- */
        :root {
            --bg-color-1: #0f2027;
            --bg-color-2: #203a43;
            --bg-color-3: #2c5364;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #e0f7fa;
            --text-accent: #00e5ff;
            --btn-hover: rgba(0, 229, 255, 0.2);
            --correct-color: #00e676;
            --wrong-color: #ff5252;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- PBR 磨砂玻璃材質容器 --- */
        .container {
            text-align: center;
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 0 15px rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--text-accent) transparent;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        h1, h2 { color: var(--text-accent); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }

        /* --- 現代按鈕設計 (霓虹柔光) --- */
        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            background: var(--btn-hover);
            border-color: var(--text-accent);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            transform: translateY(-2px);
        }
        button:active { transform: translateY(1px); }

        /* 發音按鈕特製 */
        .tts-btn {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--text-accent);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
        }

        /* --- 輸入框 PBR 視覺優化 --- */
        input[type="text"] {
            padding: 12px;
            font-size: 18px;
            width: 70%;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        input[type="text"]:focus {
            border-color: var(--text-accent);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3), inset 0 2px 5px rgba(0,0,0,0.5);
        }
        input.correct { border-color: var(--correct-color); background: rgba(0, 230, 118, 0.1); }
        input.wrong { border-color: var(--wrong-color); background: rgba(255, 82, 82, 0.1); }

        /* --- 記憶法提示區 --- */
        .mnemonic-box {
            display: none;
            margin-top: 15px;
            font-size: 15px;
            color: #ffd54f;
            text-align: left;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-left: 4px solid #ffd54f;
            border-radius: 6px;
            line-height: 1.6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- 練習模式排版 --- */
        .practice-row-container {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 15px 0;
        }
        .practice-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .col-zh { width: 35%; text-align: left; font-size: 16px; color: #bcaaa4; }
        .col-input { width: 35%; }
        .col-ans { width: 30%; text-align: right; color: var(--correct-color); font-weight: bold; font-size: 18px; }
        .answer-text { display: none; }
        
        #menu-screen, #exam-screen, #practice-screen { display: none; }
        #menu-screen.active, #exam-screen.active, #practice-screen.active {
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .ruby-text { font-size: 0.7em; display: block; color: var(--text-muted); margin-bottom: 4px;}
        #wrong-words { text-align: left; white-space: pre-wrap; margin-top: 20px; color: #ffab91; line-height: 1.8;}
    </style>
</head>
<body>

    <!-- 首頁選單 -->
    <div id="menu-screen" class="container active">
        <h1>寧寧的單字挑戰<br><span style="font-size:0.5em; color:var(--text-muted)">Cinematic Edition</span></h1>
        <p>請選擇你喜歡的學習模式：</p>
        <button onmouseenter="playSound('hover')" onclick="goToExam()">
            <span class="ruby-text">ㄎㄞ ㄕˇ ㄎㄠˇ ㄕˋ</span>
            開始考試
        </button>
        <button onmouseenter="playSound('hover')" onclick="goToPractice()">
            <span class="ruby-text">ㄨㄛˇ ㄧㄠˋ ㄌㄧㄢˋ ㄒㄧˊ</span>
            我要練習
        </button>
    </div>

    <!-- 考試模式 -->
    <div id="exam-screen" class="container">
        <h2>單字拼寫測驗</h2>
        <p style="color:var(--text-muted)">大小寫皆可，系統自動幫你判斷！</p>
        <div id="question" style="font-size: 24px; margin: 20px 0; color: #fff;">載入中...</div>
        <input type="text" id="exam-answer" placeholder="輸入英文拼寫..." autocomplete="off">
        <br>
        <button id="exam-submit" onmouseenter="playSound('hover')">提交答案</button>
        <div id="exam-result" style="font-size: 20px; margin-top: 20px; font-weight:bold;"></div>
        <div id="mnemonic" class="mnemonic-box"></div>
        <div id="score" style="font-size: 18px; margin-top: 15px; color: var(--text-muted);">分數: 0 / 0</div>
        <div id="wrong-words"></div>
        
        <div style="margin-top: 20px; display: flex; justify-content: center; flex-wrap: wrap;">
            <button id="exam-restart" style="display: none;" onmouseenter="playSound('hover')">重新開始</button>
            <button id="exam-retest" style="display: none; border-color: #ffd54f;" onmouseenter="playSound('hover')">重測錯題</button>
            <button onmouseenter="playSound('hover')" onclick="goHome()" style="background: rgba(255,255,255,0.1);">回首頁</button>
        </div>
    </div>

    <!-- 練習模式 -->
    <div id="practice-screen" class="container">
        <h2>單字練習室</h2>
        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
            <button onclick="goHome()" onmouseenter="playSound('hover')" style="background: rgba(255,255,255,0.1);">回首頁</button>
            <button id="toggle-all-btn" onclick="toggleAllAnswers()" onmouseenter="playSound('hover')" style="border-color: #ffd54f;">顯示所有答案 / 批改</button>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">
            <span style="width:35%; text-align:left;">中文意思</span>
            <span style="width:35%">拼寫練習</span>
            <span style="width:30%; text-align:right;">正確答案</span>
        </div>
        <div id="practice-list" style="margin-top: 10px;"></div>
    </div>

    <script>
        // Web Audio API 音效系統 (最高質感標準)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'hover') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // 單字庫 (過濾重複單字，總共 30 個)
        const words = [
            { en: 'fantasy', zh: '幻想', mnemonic: 'fan(粉絲) + tasy(聽起來像太帥) -> 粉絲總是有各種太帥的幻想。' },
            { en: 'worry', zh: '擔心', mnemonic: '聽起來像「我累」，整天擔心這擔心那，覺得「我好累」。' },
            { en: 'wonder', zh: '想知道/奇蹟', mnemonic: 'won(贏) + der(的人)。贏的人總能創造奇蹟，讓大家都想知道他怎麼辦到的。' },
            { en: 'extra', zh: '額外的', mnemonic: 'ex(向外) + tra。向外再多拿出來的，就是額外的。' },
            { en: 'go wading', zh: '涉水而行', mnemonic: 'wading 聽起來像「微等」。在水裡涉水而行時，步伐很慢，要「稍微等一下」。' },
            { en: 'late', zh: '遲到的', mnemonic: '聽起來像「累特」。遲到的人趕路跑過來，都「特別累」。' },
            { en: 'teacher', zh: '老師', mnemonic: 'teach(教) + er(的人)。教導我們的人就是老師。' },
            { en: 'tractor', zh: '牽引機/拖拉機', mnemonic: 'tract(拉、拖) + or(機器)。專門用來拖拉重物的機器。' },
            { en: 'doctor', zh: '醫生', mnemonic: '聽起來像「打克特」。能打敗(克)特殊病毒的人就是醫生。' },
            { en: 'sister', zh: '姊妹', mnemonic: '聽起來像「西施特」。我的姊妹跟西施一樣特別漂亮。' },
            { en: 'knife', zh: '刀子', mnemonic: 'k(不發音) + nife(聽起來像奈夫)。用刀子切東西需要耐心(奈夫)。' },
            { en: 'later', zh: '稍後', mnemonic: 'late(遲的) + r。比別人遲一點，就是稍後再做。' },
            { en: 'adopt', zh: '領養/採用', mnemonic: 'ad(去) + opt(選擇)。去選擇(option)一個孩子帶回家，就是領養。' },
            { en: 'blood', zh: '血液', mnemonic: '聽起來像「不辣的」。我的血液是甜的，是不辣的。' },
            { en: 'cash', zh: '現金', mnemonic: '聽起來像「喀擦」。打開收銀機拿出現金時，會發出「喀擦」的聲音。' },
            { en: 'cheer up', zh: '振作起來', mnemonic: 'cheer(歡呼) + up(向上)。向上歡呼，把心情提振起來！' },
            { en: 'stranger', zh: '陌生人', mnemonic: 'strange(奇怪的) + r(人)。看起來很奇怪、不認識的人就是陌生人。' },
            { en: 'swamp', zh: '沼澤', mnemonic: '聽起來像「死王八」(台語)。沼澤裡面常常藏著很多泥龜和青蛙。' },
            { en: 'flamingo', zh: '紅鶴', mnemonic: 'flame(火) + in + go。像火一樣紅的鳥走過來，就是紅鶴。' },
            { en: 'sick', zh: '生病的', mnemonic: '聽起來像「吸客」。診所裡有很多生病的人，真是超級「吸客」。' },
            { en: 'object', zh: '物體/反對', mnemonic: 'ob(反) + ject(扔)。把物體反扔回去，表示你「反對」。' },
            { en: 'purple', zh: '紫色', mnemonic: '聽起來像「婆婆」。婆婆最喜歡穿紫色的衣服。' },
            { en: 'nurse', zh: '護士', mnemonic: '聽起來像「那死」。護士就是負責從死神手裡搶救病人的天使。' },
            { en: 'star', zh: '星星', mnemonic: '聽起來像「死大」。宇宙中的星星有些體積「死」命「大」。' },
            { en: 'farm', zh: '農場', mnemonic: '聽起來像「發木」。農場裡面可以發芽長樹木。' },
            { en: 'camp', zh: '露營', mnemonic: '聽起來像「砍劈」。去露營的時候要砍柴生火。' },
            { en: 'eagle', zh: '老鷹', mnemonic: '聽起來像「伊狗」。這隻老鷹大到能抓起一隻狗(伊狗)。' },
            { en: 'full', zh: '滿的', mnemonic: '聽起來像「腹」。肚子吃得飽飽滿滿的。' },
            { en: 'giant', zh: '巨大的/巨人', mnemonic: '聽起來像「技安」(胖虎)。技安的體型像巨人一樣巨大。' },
            { en: 'earth', zh: '地球', mnemonic: '聽起來像「餓死」。如果不保護地球環境，大家都會餓死。' }
        ];

        /* --- 語音朗讀 API --- */
        function speakWord(word) {
            playSound('click');
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        /* --- 洗牌演算法 --- */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /* --- 頁面切換邏輯 --- */
        function switchScreen(screenId) {
            playSound('click');
            document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goHome() { switchScreen('menu-screen'); }

        function goToExam() {
            switchScreen('exam-screen');
            startGame(words);
        }

        function goToPractice() {
            switchScreen('practice-screen');
            renderPracticeList();
            resetPracticeState();
        }

        /* --- 練習模式邏輯 --- */
        let areAnswersVisible = false;

        function resetPracticeState() {
            areAnswersVisible = false;
            document.getElementById('toggle-all-btn').textContent = '顯示所有答案 / 批改';
        }

        function renderPracticeList() {
            const listContainer = document.getElementById('practice-list');
            listContainer.innerHTML = '';

            words.forEach((word, index) => {
                const div = document.createElement('div');
                div.className = 'practice-row-container';
                div.innerHTML = `
                    <div class="practice-row">
                        <div class="col-zh">${word.zh}</div>
                        <div class="col-input">
                            <input type="text" id="p-input-${index}" placeholder="輸入拼寫..." autocomplete="off">
                        </div>
                        <div class="col-ans">
                            <div id="ans-${index}" class="answer-text">
                                ${word.en}
                                <br><button class="tts-btn" onclick="speakWord('${word.en}')">🔊 聽發音</button>
                            </div>
                        </div>
                    </div>
                    <div id="p-mnemonic-${index}" class="mnemonic-box">
                        💡 <b>記憶提示：</b>${word.mnemonic}
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        document.getElementById('practice-screen').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') toggleAllAnswers();
        });

        function toggleAllAnswers() {
            playSound('click');
            const btn = document.getElementById('toggle-all-btn');
            const answers = document.querySelectorAll('.answer-text');
            const inputs = document.querySelectorAll('#practice-list input[type="text"]');

            areAnswersVisible = !areAnswersVisible;

            if (areAnswersVisible) {
                btn.textContent = '隱藏答案與提示';
                btn.style.borderColor = '#ff5252';
                
                answers.forEach(el => el.style.display = 'block');

                let allCorrect = true;
                inputs.forEach((input, index) => {
                    const userWord = input.value.trim().toLowerCase();
                    const correctWord = words[index].en.toLowerCase();
                    const mnemonicDiv = document.getElementById(`p-mnemonic-${index}`);
                    
                    if (userWord === correctWord) {
                        input.classList.add('correct');
                        input.classList.remove('wrong');
                        mnemonicDiv.style.display = 'none'; 
                    } else {
                        input.classList.add('wrong');
                        input.classList.remove('correct');
                        mnemonicDiv.style.display = 'block'; 
                        allCorrect = false;
                    }
                });
                
                if (allCorrect) playSound('correct');
                else playSound('wrong');

            } else {
                btn.textContent = '顯示所有答案 / 批改';
                btn.style.borderColor = '#ffd54f';
                answers.forEach(el => el.style.display = 'none');
                document.querySelectorAll('.mnemonic-box').forEach(el => el.style.display = 'none');
            }
        }

        /* --- 考試模式邏輯 --- */
        let currentQuestion = 0, score = 0, totalQuestions = 0;
        let questions = [], wrongWords = [];
        let isWaitingToContinue = false;

        function startGame(wordList) {
            questions = [...wordList];
            totalQuestions = questions.length;
            shuffle(questions);
            currentQuestion = 0; score = 0; wrongWords = []; isWaitingToContinue = false;
            
            document.getElementById('exam-restart').style.display = 'none';
            document.getElementById('exam-retest').style.display = 'none';
            document.getElementById('wrong-words').textContent = '';
            document.getElementById('exam-answer').style.display = 'inline-block';
            document.getElementById('exam-submit').style.display = 'inline-block';
            document.getElementById('exam-submit').textContent = '提交答案';
            document.getElementById('mnemonic').style.display = 'none';
            
            nextQuestion();
        }

        function nextQuestion() {
            if (currentQuestion >= totalQuestions) { endGame(); return; }
            const q = questions[currentQuestion];
            
            document.getElementById('mnemonic').style.display = 'none';
            isWaitingToContinue = false;
            document.getElementById('exam-submit').textContent = '提交答案';
            document.getElementById('question').innerHTML = `請輸入 <b>"${q.zh}"</b> 的英文：`;
            document.getElementById('exam-answer').value = '';
            document.getElementById('exam-result').textContent = '';
            
            document.getElementById('score').textContent = `目前分數: ${score} / ${totalQuestions}`;
            setTimeout(() => document.getElementById('exam-answer').focus(), 50);
        }

        function checkExamAnswer() {
            if (isWaitingToContinue) {
                currentQuestion++;
                nextQuestion();
                return;
            }

            const userAnswer = document.getElementById('exam-answer').value.trim().toLowerCase();
            const q = questions[currentQuestion];
            const correctAnswer = q.en.toLowerCase();

            if (userAnswer === correctAnswer) {
                playSound('correct');
                score++;
                document.getElementById('exam-result').textContent = '答對了！太厲害了！';
                document.getElementById('exam-result').style.color = 'var(--correct-color)';
                setTimeout(() => { currentQuestion++; nextQuestion(); }, 1200);
            } else {
                playSound('wrong');
                document.getElementById('exam-result').textContent = `錯誤，正確答案是：${q.en}`;
                document.getElementById('exam-result').style.color = 'var(--wrong-color)';
                
                const mnemonicEl = document.getElementById('mnemonic');
                mnemonicEl.innerHTML = `
                    💡 <b>記憶提示：</b>${q.mnemonic}
                    <br><br><button class="tts-btn" onclick="speakWord('${q.en}')">🔊 聽正確發音</button>
                `;
                mnemonicEl.style.display = 'block';
                
                document.getElementById('exam-submit').textContent = '點擊繼續下一題';
                wrongWords.push({ zh: q.zh, en: q.en, user: userAnswer, mnemonic: q.mnemonic });
                isWaitingToContinue = true;
            }
            document.getElementById('score').textContent = `目前分數: ${score} / ${totalQuestions}`;
        }

        function endGame() {
            document.getElementById('mnemonic').style.display = 'none';
            document.getElementById('question').textContent = '測驗結束！';
            document.getElementById('exam-answer').style.display = 'none';
            document.getElementById('exam-submit').style.display = 'none';
            document.getElementById('exam-result').innerHTML = `你的最終分數：<br><span style="font-size:40px; color:var(--text-accent);">${score} / ${totalQuestions}</span>`;
            
            if (score === totalQuestions) {
                playSound('correct');
                document.getElementById('wrong-words').innerHTML = '<span style="color:var(--correct-color);">太完美了！你全部答對了！</span>';
            } else {
                let wrongText = '你答錯的單字：\n\n';
                wrongWords.forEach(w => {
                    wrongText += `❌ ${w.zh}\n👉 你的答案: "${w.user}"\n✅ 正確答案: "${w.en}"\n\n`;
                });
                document.getElementById('wrong-words').textContent = wrongText;
                document.getElementById('exam-retest').style.display = 'inline-block';
            }
            document.getElementById('exam-restart').style.display = 'inline-block';
        }

        document.getElementById('exam-submit').addEventListener('click', checkExamAnswer);
        document.getElementById('exam-answer').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkExamAnswer();
        });
        document.getElementById('exam-restart').addEventListener('click', () => { playSound('click'); startGame(words); });
        document.getElementById('exam-retest').addEventListener('click', () => {
            playSound('click');
            if (wrongWords.length > 0) {
                const retestWords = wrongWords.map(w => ({ en: w.en, zh: w.zh, mnemonic: w.mnemonic }));
                startGame(retestWords);
            }
        });
    </script>
</body>
</html>
