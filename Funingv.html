<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寧寧的英文單字特訓營</title>
    <style>
        /* --- 全局深色霓虹主題 --- */
        :root {
            --bg-main: #0b0f19;
            --bg-card: #161f30;
            --bg-elevated: #1e293b;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-subtle: #334155;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(6, 182, 212, 0.14) 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.14) 0%, transparent 35%);
            color: var(--text-primary);
            padding: 16px;
        }

        /* --- 注音排版優化 --- */
        ruby {
            ruby-align: center;
            line-height: 2.15;
            margin: 0 1px;
        }
        rt {
            font-size: 0.6em;
            color: #38bdf8;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        /* --- 主容器 --- */
        .container {
            background: var(--bg-card);
            border: 2px solid var(--border-subtle);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.55), 0 0 25px rgba(6, 182, 212, 0.15);
            width: 100%;
            max-width: 720px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 28px;
            text-align: center;
            position: relative;
        }

        /* --- 捲軸美化 --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            background: linear-gradient(90deg, #38bdf8, #f472b6, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            display: inline-block;
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid var(--accent-pink);
            color: #fbcfe8;
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* --- 通用按鈕 --- */
        button {
            font-family: inherit;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        button:active:not(:disabled) { transform: scale(0.96); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }

        /* --- 首頁選單 --- */
        #menu-screen { display: block; }
        .menu-btn {
            display: block;
            width: 85%;
            max-width: 380px;
            margin: 18px auto;
            padding: 16px 24px;
            font-size: 20px;
            color: #fff;
        }
        .btn-exam-start {
            background: linear-gradient(135deg, #06b6d4, #2563eb);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.35);
        }
        .btn-practice-start {
            background: linear-gradient(135deg, #ec4899, #f59e0b);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
        }

        /* --- 考試模式 --- */
        #exam-screen { display: none; }
        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-elevated);
            padding: 10px 18px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 1px solid var(--border-subtle);
            font-size: 16px;
        }
        .exam-prompt {
            font-size: 18px;
            color: #e2e8f0;
            margin-bottom: 12px;
        }
        .tts-hero-btn {
            background: linear-gradient(135deg, #06b6d4, #0284c7);
            color: white;
            padding: 10px 22px;
            font-size: 17px;
            border-radius: 999px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
            margin-bottom: 16px;
        }
        .exam-input {
            width: 85%;
            max-width: 420px;
            padding: 14px 18px;
            font-size: 20px;
            border-radius: 12px;
            border: 2px solid #475569;
            background: #0f172a;
            color: #fff;
            text-align: center;
            margin-bottom: 16px;
        }
        .exam-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.35);
        }
        .exam-input:disabled {
            background: #1e1b24;
            border-color: #ef4444;
            color: #94a3b8;
        }

        .options-box {
            width: 85%;
            max-width: 480px;
            margin: 0 auto 18px auto;
            background: #0f172a;
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 14px 18px;
            text-align: left;
        }
        .options-title {
            font-size: 15px;
            color: var(--accent-amber);
            margin-bottom: 10px;
        }
        .option-label {
            display: flex;
            align-items: center;
            background: var(--bg-elevated);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 17px;
            transition: background 0.15s, border-color 0.15s;
        }
        .option-label:hover { background: #273549; border-color: var(--accent-cyan); }
        .option-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: var(--accent-pink);
            cursor: pointer;
        }

        .btn-submit {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 12px 32px;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
        }
        .btn-next {
            display: none;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #fff;
            padding: 12px 32px;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .btn-home-sub {
            background: #334155;
            color: #e2e8f0;
            padding: 10px 22px;
            font-size: 15px;
            margin-top: 18px;
        }

        #exam-feedback {
            margin-top: 16px;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.8;
        }
        .mnemonic-panel {
            display: none;
            margin: 14px auto;
            width: 90%;
            background: rgba(236, 72, 153, 0.12);
            border: 1px solid var(--accent-pink);
            border-left: 5px solid var(--accent-pink);
            border-radius: 12px;
            padding: 14px 18px;
            text-align: left;
            font-size: 16px;
            line-height: 2.1;
        }

        /* --- 考後總結 --- */
        #exam-summary {
            display: none;
            text-align: left;
            margin-top: 18px;
        }
        .summary-stats {
            background: var(--bg-elevated);
            border: 2px solid var(--accent-cyan);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            margin-bottom: 18px;
        }
        .wrong-card {
            background: #0f172a;
            border: 1px solid #ef4444;
            border-left: 5px solid #ef4444;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            line-height: 2.0;
        }
        .mini-tts-btn {
            background: var(--accent-cyan);
            color: #0b0f19;
            padding: 4px 12px;
            font-size: 14px;
            border-radius: 999px;
            margin-left: 8px;
        }

        /* --- 練習模式 --- */
        #practice-screen {
            display: none;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }
        .practice-toolbar {
            background: #0f172a;
            padding: 18px 22px;
            border-bottom: 2px solid var(--border-subtle);
            flex-shrink: 0;
        }
        .toolbar-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .btn-global-reveal {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            padding: 10px 18px;
            font-size: 15px;
        }
        .btn-global-reset {
            background: #334155;
            color: #f8fafc;
            padding: 10px 18px;
            font-size: 15px;
        }
        .btn-toolbar-home {
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 10px 16px;
            font-size: 15px;
        }

        #practice-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 22px 24px 22px;
            text-align: left;
        }
        .word-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .word-card-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .word-zh-box {
            flex: 1 1 200px;
            font-size: 18px;
            color: #fde047;
            font-weight: bold;
        }
        .word-input-box {
            flex: 1 1 180px;
        }
        .practice-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 17px;
            border-radius: 10px;
            border: 2px solid #475569;
            background: #0f172a;
            color: #fff;
        }
        .practice-input.correct { border-color: var(--accent-emerald); background: rgba(16, 185, 129, 0.15); }
        .practice-input.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); }

        .word-card-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .btn-card-tts {
            background: rgba(6, 182, 212, 0.2);
            border: 1px solid var(--accent-cyan);
            color: #67e8f9;
            padding: 6px 14px;
            font-size: 14px;
        }
        .btn-card-reveal {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid var(--accent-amber);
            color: #fde68a;
            padding: 6px 14px;
            font-size: 14px;
        }
        .card-answer-area {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #475569;
            font-size: 16px;
            line-height: 2.1;
        }
        .revealed-en {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-emerald);
        }
    </style>
</head>
<body>

    <!-- 1. 首頁選單 -->
    <div id="menu-screen" class="container">
        <h1>✨ <ruby>寧<rt>ㄋㄧㄥˊ</rt></ruby><ruby>寧<rt>ㄋㄧㄥˊ</rt></ruby><ruby>的<rt>ㄉㄜ˙</rt></ruby><ruby>英<rt>ㄧㄥ</rt></ruby><ruby>文<rt>ㄨㄣˊ</rt></ruby><ruby>單<rt>ㄉㄢ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby><ruby>特<rt>ㄊㄜˋ</rt></ruby><ruby>訓<rt>ㄒㄩㄣˋ</rt></ruby><ruby>營<rt>ㄧㄥˊ</rt></ruby> ✨</h1>
        <div class="badge">🎯 <ruby>共<rt>ㄍㄨㄥˋ</rt></ruby> 15 <ruby>個<rt>ㄍㄜ˙</rt></ruby><ruby>精<rt>ㄐㄧㄥ</rt></ruby><ruby>選<rt>ㄒㄩㄢˇ</rt></ruby><ruby>單<rt>ㄉㄢ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby></div>
        <p style="color: var(--text-secondary); font-size: 17px;">
            <ruby>請<rt>ㄑㄧㄥˇ</rt></ruby><ruby>選<rt>ㄒㄩㄢˇ</rt></ruby><ruby>擇<rt>ㄗㄜˊ</rt></ruby><ruby>挑<rt>ㄊㄧㄠ</rt></ruby><ruby>戰<rt>ㄓㄢˋ</rt></ruby><ruby>模<rt>ㄇㄛˊ</rt></ruby><ruby>式<rt>ㄕˋ</rt></ruby>：
        </p>

        <button class="menu-btn btn-exam-start" onclick="goToExam()">
            🏆 <ruby>開<rt>ㄎㄞ</rt></ruby><ruby>始<rt>ㄕˇ</rt></ruby><ruby>考<rt>ㄎㄠˇ</rt></ruby><ruby>試<rt>ㄕˋ</rt></ruby>
        </button>

        <button class="menu-btn btn-practice-start" onclick="goToPractice()">
            📘 <ruby>我<rt>ㄨㄛˇ</rt></ruby><ruby>要<rt>ㄧㄠˋ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt></ruby><ruby>習<rt>ㄒㄧˊ</rt></ruby>
        </button>
    </div>

    <!-- 2. 考試模式 -->
    <div id="exam-screen" class="container">
        <div class="exam-header">
            <span id="exam-progress"></span>
            <span id="exam-score" style="color: var(--accent-emerald); font-weight: bold;"></span>
        </div>

        <div id="exam-active-area">
            <div class="exam-prompt">
                🎧 <ruby>請<rt>ㄑㄧㄥˇ</rt></ruby><ruby>聽<rt>ㄊㄧㄥ</rt></ruby><ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby>，<ruby>拼<rt>ㄆㄧㄣ</rt></ruby><ruby>出<rt>ㄔㄨ</rt></ruby><ruby>英<rt>ㄧㄥ</rt></ruby><ruby>文<rt>ㄨㄣˊ</rt></ruby><ruby>單<rt>ㄉㄢ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby>，<ruby>並<rt>ㄅㄧㄥˋ</rt></ruby><ruby>勾<rt>ㄍㄡ</rt></ruby><ruby>選<rt>ㄒㄩㄢˇ</rt></ruby><ruby>所<rt>ㄙㄨㄛˇ</rt></ruby><ruby>有<rt>ㄧㄡˇ</rt></ruby><ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>的<rt>ㄉㄜ˙</rt></ruby><ruby>中<rt>ㄓㄨㄥ</rt></ruby><ruby>文<rt>ㄨㄣˊ</rt></ruby><ruby>意<rt>ㄧˋ</rt></ruby><ruby>思<rt>ㄙ</rt></ruby>：
            </div>

            <button class="tts-hero-btn" onclick="speakCurrentExamWord()">
                🔊 <ruby>聽<rt>ㄊㄧㄥ</rt></ruby><ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby>
            </button>
            <br>

            <input type="text" id="exam-input" class="exam-input" placeholder="輸入英文單字 (大小寫皆可)" autocomplete="off">

            <div class="options-box">
                <div class="options-title">
                    ☑️ <ruby>請<rt>ㄑㄧㄥˇ</rt></ruby><ruby>選<rt>ㄒㄩㄢˇ</rt></ruby><ruby>出<rt>ㄔㄨ</rt></ruby><ruby>全<rt>ㄑㄩㄢˊ</rt></ruby><ruby>部<rt>ㄅㄨˋ</rt></ruby><ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>意<rt>ㄧˋ</rt></ruby><ruby>思<rt>ㄙ</rt></ruby>（<ruby>可<rt>ㄎㄜˇ</rt></ruby><ruby>能<rt>ㄋㄥˊ</rt></ruby><ruby>不<rt>ㄅㄨˋ</rt></ruby><ruby>止<rt>ㄓˇ</rt></ruby><ruby>一<rt>ㄧ</rt></ruby><ruby>個<rt>ㄍㄜ˙</rt></ruby>）：
                </div>
                <div id="exam-options-list"></div>
            </div>

            <button id="exam-submit-btn" class="btn-submit" onclick="submitExamAnswer()">
                ✅ <ruby>送<rt>ㄙㄨㄥˋ</rt></ruby><ruby>出<rt>ㄔㄨ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>案<rt>ㄢˋ</rt></ruby>
            </button>

            <button id="exam-next-btn" class="btn-next" onclick="goNextQuestion()">
                ⏭️ <ruby>下<rt>ㄒㄧㄚˋ</rt></ruby><ruby>一<rt>ㄧ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby>
            </button>

            <div id="exam-feedback"></div>
            <div id="exam-mnemonic" class="mnemonic-panel"></div>
        </div>

        <!-- 測驗完成總結畫面 -->
        <div id="exam-summary"></div>

        <button class="btn-home-sub" onclick="goHome()">
            🏠 <ruby>回<rt>ㄏㄨㄟˊ</rt></ruby><ruby>首<rt>ㄕㄡˇ</rt></ruby><ruby>頁<rt>ㄧㄝˋ</rt></ruby>
        </button>
    </div>

    <!-- 3. 練習模式 -->
    <div id="practice-screen" class="container">
        <div class="practice-toolbar">
            <h2 style="margin: 0; color: #38bdf8; font-size: 22px;">
                📘 <ruby>單<rt>ㄉㄢ</rt></ruby><ruby>字<rt>ㄗˋ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt></ruby><ruby>習<rt>ㄒㄧˊ</rt></ruby><ruby>室<rt>ㄕˋ</rt></ruby>
            </h2>
            <div class="toolbar-actions">
                <button class="btn-global-reveal" onclick="revealAllPractice()">
                    🚀 <ruby>一<rt>ㄧ</rt></ruby><ruby>鍵<rt>ㄐㄧㄢˋ</rt></ruby><ruby>公<rt>ㄍㄨㄥ</rt></ruby><ruby>布<rt>ㄅㄨˋ</rt></ruby><ruby>全<rt>ㄑㄩㄢˊ</rt></ruby><ruby>部<rt>ㄅㄨˋ</rt></ruby>
                </button>
                <button class="btn-global-reset" onclick="resetAllPractice()">
                    🧹 <ruby>清<rt>ㄑㄧㄥ</rt></ruby><ruby>空<rt>ㄎㄨㄥ</rt></ruby><ruby>重<rt>ㄔㄨㄥˊ</rt></ruby><ruby>練<rt>ㄌㄧㄢˋ</rt></ruby>
                </button>
                <button class="btn-toolbar-home" onclick="goHome()">
                    🏠 <ruby>回<rt>ㄏㄨㄟˊ</rt></ruby><ruby>首<rt>ㄕㄡˇ</rt></ruby><ruby>頁<rt>ㄧㄝˋ</rt></ruby>
                </button>
            </div>
        </div>
        <div id="practice-list"></div>
    </div>

    <script>
        const words = [
            {
                en: 'bat',
                zh: [
                    '<ruby>蝙<rt>ㄅㄧㄢ</rt></ruby><ruby>蝠<rt>ㄈㄨˊ</rt></ruby>',
                    '<ruby>球<rt>ㄑㄧㄡˊ</rt></ruby><ruby>棒<rt>ㄅㄤˋ</rt></ruby>'
                ],
                mnemonic: '<ruby>想<rt>ㄒㄧㄤˇ</rt></ruby><ruby>像<rt>ㄒㄧㄤˋ</rt></ruby><ruby>一<rt>ㄧˋ</rt></ruby><ruby>隻<rt>ㄓ</rt></ruby><ruby>蝙<rt>ㄅㄧㄢ</rt></ruby><ruby>蝠<rt>ㄈㄨˊ</rt></ruby><ruby>拿<rt>ㄋㄚˊ</rt></ruby><ruby>著<rt>ㄓㄜ˙</rt></ruby><ruby>球<rt>ㄑㄧㄡˊ</rt></ruby><ruby>棒<rt>ㄅㄤˋ</rt></ruby><ruby>在<rt>ㄗㄞˋ</rt></ruby><ruby>打<rt>ㄉㄚˇ</rt></ruby><ruby>棒<rt>ㄅㄤˋ</rt></ruby><ruby>球<rt>ㄑㄧㄡˊ</rt></ruby>！'
            },
            {
                en: 'glide',
                zh: [
                    '<ruby>滑<rt>ㄏㄨㄚˊ</rt></ruby><ruby>行<rt>ㄒㄧㄥˊ</rt></ruby>',
                    '<ruby>滑<rt>ㄏㄨㄚˊ</rt></ruby><ruby>翔<rt>ㄒㄧㄤˊ</rt></ruby>'
                ],
                mnemonic: '<ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby><ruby>和<rt>ㄏㄢˋ</rt></ruby> slide (<ruby>滑<rt>ㄏㄨㄚˊ</rt></ruby><ruby>動<rt>ㄉㄨㄥˋ</rt></ruby>) <ruby>很<rt>ㄏㄣˇ</rt></ruby><ruby>像<rt>ㄒㄧㄤˋ</rt></ruby>，<ruby>像<rt>ㄒㄧㄤˋ</rt></ruby><ruby>老<rt>ㄌㄠˇ</rt></ruby><ruby>鷹<rt>ㄧㄥ</rt></ruby><ruby>在<rt>ㄗㄞˋ</rt></ruby><ruby>空<rt>ㄎㄨㄥ</rt></ruby><ruby>中<rt>ㄓㄨㄥ</rt></ruby><ruby>順<rt>ㄕㄨㄣˋ</rt></ruby><ruby>暢<rt>ㄔㄤˋ</rt></ruby><ruby>地<rt>ㄉㄜ˙</rt></ruby><ruby>滑<rt>ㄏㄨㄚˊ</rt></ruby><ruby>翔<rt>ㄒㄧㄤˊ</rt></ruby>。'
            },
            {
                en: 'dig',
                zh: [

        /* --- 語音朗讀 (TTS) --- */
        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的瀏覽器不支援語音朗讀功能。');
            }
        }

        /* --- 標準迴圈洗牌 --- */
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = arr[i];
                arr[i] = arr[j];
                arr[j] = tmp;
            }
        }

        /* --- 頁面切換 --- */
        function goHome() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('exam-screen').style.display = 'none';
            document.getElementById('practice-screen').style.display = 'none';
        }

        function goToExam() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('exam-screen').style.display = 'block';
            document.getElementById('practice-screen').style.display = 'none';
            startExam(words);
        }

        function goToPractice() {
            document.getElementById('menu-screen').style.display = 'none';

            document.getElementById('practice-screen').style.display = 'flex';
            renderPracticeList();
        }

            const container = document.getElementById('practice-list');

        function revealSinglePractice(index) {
            const inputEl = document.getElementById(`p-input-${index}`);
            const ansEl = document.getElementById(`p-ans-${index}`);
            const userVal = inputEl.value.trim().toLowerCase();
            const correctVal = words[index].en.toLowerCase();

            ansEl.style.display = 'block';
            if (userVal === correctVal) {
                inputEl.classList.add('correct');
                inputEl.classList.remove('wrong');
            } else if (userVal !== '') {
                inputEl.classList.add('wrong');
                inputEl.classList.remove('correct');
            }
        }

        function revealAllPractice() {
            for (let i = 0; i < words.length; i++) {
                revealSinglePractice(i);
            }
        }

        function resetAllPractice() {
            for (let i = 0; i < words.length; i++) {
                const inputEl = document.getElementById(`p-input-${i}`);
                const ansEl = document.getElementById(`p-ans-${i}`);
                inputEl.value = '';
                inputEl.classList.remove('correct', 'wrong');
                ansEl.style.display = 'none';
            }
        }

        /* --- 考試模式邏輯 --- */
        let examQuestions = [];
        let currentIdx = 0;
        let examScore = 0;
        let wrongWords = [];
        let currentOptions = [];
        let isWaitingNext = false;

        function buildMultipleChoiceOptions(wordObj) {
            const opts = [...wordObj.zh];
            const pool = [];
            for (let i = 0; i < words.length; i++) {
                if (words[i].en !== wordObj.en) {
                    for (let j = 0; j < words[i].zh.length; j++) {
                        pool.push(words[i].zh[j]);
                    }
                }
            }
            shuffle(pool);
            const targetCount = Math.max(4, wordObj.zh.length + 2);
            while (opts.length < targetCount && pool.length > 0) {
                const candidate = pool.pop();
                if (!opts.includes(candidate)) {
                    opts.push(candidate);
                }
            }
            shuffle(opts);
            return opts;
        }

        function startExam(list) {
            examQuestions = [...list];
            shuffle(examQuestions);
            currentIdx = 0;
            examScore = 0;
            wrongWords = [];
            isWaitingNext = false;

            document.getElementById('exam-active-area').style.display = 'block';
            document.getElementById('exam-summary').style.display = 'none';
            loadExamQuestion();
        }

        function loadExamQuestion() {
            if (currentIdx >= examQuestions.length) {
                finishExam();
                return;
            }

            isWaitingNext = false;
            const q = examQuestions[currentIdx];

            document.getElementById('exam-progress').innerHTML = `<ruby>第<rt>ㄉㄧˋ</rt></ruby> ${currentIdx + 1} / ${examQuestions.length} <ruby>題<rt>ㄊㄧˊ</rt></ruby>`;
            document.getElementById('exam-score').innerHTML = `<ruby>得<rt>ㄉㄜˊ</rt></ruby><ruby>分<rt>ㄈㄣ</rt></ruby>：${examScore}`;

            const inputEl = document.getElementById('exam-input');
            inputEl.value = '';
            inputEl.disabled = false;

            document.getElementById('exam-submit-btn').style.display = 'inline-block';
            document.getElementById('exam-next-btn').style.display = 'none';
            document.getElementById('exam-feedback').innerHTML = '';
            document.getElementById('exam-mnemonic').style.display = 'none';

            currentOptions = buildMultipleChoiceOptions(q);
            const optionsListEl = document.getElementById('exam-options-list');
            optionsListEl.innerHTML = '';

            for (let i = 0; i < currentOptions.length; i++) {
                const label = document.createElement('label');
                label.className = 'option-label';
                label.innerHTML = `<input type="checkbox" class="exam-cb" value="${i}"><span>${currentOptions[i]}</span>`;
                optionsListEl.appendChild(label);
            }

            setTimeout(() => {
                speakWord(q.en);
                inputEl.focus();
            }, 150);
        }

        function speakCurrentExamWord() {
            if (currentIdx < examQuestions.length) {
                speakWord(examQuestions[currentIdx].en);
            }
        }

        function submitExamAnswer() {
            if (isWaitingNext) return;

            const q = examQuestions[currentIdx];
            const inputEl = document.getElementById('exam-input');
            const userSpelling = inputEl.value.trim().toLowerCase();
            const correctSpelling = q.en.toLowerCase();

            const checkboxes = document.querySelectorAll('.exam-cb');
            const selectedMeanings = [];
            for (let i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].checked) {
                    selectedMeanings.push(currentOptions[parseInt(checkboxes[i].value, 10)]);
                }
            }

            const isSpellRight = (userSpelling === correctSpelling);
            const isMeaningRight = (selectedMeanings.length === q.zh.length) &&
                q.zh.every(m => selectedMeanings.includes(m));

            if (isSpellRight && isMeaningRight) {
                examScore++;
                document.getElementById('exam-score').innerHTML = `<ruby>得<rt>ㄉㄜˊ</rt></ruby><ruby>分<rt>ㄈㄣ</rt></ruby>：${examScore}`;
                document.getElementById('exam-feedback').style.color = '#10b981';
                document.getElementById('exam-feedback').innerHTML = `🎉 <ruby>完<rt>ㄨㄢˊ</rt></ruby><ruby>全<rt>ㄑㄩㄢˊ</rt></ruby><ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby>！`;
                inputEl.disabled = true;
                for (let i = 0; i < checkboxes.length; i++) checkboxes[i].disabled = true;
                document.getElementById('exam-submit-btn').style.display = 'none';

                setTimeout(() => {
                    currentIdx++;
                    loadExamQuestion();
                }, 900);
            } else {
                // 答錯：立即暫停、鎖定輸入框與選項、隱藏送出鈕、只開放下一題
                isWaitingNext = true;
                inputEl.disabled = true;
                for (let i = 0; i < checkboxes.length; i++) {
                    checkboxes[i].disabled = true;
                }
                document.getElementById('exam-submit-btn').style.display = 'none';
                document.getElementById('exam-next-btn').style.display = 'inline-block';

                document.getElementById('exam-feedback').style.color = '#f87171';
                document.getElementById('exam-feedback').innerHTML = `
                    ❌ <ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>囉<rt>ㄌㄨㄛ˙</rt></ruby>！<br>
                    ✅ <ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>拼<rt>ㄆㄧㄣ</rt></ruby><ruby>法<rt>ㄈㄚˇ</rt></ruby>：<span style="color:#10b981; font-size:22px;">${q.en}</span>
                    <button class="mini-tts-btn" onclick="speakWord('${q.en}')">🔊 <ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby></button><br>
                    ✅ <ruby>正<rt>ㄓㄥˋ</rt></ruby><ruby>確<rt>ㄑㄩㄝˋ</rt></ruby><ruby>中<rt>ㄓㄨㄥ</rt></ruby><ruby>文<rt>ㄨㄣˊ</rt></ruby>：<span style="color:#fde047;">${q.zh.join(' ／ ')}</span>
                `;

                const mnemonicPanel = document.getElementById('exam-mnemonic');
                mnemonicPanel.innerHTML = `💡 <ruby>記<rt>ㄐㄧˋ</rt></ruby><ruby>憶<rt>ㄧˋ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt></ruby><ruby>竅<rt>ㄑㄧㄠˋ</rt></ruby>：${q.mnemonic}`;
                mnemonicPanel.style.display = 'block';

                wrongWords.push(q);
            }
        }

        function goNextQuestion() {
            currentIdx++;
            loadExamQuestion();
        }

        function finishExam() {
            document.getElementById('exam-active-area').style.display = 'none';
            const summaryEl = document.getElementById('exam-summary');
            summaryEl.style.display = 'block';

            const total = examQuestions.length;
            const rate = Math.round((examScore / total) * 100);

            let html = `
                <div class="summary-stats">
                    🏆 <ruby>測<rt>ㄘㄜˋ</rt></ruby><ruby>驗<rt>ㄧㄢˋ</rt></ruby><ruby>完<rt>ㄨㄢˊ</rt></ruby><ruby>成<rt>ㄔㄥˊ</rt></ruby>！<br>
                    <ruby>總<rt>ㄗㄨㄥˇ</rt></ruby><ruby>得<rt>ㄉㄜˊ</rt></ruby><ruby>分<rt>ㄈㄣ</rt></ruby>：<span style="color:#10b981;">${examScore} / ${total}</span>（<ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>對<rt>ㄉㄨㄟˋ</rt></ruby><ruby>率<rt>ㄌㄩˋ</rt></ruby> ${rate}%）
                </div>
            `;

            if (wrongWords.length === 0) {
                html += `<div style="text-align:center; color:#10b981; font-size:20px; padding:16px;">🎉 <ruby>太<rt>ㄊㄞˋ</rt></ruby><ruby>厲<rt>ㄌㄧˋ</rt></ruby><ruby>害<rt>ㄏㄞˋ</rt></ruby><ruby>了<rt>ㄌㄜ˙</rt></ruby>！<ruby>全<rt>ㄑㄩㄢˊ</rt></ruby><ruby>部<rt>ㄅㄨˋ</rt></ruby><ruby>答<rt>ㄉㄚˊ</rt></ruby><ruby>對<rt>ㄉㄨㄟˋ</rt></ruby>！</div>`;
            } else {
                html += `<h3 style="color:#f87171;">📋 <ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby><ruby>總<rt>ㄗㄨㄥˇ</rt></ruby><ruby>結<rt>ㄐㄧㄝˊ</rt></ruby> ／ <ruby>複<rt>ㄈㄨˋ</rt></ruby><ruby>習<rt>ㄒㄧˊ</rt></ruby><ruby>清<rt>ㄑㄧㄥ</rt></ruby><ruby>單<rt>ㄉㄢ</rt></ruby>：</h3>`;
                for (let i = 0; i < wrongWords.length; i++) {
                    const w = wrongWords[i];
                    html += `
                        <div class="wrong-card">
                            <div>
                                <span style="font-size:20px; font-weight:bold; color:#10b981;">${w.en}</span>
                                <button class="mini-tts-btn" onclick="speakWord('${w.en}')">🔊 <ruby>發<rt>ㄈㄚ</rt></ruby><ruby>音<rt>ㄧㄣ</rt></ruby></button>
                            </div>
                            <div style="color:#fde047;">📌 <ruby>中<rt>ㄓㄨㄥ</rt></ruby><ruby>文<rt>ㄨㄣˊ</rt></ruby><ruby>釋<rt>ㄕˋ</rt></ruby><ruby>義<rt>ㄧˋ</rt></ruby>：${w.zh.join(' ／ ')}</div>
                            <div style="color:#cbd5e1;">💡 <ruby>記<rt>ㄐㄧˋ</rt></ruby><ruby>憶<rt>ㄧˋ</rt></ruby><ruby>訣<rt>ㄐㄩㄝˊ</rt></ruby><ruby>竅<rt>ㄑㄧㄠˋ</rt></ruby>：${w.mnemonic}</div>
                        </div>
                    `;
                }
                html += `
                    <div style="text-align:center; margin-top:16px;">
                        <button class="btn-next" style="display:inline-block;" onclick="retestWrongWords()">
                            🔄 <ruby>針<rt>ㄓㄣ</rt></ruby><ruby>對<rt>ㄉㄨㄟˋ</rt></ruby><ruby>錯<rt>ㄘㄨㄛˋ</rt></ruby><ruby>題<rt>ㄊㄧˊ</rt></ruby><ruby>重<rt>ㄔㄨㄥˊ</rt></ruby><ruby>新<rt>ㄒㄧㄣ</rt></ruby><ruby>測<rt>ㄘㄜˋ</rt></ruby><ruby>驗<rt>ㄧㄢˋ</rt></ruby>
                        </button>
                    </div>
                `;
            }

            html += `
                <div style="text-align:center; margin-top:12px;">
                    <button class="btn-submit" onclick="startExam(words)">
                        🔁 <ruby>重<rt>ㄔㄨㄥˊ</rt></ruby><ruby>新<rt>ㄒㄧㄣ</rt></ruby><ruby>開<rt>ㄎㄞ</rt></ruby><ruby>始<rt>ㄕˇ</rt></ruby><ruby>完<rt>ㄨㄢˊ</rt></ruby><ruby>整<rt>ㄓㄥˇ</rt></ruby><ruby>測<rt>ㄘㄜˋ</rt></ruby><ruby>驗<rt>ㄧㄢˋ</rt></ruby>
                    </button>
                </div>
            `;

            summaryEl.innerHTML = html;
        }

        function retestWrongWords() {
            if (wrongWords.length > 0) {
                startExam([...wrongWords]);
            }
        }

        document.getElementById('exam-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !isWaitingNext) {
                submitExamAnswer();
            }
        });
    </script>
</body>
</html>
